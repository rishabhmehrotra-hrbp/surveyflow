<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SurveyFlow – Organizational Survey Platform</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
html,body,#root{height:100%;min-height:100vh}
body{background:#f0f4ff}
:root{--p:#4361ee;--pd:#3a0ca3;--ac:#f72585;--su:#2ec4b6;--wa:#ff9f1c;--da:#e63946;--bd:#e2e8f0;--mu:#64748b;--tx:#1a1a2e;--wh:#fff}
.app{min-height:100vh;background:#f0f4ff}
.nav{background:var(--pd);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(58,12,163,0.3)}
.nav-logo{font-size:20px;font-weight:800;letter-spacing:-0.5px}
.nav-logo em{background:var(--ac);font-style:normal;border-radius:5px;padding:2px 8px;font-size:13px;margin-left:8px}
.nav-r{display:flex;align-items:center;gap:12px;font-size:13px}
.lay{display:flex;min-height:calc(100vh - 56px)}
.side{width:220px;background:#fff;border-right:1px solid var(--bd);padding:14px 0;flex-shrink:0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.si{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:14px;color:var(--mu);cursor:pointer;border-left:3px solid transparent;transition:all 0.15s}
.si:hover{background:#f8faff;color:var(--p)}
.si.on{background:#eef2ff;color:var(--p);border-left-color:var(--p);font-weight:600}
.side-section{margin:14px 18px 6px;font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
.main{flex:1;padding:24px;overflow-y:auto}
.card{background:#fff;border-radius:12px;border:1px solid var(--bd);padding:20px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all 0.15s}
.bp{background:var(--p);color:#fff}.bp:hover{background:#3451d1}
.bs{background:var(--su);color:#fff}.bs:hover{filter:brightness(1.05)}
.bd2{background:var(--da);color:#fff}
.bw{background:var(--wa);color:#fff}
.bo{background:#fff;color:var(--p);border:1.5px solid var(--p)}.bo:hover{background:#eef2ff}
.bg2{background:#fff;color:var(--mu);border:1px solid var(--bd)}.bg2:hover{background:#f8faff}
.bdg{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.ba{background:#d1fae5;color:#065f46}.bdr{background:#fef3c7;color:#92400e}.be{background:#fee2e2;color:#991b1b}
.fi{width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:8px;font-size:14px;color:var(--tx);outline:none;transition:border 0.15s}
.fi:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(67,97,238,0.1)}
.fl{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--tx)}
.fg{margin-bottom:16px}
.tab-r{display:flex;gap:0;border-bottom:2px solid var(--bd);margin-bottom:20px}
.tab{padding:10px 20px;font-size:14px;font-weight:500;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s}
.tab.on{color:var(--p);border-bottom-color:var(--p);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8faff;padding:10px 14px;text-align:left;font-weight:600;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--bd)}
td{padding:12px 14px;border-bottom:1px solid var(--bd);color:var(--tx)}
tr:hover td{background:#fafbff}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.sc{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:18px;cursor:pointer;position:relative;overflow:hidden;transition:all 0.2s}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--p)}
.sc.active::before{background:var(--su)}.sc.ended::before{background:var(--da)}
.sc:hover{box-shadow:0 4px 20px rgba(67,97,238,0.15);transform:translateY(-2px)}
.empty{text-align:center;padding:48px;color:var(--mu)}
.rb{flex:1;background:#e2e8f0;border-radius:99px;height:14px;overflow:hidden}
.rf{height:100%;background:var(--p);border-radius:99px;transition:width 0.4s}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:1000}
.mod{background:#fff;border-radius:16px;padding:28px;width:540px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.25)}
.smg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.smc{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:16px;text-align:center}
.sn{font-size:28px;font-weight:800;color:var(--p)}.sl{font-size:12px;color:var(--mu);margin-top:2px}
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#3a0ca3 0%,#4361ee 50%,#4cc9f0 100%)}
.lc{background:#fff;border-radius:20px;padding:40px;width:400px;max-width:95vw;box-shadow:0 24px 64px rgba(0,0,0,0.25)}
.ll{text-align:center;margin-bottom:28px}
.ll h1{font-size:30px;font-weight:800;color:var(--pd);letter-spacing:-1px}
.ll p{font-size:13px;color:var(--mu);margin-top:4px}
.gb{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:10px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:500;color:var(--tx);margin-bottom:8px;transition:all 0.15s}
.gb:hover{background:#f8faff;border-color:var(--p)}
.dv{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:12px;color:var(--mu)}
.dv::before,.dv::after{content:'';flex:1;height:1px;background:var(--bd)}
.sfw{max-width:640px;margin:0 auto}
.pb{background:#e2e8f0;border-radius:99px;height:6px;margin-bottom:24px;overflow:hidden}
.pf{height:100%;background:var(--p);border-radius:99px;transition:width 0.3s}
.qn{width:30px;height:30px;background:var(--p);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.opt{padding:13px 16px;border:2px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:12px;transition:all 0.12s}
.opt:hover{border-color:var(--p);background:#f8faff}
.opt.sel{border-color:var(--p);background:#eef2ff}
.rat{width:52px;height:52px;border:2px solid var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:18px;transition:all 0.12s}
.rat:hover{border-color:var(--p)}
.rat.sel{border-color:var(--p);background:var(--p);color:#fff}
.qi{background:#f8faff;border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:10px}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a2e;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.3);animation:slideUp 0.3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(max-width:640px){
  .smg{grid-template-columns:repeat(2,1fr)}
  .side{display:none}
  .lay{flex-direction:column}
  .main{padding:16px}
  .sg{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>

const fd=d=>d?new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"—";
const fdt=d=>d?new Date(d).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
const nid=()=>Date.now()+Math.floor(Math.random()*1000);

function Toast({msg,done}){
  useEffect(()=>{const t=setTimeout(done,3500);return()=>clearTimeout(t);},[]);
  return <div className="toast">{msg}</div>;
}

function exportXL(sv){
  try{
    const wb=XLSX.utils.book_new();
    const hdr=["#","Respondent","Submitted At",...sv.questions.map((q,i)=>`Q${i+1}: ${q.text}`)];
    const rows=sv.responses.map((r,i)=>[i+1,r.user,fdt(r.at),...sv.questions.map(q=>r.ans[q.id]||"")]);
    const ws=XLSX.utils.aoa_to_sheet([hdr,...rows]);
    ws["!cols"]=[{wch:5},{wch:28},{wch:20},...sv.questions.map(q=>({wch:Math.max(q.text.length,20)}))];
    XLSX.utils.book_append_sheet(wb,ws,"Responses");
    const s2=[["Survey Summary"],["Title",sv.title],["Description",sv.desc||""],["Status",sv.status],
      ["Start Date",sv.start],["End Date",sv.end],["Total Responses",sv.responses.length],[],["Question Analysis"]];
    sv.questions.forEach((q,i)=>{
      s2.push([`Q${i+1}`,q.text,`Type: ${q.type==="mc"?"Multiple Choice":q.type==="text"?"Open Text":q.type==="rating"?"Rating 1-5":"Yes/No"}`]);
      if(q.type==="mc"||q.type==="yn"){
        const opts=q.type==="yn"?["Yes","No"]:q.options;
        opts.forEach(o=>{
          const c=sv.responses.filter(r=>r.ans[q.id]===o).length;
          const p=sv.responses.length?Math.round(c/sv.responses.length*100):0;
          s2.push(["  →",o,`${c} responses`,`${p}%`]);
        });
      } else if(q.type==="rating"){
        const vs=sv.responses.map(r=>parseInt(r.ans[q.id])).filter(Boolean);
        const avg=vs.length?(vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(1):"N/A";
        s2.push(["  →",`Average rating: ${avg} / 5`,`Based on ${vs.length} responses`]);
      } else {
        const ans=sv.responses.map(r=>r.ans[q.id]).filter(Boolean);
        ans.forEach((a,j)=>s2.push(["  →",`Response ${j+1}:`,a]));
      }
      s2.push([]);
    });
    const ws2=XLSX.utils.aoa_to_sheet(s2);
    ws2["!cols"]=[{wch:8},{wch:35},{wch:30},{wch:10}];
    XLSX.utils.book_append_sheet(wb,ws2,"Summary");
    XLSX.writeFile(wb,sv.title.replace(/\s+/g,"_")+"_responses.xlsx");
  } catch(e){alert("Excel export failed: "+e.message);}
}

function App(){
  const [auth,setAuth]=useState(null);
  const [surveys,setSurveys]=useState(()=>{
    try{const s=localStorage.getItem("sf_surveys");return s?JSON.parse(s):SURVEYS;}catch{return SURVEYS;}
  });
  const [toast,setToast]=useState(null);
  useEffect(()=>{try{localStorage.setItem("sf_surveys",JSON.stringify(surveys));}catch{};},[surveys]);
  const t=m=>setToast(m);
  const upd=(id,p)=>setSurveys(s=>s.map(x=>x.id===id?{...x,...p}:x));

  return(<>
    {!auth&&<Login onLogin={setAuth} t={t}/>}
    {auth?.role==="admin"&&<Admin auth={auth} surveys={surveys} setSurveys={setSurveys} upd={upd} out={()=>setAuth(null)} t={t}/>}
    {auth?.role==="user"&&<User auth={auth} surveys={surveys} setSurveys={setSurveys} out={()=>setAuth(null)} t={t}/>}
    {toast&&<Toast msg={toast} done={()=>setToast(null)}/>}
  </>);
}

/* ── LOGIN ── */

          <div className="fg"><label className="fl">Password</label><input className="fi" type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&go()}/></div>
          <button className="btn bp" style={{width:"100%",justifyContent:"center",padding:12,fontSize:15,marginBottom:12}} onClick={go}>Sign In as Admin</button>
          <div style={{background:"#f0f4ff",borderRadius:8,padding:"10px 14px",fontSize:12,color:"var(--mu)"}}>
            <strong>Demo credentials:</strong><br/>Email: admin@acme.com<br/>Password: admin123
          </div>
        </>}
        {mode==="user"&&<>
          <button className="btn bg2" style={{marginBottom:18,fontSize:12}} onClick={()=>setMode("home")}>← Back</button>
          <p style={{fontSize:13,color:"var(--mu)",marginBottom:14}}>Select your Google Workspace account:</p>
          {USERS.map(u=>(
            <button key={u.email} className="gb" onClick={()=>onLogin({role:"user",...u})}>
              <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              <div style={{textAlign:"left"}}>
                <div style={{fontWeight:600,fontSize:14}}>{u.name}</div>
                <div style={{fontSize:12,color:"var(--mu)"}}>{u.email}</div>
              </div>

        </>}

/* ── ADMIN APP ── */
function Admin({auth,surveys,setSurveys,upd,out,t}){
  const [pg,setPg]=useState("dash");
  const [sel,setSel]=useState(null);
  const [atab,setAtab]=useState("questions");
  const [nm,setNm]=useState(false);
  const go=p=>{setPg(p);setSel(null);};
  const navItems=[{id:"dash",ic:"📊",lb:"Dashboard"},{id:"surveys",ic:"📋",lb:"My Surveys"},{id:"responses",ic:"📬",lb:"All Responses"}];
  return(
    <div className="app">
      <div className="nav">
        <div className="nav-logo">📋 SurveyFlow <em>Admin</em></div>
        <div className="nav-r">
          <span>👤 {auth.name}</span>
          <button className="btn bg2" style={{color:"#fff",borderColor:"rgba(255,255,255,0.4)",fontSize:12}} onClick={out}>Logout</button>
        </div>
      </div>
      {nm&&<NewSurveyModal onClose={()=>setNm(false)} onSave={sv=>{setSurveys(s=>[...s,sv]);setNm(false);t("✅ Survey created!");}}/>}
      <div className="lay">
        <div className="side">
          {navItems.map(n=><div key={n.id} className={`si${pg===n.id&&!sel?" on":""}`} onClick={()=>go(n.id)}><span>{n.ic}</span>{n.lb}</div>)}
          <div className="side-section">Quick Actions</div>
          <div className="si" onClick={()=>setNm(true)}><span>➕</span>New Survey</div>
        </div>
        <div className="main">
          {sel
            ?<SurveyDetail sv={sel} surveys={surveys} onBack={()=>setSel(null)} upd={upd} t={t} atab={atab} setAtab={setAtab}/>
            :pg==="dash"?<Dashboard surveys={surveys} onSel={sv=>{setSel(sv);setAtab("questions");}}/>
            :pg==="surveys"?<SurveyList surveys={surveys} onSel={sv=>{setSel(sv);setAtab("questions");}} upd={upd} t={t} onNew={()=>setNm(true)}/>
            :<AllResponses surveys={surveys}/>
          }
        </div>
      </div>
    </div>
  );
}

function Dashboard({surveys,onSel}){
  const total=surveys.reduce((a,s)=>a+s.responses.length,0);
  const stats=[
    {n:surveys.length,l:"Total Surveys",c:"#4361ee"},
    {n:surveys.filter(s=>s.status==="active").length,l:"Active Now",c:"#2ec4b6"},
    {n:total,l:"Total Responses",c:"#f72585"},
    {n:surveys.filter(s=>s.status==="draft").length,l:"Drafts",c:"#ff9f1c"}
  ];
  return(<div>
    <div style={{fontSize:22,fontWeight:700,marginBottom:4}}>Welcome back 👋</div>
    <div style={{fontSize:14,color:"var(--mu)",marginBottom:20}}>Your survey activity at a glance.</div>
    <div className="smg">
      {stats.map((s,i)=><div key={i} className="smc"><div className="sn" style={{color:s.c}}>{s.n}</div><div className="sl">{s.l}</div></div>)}
    </div>
    <div className="card">
      <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>Recent Surveys</div>
      {surveys.length===0&&<div style={{color:"var(--mu)",fontSize:13,textAlign:"center",padding:20}}>No surveys yet. Create one!</div>}
      {surveys.slice(0,5).map(sv=>(

function SurveyDetail({sv,surveys,onBack,upd,t,atab,setAtab}){
  const liveSv=surveys.find(s=>s.id===sv.id)||sv;
  const [qs,setQs]=useState(liveSv.questions);
  const [qm,setQm]=useState(false);const [eq,setEq]=useState(null);
  useEffect(()=>setQs(liveSv.questions),[liveSv.questions]);
  const save=()=>{upd(sv.id,{questions:qs});t("💾 Questions saved!");};
  const delQ=id=>setQs(q=>q.filter(x=>x.id!==id));
  const addQ=q=>{setQs(p=>[...p,{...q,id:nid()}]);setQm(false);t("✅ Question added!");};
  const editQ=q=>{setQs(p=>p.map(x=>x.id===eq.id?{...eq,...q,id:eq.id}:x));setEq(null);t("✅ Question updated!");};
  const tog=()=>{
    if(liveSv.status==="draft"){upd(sv.id,{status:"active"});t("✅ Survey activated!");}
    else if(liveSv.status==="active"){upd(sv.id,{status:"ended"});t("⏹ Survey ended.");}
  };
  return(<div>
    {(qm||eq)&&<QuestionModal init={eq} onClose={()=>{setQm(false);setEq(null);}} onSave={eq?editQ:addQ}/>}
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}}>
      <button className="btn bg2" style={{fontSize:12,padding:"5px 12px"}} onClick={onBack}>← Back</button>
      <span style={{fontWeight:700,fontSize:18}}>{liveSv.title}</span>
      <span className={`bdg ${liveSv.status==="active"?"ba":liveSv.status==="draft"?"bdr":"be"}`}>{liveSv.status}</span>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap",alignItems:"center"}}>
      <span style={{fontSize:12,background:"#eef2ff",color:"var(--p)",borderRadius:99,padding:"4px 12px"}}>📅 {fd(liveSv.start)} – {fd(liveSv.end)}</span>
      <span style={{fontSize:12,background:"#eef2ff",color:"var(--p)",borderRadius:99,padding:"4px 12px"}}>💬 {liveSv.responses.length} responses</span>
      {liveSv.status!=="ended"&&<button className={`btn ${liveSv.status==="draft"?"bs":"bw"}`} style={{fontSize:12,padding:"6px 14px"}} onClick={tog}>{liveSv.status==="draft"?"▶ Activate Survey":"⏹ End Survey"}</button>}
      <button className="btn bo" style={{fontSize:12,padding:"6px 14px"}} onClick={()=>exportXL({...liveSv,questions:qs})}>📥 Download Excel</button>
    </div>
    <div className="tab-r">
      {["questions","responses","analytics"].map(tb=><div key={tb} className={`tab${atab===tb?" on":""}`} onClick={()=>setAtab(tb)}>{tb[0].toUpperCase()+tb.slice(1)}</div>)}
    </div>
    {atab==="questions"&&<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <span style={{fontSize:13,color:"var(--mu)"}}>{qs.length} question{qs.length!==1?"s":""}</span>
        <div style={{display:"flex",gap:8}}>
          <button className="btn bp" style={{fontSize:12,padding:"6px 14px"}} onClick={()=>setQm(true)}>+ Add Question</button>
          <button className="btn bs" style={{fontSize:12,padding:"6px 14px"}} onClick={save}>💾 Save</button>
        </div>
      </div>
      {qs.length===0&&<div className="empty"><div style={{fontSize:40}}>🤔</div><p style={{marginTop:10}}>No questions yet. Add some!</p></div>}
      {qs.map((q,i)=>(
        <div key={q.id} className="qi">
          <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
            <div className="qn">{i+1}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:14,lineHeight:1.4}}>{q.text}{q.req&&<span style={{color:"var(--da)",fontSize:12,marginLeft:6}}>*Required</span>}</div>
              <div style={{fontSize:12,color:"var(--mu)",marginTop:4}}>
                {q.type==="mc"?"🔘 Multiple Choice":q.type==="text"?"✍️ Open Text":q.type==="rating"?"⭐ Rating 1–5":"👍 Yes / No"}

              </div>
            </div>
            <button className="btn bg2" style={{fontSize:12,padding:"4px 10px"}} onClick={()=>setEq(q)}>✏️ Edit</button>
            <button className="btn bg2" style={{fontSize:12,padding:"4px 10px",color:"var(--da)"}} onClick={()=>delQ(q.id)}>🗑️</button>
          </div>
        </div>

    {atab==="responses"&&<ResponsesTable sv={{...liveSv,questions:qs}}/>}

function ResponsesTable({sv}){
  if(!sv.responses.length) return <div className="empty"><div style={{fontSize:44}}>📭</div><p style={{marginTop:12,fontSize:15}}>No responses yet.</p></div>;
  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <span style={{fontSize:13,color:"var(--mu)"}}>{sv.responses.length} response{sv.responses.length!==1?"s":""}</span>
      <button className="btn bo" style={{fontSize:12,padding:"6px 14px"}} onClick={()=>exportXL(sv)}>📥 Export to Excel</button>
    </div>
    <div style={{overflowX:"auto"}}>
      <table>
        <thead><tr><th>#</th><th>Respondent</th><th>Submitted</th>{sv.questions.map((q,i)=><th key={q.id}>Q{i+1}</th>)}</tr></thead>
        <tbody>{sv.responses.map((r,i)=>(
          <tr key={r.id}>
            <td>{i+1}</td>
            <td><div style={{fontWeight:600}}>{r.user.split("@")[0]}</div><div style={{fontSize:11,color:"var(--mu)"}}>{r.user}</div></td>
            <td style={{color:"var(--mu)",fontSize:12}}>{fdt(r.at)}</td>
            {sv.questions.map(q=><td key={q.id} style={{maxWidth:140,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.ans[q.id]||"—"}</td>)}
          </tr>
        ))}</tbody>
      </table>
    </div>
  </div>);
}

function Analytics({sv}){
  if(!sv.responses.length) return <div className="empty"><div style={{fontSize:44}}>📊</div><p style={{marginTop:12,fontSize:15}}>No data to analyze yet.</p></div>;
  return(<div>{sv.questions.map((q,i)=>{
    const ans=sv.responses.map(r=>r.ans[q.id]).filter(Boolean);
    return(<div key={q.id} className="card">
      <div style={{fontWeight:700,fontSize:14,marginBottom:14}}>Q{i+1}. {q.text}</div>
      {(q.type==="mc"||q.type==="yn")&&(()=>{
        const opts=q.type==="yn"?["Yes","No"]:q.options;
        return opts.map(o=>{
          const c=ans.filter(a=>a===o).length;
          const p=ans.length?Math.round(c/ans.length*100):0;
          return(<div key={o} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
            <div style={{width:120,fontSize:13,textAlign:"right",color:"var(--tx)",flexShrink:0}}>{o}</div>
            <div className="rb"><div className="rf" style={{width:p+"%"}}/></div>
            <div style={{fontSize:13,fontWeight:600,width:40,color:"var(--p)"}}>{p}%</div>
            <div style={{fontSize:12,color:"var(--mu)",width:30}}>{c}</div>
          </div>);
        });
      })()}
      {q.type==="rating"&&(()=>{
        const vs=sv.responses.map(r=>parseInt(r.ans[q.id])).filter(Boolean);
        const avg=vs.length?(vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(1):"—";
        return(<div>
          <div style={{fontSize:32,fontWeight:800,color:"var(--p)",marginBottom:12}}>⭐ {avg} <span style={{fontSize:14,fontWeight:400,color:"var(--mu)"}}>/ 5 average</span></div>
          {[5,4,3,2,1].map(n=>{const c=vs.filter(v=>v===n).length;const p=vs.length?Math.round(c/vs.length*100):0;
            return(<div key={n} style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
              <div style={{width:80,fontSize:13,textAlign:"right",color:"var(--tx)"}}> {"★".repeat(n)}</div>
              <div className="rb"><div className="rf" style={{width:p+"%"}}/></div>
              <div style={{fontSize:12,color:"var(--mu)",width:30}}>{c}</div>
            </div>);
          })}
        </div>);
      })()}
      {q.type==="text"&&(<div>{ans.length===0&&<div style={{color:"var(--mu)",fontSize:13}}>No text answers.</div>}{ans.map((a,j)=><div key={j} style={{background:"#f8faff",border:"1px solid var(--bd)",borderRadius:8,padding:"10px 14px",fontSize:13,marginBottom:8,fontStyle:"italic",lineHeight:1.5}}>"{a}"</div>)}</div>)}
    </div>);
  })}</div>);
}

function AllResponses({surveys}){
  const all=surveys.flatMap(s=>s.responses.map(r=>({...r,st:s.title,sid:s.id}))).sort((a,b)=>new Date(b.at)-new Date(a.at));

function QuestionModal({init,onClose,onSave}){

  const [opts,setOpts]=useState(init?.options?.length?init.options:["",""]);
  const [req,setReq]=useState(init?.req||false);
  const save=()=>{
    if(!txt.trim())return alert("Question text is required.");
    if(tp==="mc"&&opts.filter(o=>o.trim()).length<2)return alert("Please add at least 2 options.");
    onSave({text:txt,type:tp,options:tp==="mc"?opts.filter(o=>o.trim()):[],req});
  };
  return(<div className="mbg"><div className="mod">
    <div style={{fontWeight:700,fontSize:18,marginBottom:20}}>{init?"Edit Question":"Add New Question"}</div>
    <div className="fg"><label className="fl">Question Text *</label><input className="fi" value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Type your question here..." autoFocus/></div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
      <div><label className="fl">Question Type</label>
        <select className="fi" value={tp} onChange={e=>setTp(e.target.value)}>
          <option value="mc">Multiple Choice</option>

          <div onClick={()=>setReq(r=>!r)} style={{width:44,height:24,background:req?"var(--su)":"#cbd5e1",borderRadius:99,cursor:"pointer",position:"relative",transition:"background 0.2s",flexShrink:0}}>
            <div style={{position:"absolute",width:18,height:18,background:"#fff",borderRadius:"50%",top:3,left:req?23:3,transition:"left 0.2s",boxShadow:"0 1px 4px rgba(0,0,0,0.2)"}}/>
          </div>
          <span style={{fontSize:13,color:"var(--mu)"}}>{req?"Yes – required":"No – optional"}</span>
        </div>
      </div>
    </div>
    {tp==="mc"&&<div className="fg">
      <label className="fl">Answer Options</label>
      {opts.map((o,i)=><div key={i} style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
        <span style={{fontSize:13,color:"var(--mu)",width:22,textAlign:"right",flexShrink:0}}>{String.fromCharCode(65+i)}.</span>
        <input className="fi" value={o} onChange={e=>setOpts(p=>p.map((x,j)=>j===i?e.target.value:x))} placeholder={`Option ${i+1}`} style={{flex:1}}/>
        {opts.length>2&&<button className="btn bg2" style={{fontSize:12,padding:"4px 8px",color:"var(--da)",flexShrink:0}} onClick={()=>setOpts(p=>p.filter((_,j)=>j!==i))}>✕</button>}
      </div>)}
      <button className="btn bg2" style={{fontSize:12,padding:"5px 12px",marginTop:2}} onClick={()=>setOpts(p=>[...p,""])}>+ Add option</button>
    </div>}
    {tp==="yn"&&<div style={{background:"#f0f4ff",borderRadius:8,padding:"12px 14px",fontSize:13,color:"var(--mu)",marginBottom:16}}>✅ Respondents will choose between <strong>Yes</strong> or <strong>No</strong>.</div>}
    {tp==="rating"&&<div style={{background:"#f0f4ff",borderRadius:8,padding:"12px 14px",fontSize:13,color:"var(--mu)",marginBottom:16}}>⭐ Respondents will rate from <strong>1 to 5 stars</strong>.</div>}
    {tp==="text"&&<div style={{background:"#f0f4ff",borderRadius:8,padding:"12px 14px",fontSize:13,color:"var(--mu)",marginBottom:16}}>✍️ Respondents will type a <strong>free-form text answer</strong>.</div>}
    <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:8}}>

      <button className="btn bp" onClick={save}>{init?"Update Question":"Add Question"}</button>
    </div>
  </div></div>);

/* ── USER APP ── */

  const done=sv=>sv.responses.some(r=>r.user===auth.email);
  const submit=(sv,ans)=>{
    const r={id:nid(),user:auth.email,at:new Date().toISOString(),ans};
    setSurveys(s=>s.map(x=>x.id===sv.id?{...x,responses:[...x.responses,r]}:x));
    setSel(null);
    t("🎉 Response submitted! Thank you.");
  };
  return(<div className="app">
    <div className="nav">
      <div className="nav-logo">📋 SurveyFlow</div>
      <div className="nav-r">
        <span>👤 {auth.name}</span>

      </div>

        <div style={{fontSize:14,color:"var(--mu)",marginBottom:20}}>Complete the surveys assigned to your team.</div>
        {active.length===0&&<div className="empty"><div style={{fontSize:52}}>📭</div><p style={{marginTop:14,fontSize:16}}>No active surveys right now.</p><p style={{fontSize:13,color:"var(--mu)",marginTop:6}}>Check back later!</p></div>}
        {active.map(sv=>(
          <div key={sv.id} className="card" style={{cursor:"pointer",transition:"all 0.15s"}} onClick={()=>setSel(sv)}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:16}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:16,marginBottom:6}}>{sv.title}</div>
                <div style={{fontSize:13,color:"var(--mu)",marginBottom:10}}>{sv.desc}</div>
                <div style={{fontSize:12,color:"var(--mu)",display:"flex",gap:16}}>
                  <span>📅 Closes {fd(sv.end)}</span>
                  <span>❓ {sv.questions.length} questions</span>

                {done(sv)?<span className="bdg ba">✓ Submitted</span>:<button className="btn bp" style={{fontSize:13}}>Start →</button>}
              </div>
            </div>

        ))}

          <div style={{fontWeight:700,fontSize:15,marginBottom:12}}>My Previous Submissions</div>
          {mine.map((r,i)=>(
            <div key={i} className="card" style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px"}}>
              <div>
                <div style={{fontWeight:600,fontSize:14}}>{r.st}</div>
                <div style={{fontSize:12,color:"var(--mu)",marginTop:2}}>Submitted on {fdt(r.at)}</div>
              </div>
              <span className="bdg ba">✓ Submitted</span>
            </div>
          ))}
        </div>}
      </div>
    }
  </div>);
}

function SurveyFill({sv,auth,onBack,onSubmit,already}){
  const [ans,setAns]=useState({});
  const [step,setStep]=useState(0);
  const [done,setDone]=useState(already);
  const q=sv.questions[step];
  const total=sv.questions.length;
  const pct=Math.round((step/total)*100);
  const setA=(id,v)=>setAns(a=>({...a,[id]:v}));
  const canNext=!q?.req||ans[q?.id];
  const finish=()=>{
    const miss=sv.questions.filter(q=>q.req&&!ans[q.id]);
    if(miss.length){alert(`Please answer all required questions (${miss.length} remaining).`);return;}
    onSubmit(sv,ans);setDone(true);
  };
  if(done) return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"60vh"}}>
      <div style={{textAlign:"center",padding:40}}>
        <div style={{fontSize:72,marginBottom:16}}>🎉</div>
        <div style={{fontSize:26,fontWeight:800,marginBottom:8,color:"var(--tx)"}}>Thank You!</div>
        <div style={{fontSize:15,color:"var(--mu)",marginBottom:28}}>Your response has been recorded successfully.</div>
        <button className="btn bp" style={{fontSize:15,padding:"10px 28px"}} onClick={onBack}>← Back to Surveys</button>
      </div>
    </div>
  );
  return(<div className="sfw main">
    <button className="btn bg2" style={{marginBottom:18,fontSize:12}} onClick={onBack}>← Back to Surveys</button>
    <div className="card" style={{marginBottom:18,padding:"16px 20px",borderLeft:"4px solid var(--p)"}}>
      <div style={{fontWeight:700,fontSize:18,marginBottom:4}}>{sv.title}</div>
      <div style={{fontSize:13,color:"var(--mu)"}}>{sv.desc}</div>
    </div>
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:22}}>
      <span style={{fontSize:13,color:"var(--mu)",whiteSpace:"nowrap"}}>Question {step+1} of {total}</span>
      <div className="pb" style={{flex:1,margin:0}}><div className="pf" style={{width:pct+"%"}}/></div>
      <span style={{fontSize:13,fontWeight:600,color:"var(--p)",whiteSpace:"nowrap"}}>{pct}%</span>
    </div>
    <div className="card" style={{minHeight:220}}>
      <div style={{display:"flex",gap:14,marginBottom:20}}>
        <div className="qn">{step+1}</div>
        <div>
          <div style={{fontWeight:700,fontSize:16,lineHeight:1.4,color:"var(--tx)"}}>{q.text}</div>
          {q.req&&<div style={{fontSize:12,color:"var(--da)",marginTop:4}}>* This question is required</div>}
        </div>
      </div>
      {q.type==="mc"&&q.options.map(o=>(
        <div key={o} className={`opt${ans[q.id]===o?" sel":""}`} onClick={()=>setA(q.id,o)}>
          <div style={{width:20,height:20,borderRadius:"50%",border:`2px solid ${ans[q.id]===o?"var(--p)":"var(--bd)"}`,background:ans[q.id]===o?"var(--p)":"#fff",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.12s"}}>
            {ans[q.id]===o&&<div style={{width:8,height:8,borderRadius:"50%",background:"#fff"}}/>}
          </div>
          <span style={{fontSize:14}}>{o}</span>
        </div>
      ))}
      {q.type==="text"&&<textarea className="fi" rows={5} value={ans[q.id]||""} onChange={e=>setA(q.id,e.target.value)} placeholder="Type your answer here..." style={{resize:"vertical",fontSize:14}}/>}
      {q.type==="rating"&&<div>
        <div style={{display:"flex",gap:12,marginTop:4,flexWrap:"wrap"}}>
          {[1,2,3,4,5].map(n=>(
            <div key={n} className={`rat${ans[q.id]===String(n)?" sel":""}`} onClick={()=>setA(q.id,String(n))}>{n}</div>
          ))}
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:8,fontSize:12,color:"var(--mu)",maxWidth:280}}>
          <span>1 = Poor</span><span>5 = Excellent</span>
        </div>
      </div>}
      {q.type==="yn"&&<div style={{display:"flex",gap:16}}>
        {["Yes","No"].map(o=>(
          <div key={o} className={`opt${ans[q.id]===o?" sel":""}`} style={{flex:1,justifyContent:"center",padding:"18px",fontSize:16,fontWeight:600}} onClick={()=>setA(q.id,o)}>
            <span style={{fontSize:20}}>{o==="Yes"?"✅":"❌"}</span> {o}
          </div>
        ))}
      </div>}
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:16}}>
      <button className="btn bg2" disabled={step===0} onClick={()=>setStep(s=>s-1)} style={{opacity:step===0?0.4:1,fontSize:13}}>← Previous</button>
      <span style={{fontSize:12,color:"var(--mu)"}}>{total-step-1} question{total-step-1!==1?"s":""} remaining</span>
      {step<total-1
        ?<button className="btn bp" disabled={!canNext} onClick={()=>setStep(s=>s+1)} style={{opacity:canNext?1:0.4,fontSize:13}}>Next →</button>
        :<button className="btn bs" onClick={finish} style={{fontSize:13,padding:"8px 20px"}}>Submit Survey ✓</button>
      }
    </div>
  </div>);
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
