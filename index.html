<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
html, body, #root { min-height: 100vh; }
body { background: #F8FAFB; }

:root {
  --ttn-primary: #00519F;
  --ttn-red: #00519F;
  --ttn-darkblue: #00519F;
  --ttn-purple: #623FA3;
  --ttn-cyan: #00C2E9;
  --ttn-gold: #F9AD1B;
  --success: #10B981;
  --danger: #EF4444;
}

/* ========== NAVIGATION ========== */
.nav {
  background: linear-gradient(135deg, #00519F 0%, #003C7A 100%);
  color: white;
  padding: 0 28px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 10px 40px rgba(0, 81, 159, 0.2);
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-logo-img {
  height: 48px;
  width: auto;
  object-fit: contain;
}

.nav-branding {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-logo-text {
  font-size: 20px;
  font-weight: 800;
  color: white;
  letter-spacing: -0.5px;
}

.nav-org {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.8);
  font-weight: 500;
}

.nav-badge {
  background: #F9AD1B;
  color: #1F2937;
  font-size: 12px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 6px;
  margin-left: 12px;
}

.nav-r {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-left: auto;
}

/* ========== LAYOUT ========== */
.lay { display: flex; min-height: calc(100vh - 80px); }
.side { width: 260px; background: white; border-right: 2px solid #E5E7EB; padding: 20px 0; position: sticky; top: 80px; height: calc(100vh - 80px); overflow-y: auto; }

.si {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  font-size: 14px;
  color: #374151;
  cursor: pointer;
  border-left: 4px solid transparent;
  transition: all 0.2s;
}

.si:hover { background: #FFF5F2; color: var(--ttn-red); }
.si.on {
  background: linear-gradient(90deg, rgba(0, 81, 159, 0.1) 0%, transparent 100%);
  color: var(--ttn-red);
  border-left-color: var(--ttn-red);
  font-weight: 600;
}

.side-sec { margin: 20px 20px 8px; font-size: 10px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 1px; }

.main { flex: 1; padding: 36px 40px; overflow-y: auto; background: #F8FAFB; }

/* ========== CARDS ========== */
.card {
  background: white;
  border-radius: 14px;
  border: 1px solid #E5E7EB;
  padding: 24px;
  margin-bottom: 22px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  transition: all 0.3s;
}

.card:hover { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); }

/* ========== CATEGORY SECTION ========== */
.category-section {
  background: linear-gradient(135deg, rgba(0, 81, 159, 0.05) 0%, rgba(0, 194, 233, 0.05) 100%);
  border: 2px solid rgba(0, 81, 159, 0.2);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 24px;
  border-left: 6px solid var(--ttn-red);
}

.category-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--ttn-red);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.category-badge {
  background: var(--ttn-red);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
}

/* ========== BUTTONS ========== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  white-space: nowrap;
}

.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, #00519F 0%, #003D7A 100%);
  color: white;
  box-shadow: 0 4px 14px rgba(0, 81, 159, 0.4);
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(0, 81, 159, 0.5);
}

.btn-success {
  background: linear-gradient(135deg, #10B981 0%, #059669 100%);
  color: white;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
}

.btn-success:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(16, 185, 129, 0.5);
}

.btn-outline {
  background: white;
  color: var(--ttn-red);
  border: 2px solid var(--ttn-red);
}

.btn-outline:hover:not(:disabled) { background: #FFF5F2; }

.btn-ghost {
  background: white;
  color: #374151;
  border: 1px solid #E5E7EB;
}

.btn-ghost:hover:not(:disabled) { background: #F9FAFB; color: var(--ttn-red); }

/* ========== BADGES ========== */
.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
}

.badge-active { background: #D1FAE5; color: #065F46; }
.badge-draft { background: #FEF3C7; color: #92400E; }
.badge-ended { background: #FEE2E2; color: #991B1B; }

/* ========== STAT GRID ========== */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  margin-bottom: 28px;
}

.stat-card {
  background: white;
  border: 1px solid #E5E7EB;
  border-radius: 14px;
  padding: 24px;
  border-left: 5px solid var(--ttn-primary);
  box-shadow: 0 2px 8px rgba(0, 81, 159, 0.08);
}

.stat-number {
  font-size: 36px;
  font-weight: 800;
  color: var(--ttn-primary);
  line-height: 1;
}

.stat-label {
  font-size: 12px;
  color: #374151;
  margin-top: 8px;
  font-weight: 500;
}

/* ========== FORMS ========== */
.input, .textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #E5E7EB;
  border-radius: 10px;
  font-size: 14px;
  color: #111827;
  outline: none;
  background: white;
  transition: all 0.2s;
  font-family: inherit;
}

.input:focus, .textarea:focus {
  border-color: var(--ttn-red);
  box-shadow: 0 0 0 4px rgba(0, 81, 159, 0.1);
}

.label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #111827;
}

.form-group { margin-bottom: 18px; }

/* ========== TABS ========== */
.tab-row {
  display: flex;
  border-bottom: 2px solid #E5E7EB;
  margin-bottom: 24px;
  gap: 8px;
}

.tab {
  padding: 12px 22px;
  font-size: 14px;
  font-weight: 500;
  color: #374151;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  transition: all 0.2s;
}

.tab.active {
  color: var(--ttn-red);
  border-bottom-color: var(--ttn-red);
  font-weight: 600;
}

/* ========== TABLES ========== */
.table-wrapper {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid #E5E7EB;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  background: linear-gradient(90deg, #F8FAFB 0%, #F0F4F8 100%);
  padding: 14px 16px;
  text-align: left;
  font-weight: 700;
  font-size: 11px;
  color: #374151;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  border-bottom: 2px solid #E5E7EB;
}

td {
  padding: 14px 16px;
  border-bottom: 1px solid #E5E7EB;
  color: #111827;
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: #F9FAFB; }

/* ========== SURVEY GRID ========== */
.survey-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}

.survey-card {
  background: white;
  border: 1px solid #E5E7EB;
  border-radius: 14px;
  padding: 24px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
  border-top: 5px solid var(--ttn-red);
}

.survey-card:hover {
  box-shadow: 0 12px 32px rgba(0, 81, 159, 0.2);
  transform: translateY(-4px);
}

/* ========== PROGRESS ========== */
.progress-bar {
  background: #E5E7EB;
  border-radius: 99px;
  height: 7px;
  overflow: hidden;
  margin-bottom: 24px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--ttn-red) 0%, var(--ttn-gold) 100%);
  border-radius: 99px;
  transition: width 0.4s;
}

/* ========== QUESTION STYLING ========== */
.question-number {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, #00519F 0%, #003D7A 100%);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(0, 81, 159, 0.4);
}

.option {
  padding: 14px 16px;
  border: 2px solid #E5E7EB;
  border-radius: 12px;
  margin-bottom: 10px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.2s;
  background: white;
}

.option:hover { border-color: var(--ttn-red); background: #FFF5F2; }
.option.selected {
  border-color: var(--ttn-red);
  background: rgba(0, 81, 159, 0.08);
  font-weight: 600;
}

.rating-button {
  width: 60px;
  height: 60px;
  border: 2px solid #E5E7EB;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-weight: 700;
  font-size: 18px;
  transition: all 0.2s;

async function saveSurvey(sv) {
  const { id, ...data } = sv;
  if (id && !id.startsWith("new_")) {
    await surveysRef().doc(id).set(data, { merge: true });

  } else {

function exportXL(sv, responses) {
  try {
    const wb = XLSX.utils.book_new();
    
    // Create question headers with full text and category
    const questionHeaders = sv.questions.map((q, i) => {
      const categoryInfo = Object.entries(SURVEY_CATEGORIES).find(([key]) => key === q.category);
      const categoryName = categoryInfo ? categoryInfo[1].label : "Unknown";
      return `Q${i + 1}: [${categoryName}] ${q.text}`;
    });
    
    // Sheet 1: Detailed Response Analysis with Individual Summaries
    const headers = ["#", "Email", "Full Name", "Submitted At", ...questionHeaders, "Average", "Summary"];
    
    const rows = responses.map((r, i) => {
      // Get all rating questions and their answers for this person
      const ratingQuestions = sv.questions.filter(q => q.type === "rating");
      const ratingAnswers = ratingQuestions.map((q, idx) => {
        const answer = r.ans[q.id];
        return { answer: parseInt(answer), qIndex: sv.questions.indexOf(q) };
      }).filter(v => !isNaN(v.answer));
      
      const avgRating = ratingAnswers.length > 0 
        ? (ratingAnswers.reduce((sum, v) => sum + v.answer, 0) / ratingAnswers.length).toFixed(2) 
        : "N/A";
      
      // Find questions with low ratings (≤2) and get their question numbers
      const concerns = [];
      sv.questions.forEach((q, qIdx) => {
        if (q.type === "rating") {
          const answer = parseInt(r.ans[q.id]);
          if (!isNaN(answer) && answer <= 2) {
            concerns.push(qIdx + 1); // Store question number (1-indexed)
          }
        }
      });
      
      // Create summary based on concerns
      let summary = "";
      if (concerns.length === 0) {
        if (avgRating >= 4.5) {
          summary = "🌟 No Concerns, Excellent feedback!";
        } else if (avgRating >= 4) {
          summary = "✅ No Concerns, Very happy";
        } else if (avgRating >= 3.5) {
          summary = "👍 No Concerns, Satisfied";
        } else {
          summary = "No specific low ratings";
        }
      } else {
        summary = `⚠️ Major concerns in Q${concerns.join(", Q")}`;
      }
      
      // Build row with all answers
      const answerValues = sv.questions.map(q => r.ans[q.id] || "");
      return [i + 1, r.email, r.name || "", fdt(r.at), ...answerValues, avgRating, summary];
    });
    
    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    
    // Set column widths - make question columns narrower and summary wider
    const colWidths = [
      { wch: 4 },           // #
      { wch: 28 },          // Email
      { wch: 18 },          // Full Name
      { wch: 18 },          // Submitted At
      ...sv.questions.map(q => ({ wch: 4 })), // Question columns - narrow for ratings
      { wch: 12 },          // Average Rating
      { wch: 55 }           // Summary - wide for detailed text
    ];
    ws["!cols"] = colWidths;
    
    // Wrap text in headers for better readability
    ws["!rows"] = [{ hpx: 40 }]; // Make header row taller
    
    XLSX.utils.book_append_sheet(wb, ws, "Response Analysis");

    // Sheet 2: Detailed Category Summary
    const summaryData = [["CATEGORY WISE ANALYSIS"]];
    summaryData.push([]);
    
    Object.entries(SURVEY_CATEGORIES).forEach(([key, cat]) => {
      const catQs = sv.questions.filter(q => q.category === key);
      if (catQs.length > 0) {
        summaryData.push([cat.label, "", "", ""]);
        
        catQs.forEach((q, idx) => {
          const ans = responses.map(r => r.ans?.[q.id]).filter(Boolean);
          const count = ans.length;
          const responseRate = count > 0 ? ((count / responses.length) * 100).toFixed(1) : "0";
          
          if (q.type === "rating") {
            const ratings = ans.map(a => parseInt(a));
            const avg = ratings.length > 0 ? (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(2) : "N/A";
            const concernCount = ratings.filter(r => r <= 3).length;
            const satisfied = ratings.filter(r => r >= 4).length;
            
            summaryData.push([
              `  ${q.text}`,
              `Avg: ${avg}/5`,
              `Concerns: ${concernCount}`,
              `Satisfied: ${satisfied}`
            ]);
          } else {
            summaryData.push([
              `  ${q.text}`,
              `Responses: ${count}`,
              `Rate: ${responseRate}%`,
              ""
            ]);
          }
        });
        summaryData.push([]);
      }
    });
    
    const summarySheet = XLSX.utils.aoa_to_sheet(summaryData);
    summarySheet["!cols"] = [{ wch: 70 }, { wch: 18 }, { wch: 18 }, { wch: 18 }];
    XLSX.utils.book_append_sheet(wb, summarySheet, "Category Analysis");

    // Sheet 3: Category Statistics Table
    const statsData = [["Category", "Total Questions", "Average Rating", "High Concerns (%)", "Satisfied (%)", "Response Rate"]];
    Object.entries(SURVEY_CATEGORIES).forEach(([key, cat]) => {
      const catQs = sv.questions.filter(q => q.category === key);
      const ratingQs = catQs.filter(q => q.type === "rating");
      if (ratingQs.length > 0) {
        let totalConcerns = 0;
        let totalSatisfied = 0;
        const allRatings = [];
        
        ratingQs.forEach(q => {
          const ans = responses.map(r => r.ans?.[q.id]).filter(Boolean);
          ans.forEach(a => {
            const rating = parseInt(a);
            allRatings.push(rating);
            if (rating <= 3) totalConcerns++;
            if (rating >= 4) totalSatisfied++;
          });
        });
        
        const avgRating = allRatings.length > 0 ? (allRatings.reduce((a, b) => a + b, 0) / allRatings.length).toFixed(2) : "N/A";
        const concernPct = allRatings.length > 0 ? ((totalConcerns / allRatings.length) * 100).toFixed(1) : "0";
        const satisfiedPct = allRatings.length > 0 ? ((totalSatisfied / allRatings.length) * 100).toFixed(1) : "0";
        const responseRate = (ratingQs.length > 0 && responses.length > 0) 
          ? ((allRatings.length / (ratingQs.length * responses.length)) * 100).toFixed(1) 
          : "0";
        
        statsData.push([cat.label, ratingQs.length, avgRating, concernPct + "%", satisfiedPct + "%", responseRate + "%"]);
      }
    });
    
    const statsSheet = XLSX.utils.aoa_to_sheet(statsData);
    statsSheet["!cols"] = [{ wch: 28 }, { wch: 15 }, { wch: 16 }, { wch: 18 }, { wch: 14 }, { wch: 14 }];
    XLSX.utils.book_append_sheet(wb, statsSheet, "Statistics");

    XLSX.writeFile(wb, `${sv.title.replace(/\s+/g, "_")}_Survey_Report_${new Date().toISOString().slice(0, 10)}.xlsx`);
  } catch (e) {
    alert("Export error: " + e.message);
  }
}

function App() {
  const [auth, setAuth] = useState(() => {
    try { const s = sessionStorage.getItem("sf_auth_ttn"); return s ? JSON.parse(s) : null; }
    catch { return null; }
  });
  const [toast, setToast] = useState(null);
  const t = m => setToast(m);

  const logout = () => {
    setAuth(null);
    sessionStorage.removeItem("sf_auth_ttn");
    try { if (window.google) google.accounts.id.disableAutoSelect(); } catch { }
    t("👋 Signed out successfully.");
  };

  const onLogin = u => {
    setAuth(u);
    try { sessionStorage.setItem("sf_auth_ttn", JSON.stringify(u)); } catch { }
  };

  return <>
    {!auth && <Login onLogin={onLogin} t={t} />}
    {auth?.role === "admin" && <AdminApp auth={auth} out={logout} t={t} />}
    {auth?.role === "user" && <UserApp auth={auth} out={logout} t={t} />}
    {toast && <Toast msg={toast} done={() => setToast(null)} />}
  </>;
}

function Login({ onLogin, t }) {
  const btnRef = useRef(null);
  const ok = configured();

  const handleCred = useCallback(resp => {
    try {
      const p = parseJwt(resp.credential);
      if (!p?.email) { t("❌ Google sign-in failed."); return; }
      if (!inDomain(p.email)) { t(`❌ Only @${SF.DOMAIN} accounts allowed.`); return; }
      const u = { email: p.email, name: p.name || p.email, picture: p.picture || null, given_name: p.given_name || "", role: isAdmin(p.email) ? "admin" : "user" };
      onLogin(u);
      t(u.role === "admin" ? `✅ Welcome, ${u.given_name}! (Admin)` : `✅ Signed in!`);
    } catch (e) { t("❌ Error: " + e.message); }
  }, [onLogin, t]);

  useEffect(() => {
    if (!ok) return;
    const init = () => {
      if (!window.google || !btnRef.current) return;
      try {
        google.accounts.id.initialize({ client_id: SF.CLIENT_ID, callback: handleCred, hosted_domain: SF.DOMAIN, auto_select: false, ux_mode: "popup" });
        google.accounts.id.renderButton(btnRef.current, { theme: "outline", size: "large", width: 380, text: "signin_with", shape: "rectangular" });
      } catch (e) { console.error("GSI error:", e); }
    };
    if (window.google) init();
    else { const iv = setInterval(() => { if (window.google) { clearInterval(iv); init(); } }, 250); return () => clearInterval(iv); }
  }, [ok, handleCred]);

  return (
    <div className="login-wrapper">

function AdminApp({ auth, out, t }) {
  const [surveys, setSurveys] = useState([]);
  const [loading, setLoading] = useState(true);
  const [pg, setPg] = useState("dash");
  const [sel, setSel] = useState(null);
  const [atab, setAtab] = useState("questions");
  const [nm, setNm] = useState(false);

  useEffect(() => {
    const unsub = surveysRef().onSnapshot(snap => {
      const sorted = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      setSurveys(sorted);
      setLoading(false);
    }, err => { console.error(err); setLoading(false); });
    return () => unsub();
  }, []);

  useEffect(() => {
    if (sel) setSel(s => surveys.find(x => x.id === s?.id) || s);
  }, [surveys]);

  const go = p => { setPg(p); setSel(null); };
  const handleNew = async sv => { 
    try { 
      const surveyWithQuestions = { 
        ...sv, 
        questions: DEFAULT_QUESTIONS,
        status: "draft",
        responseCount: 0,
        createdAt: new Date().toISOString()
      };
      await saveSurvey(surveyWithQuestions); 
      setNm(false); 
      t("✅ Survey created with all categories and questions!"); 
    } catch (e) { 
      t("❌ Error: " + e.message); 
    } 
  };
  const handleUpd = async (id, patch) => { try { await updateSurvey(id, patch); } catch (e) { t("❌ Error: " + e.message); } };
  const handleDel = async (id, title) => {
    if (window.confirm(`⚠️ Delete "${title}"?\n\nThis will remove the survey and all its responses. This action cannot be undone.`)) {
      try {
        await surveysRef().doc(id).delete();
        setSurveys(s => s.filter(x => x.id !== id));
        t("🗑️ Survey deleted.");
      } catch (e) {
        t("❌ Delete failed: " + e.message);
      }
    }
  };

  if (loading) return <div className="loader"><div className="spinner" /><p>Loading...</p></div>;

  return (
    <div style={{ minHeight: "100vh", background: "#F8FAFB" }}>
      <div className="nav">

            <div key={n.id} className={`si${pg === n.id && !sel ? " on" : ""}`} onClick={() => go(n.id)}>
              <span>{n.ic}</span>{n.lb}
            </div>
          ))}
          <div className="side-sec">Actions</div>
          <div className="si" onClick={() => setNm(true)}><span>➕</span>New Survey</div>
          <div className="side-sec">Account</div>
          <div className="si" onClick={out}><span>🚪</span>Sign Out</div>
        </div>
        <div className="main">
          {sel ? <SurveyDetail sv={sel} back={() => setSel(null)} upd={handleUpd} del={handleDel} t={t} atab={atab} setAtab={setAtab} />
            : pg === "dash" ? <Dashboard surveys={surveys} auth={auth} onSel={sv => { setSel(sv); setAtab("questions"); }} />
              : pg === "surveys" ? <SurveyList surveys={surveys} onSel={sv => { setSel(sv); setAtab("questions"); }} upd={handleUpd} del={handleDel} t={t} onNew={() => setNm(true)} />
                : <AllResponses surveys={surveys} />
          }
        </div>
      </div>
    </div>
  );
}

function Dashboard({ surveys, auth, onSel }) {
  const total = surveys.reduce((a, s) => a + (s.responseCount || 0), 0);
  const active = surveys.filter(s => s.status === "active");
  return (
    <div>
      <div style={{ fontSize: 28, fontWeight: 800, marginBottom: 6, background: "linear-gradient(135deg, #00519F 0%, #F9AD1B 100%)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", backgroundClip: "text" }}>Good {new Date().getHours() < 12 ? "morning" : "afternoon"}, {auth.given_name || auth.name.split(" ")[0]} 👋</div>
      <div style={{ fontSize: 14, color: "#6B7280", marginBottom: 28 }}>Real-time survey activity and insights</div>
      <div className="stat-grid">
        {[{ n: surveys.length, l: "Total Surveys", ic: "📋" }, { n: active.length, l: "Active Now", ic: "🟢" }, { n: total, l: "Total Responses", ic: "💬" }, { n: surveys.filter(s => s.status === "draft").length, l: "Drafts", ic: "📝" }].map((s, i) => (
          <div key={i} className="stat-card">
            <div style={{ fontSize: 24, marginBottom: 6 }}>{s.ic}</div>
            <div className="stat-number">{s.n}</div>
            <div className="stat-label">{s.l}</div>
          </div>
        ))}
      </div>
      <div className="card">
        <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 18 }}>All Surveys</div>
        {surveys.length === 0 && <div className="empty-state"><p>No surveys yet</p></div>}
        {surveys.map(sv => (
          <div key={sv.id} onClick={() => onSel(sv)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 0", borderBottom: "1px solid #E5E7EB", cursor: "pointer" }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 600, fontSize: 15 }}>{sv.title}</div>
              <div style={{ fontSize: 12, color: "#6B7280", marginTop: 4 }}>{(sv.questions || []).length} questions · {sv.responseCount || 0} responses</div>
            </div>
            <span className={`badge badge-${sv.status}`}>{sv.status}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function SurveyList({ surveys, onSel, upd, del, t, onNew }) {
  const tog = async sv => {
    if (sv.status === "draft") { await upd(sv.id, { status: "active" }); t("✅ Survey activated!"); }
    else if (sv.status === "active") { await upd(sv.id, { status: "ended" }); t("⏹ Survey ended."); }
  };
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 28 }}>
        <div><div style={{ fontSize: 24, fontWeight: 800 }}>Surveys</div><div style={{ fontSize: 13, color: "#6B7280" }}>Manage all surveys</div></div>
        <button className="btn btn-primary" onClick={onNew}>➕ New Survey</button>
      </div>
      {surveys.length === 0 && <div className="empty-state"><div className="empty-icon">📋</div><p className="empty-title">No surveys</p></div>}
      <div className="survey-grid">
        {surveys.map(sv => (
          <div key={sv.id} className="survey-card">
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
              <div style={{ fontWeight: 700, fontSize: 16 }}>{sv.title}</div>
              <span className={`badge badge-${sv.status}`}>{sv.status}</span>
            </div>
            <div style={{ display: "flex", gap: 20, padding: "12px 0", borderTop: "1px solid #E5E7EB", borderBottom: "1px solid #E5E7EB", marginBottom: 14 }}>
              <div><div style={{ fontSize: 24, fontWeight: 800, color: "#00519F" }}>{(sv.questions || []).length}</div><div style={{ fontSize: 11, color: "#6B7280" }}>Q's</div></div>
              <div><div style={{ fontSize: 24, fontWeight: 800, color: "#10B981" }}>{sv.responseCount || 0}</div><div style={{ fontSize: 11, color: "#6B7280" }}>Answers</div></div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn btn-outline" style={{ fontSize: 12, flex: 1 }} onClick={() => onSel(sv)}>View</button>
              {sv.status !== "ended" && <button className={`btn ${sv.status === "draft" ? "btn-success" : "btn-primary"}`} style={{ fontSize: 12, flex: 1 }} onClick={() => tog(sv)}>{sv.status === "draft" ? "Activate" : "End"}</button>}
              <button className="btn btn-ghost" style={{ fontSize: 12, color: "#EF4444", borderColor: "#EF4444", padding: "10px 12px" }} onClick={() => del(sv.id, sv.title)}>🗑️</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function SurveyDetail({ sv, back, upd, del, t, atab, setAtab }) {
  const [qs, setQs] = useState(() => {
    const questions = sv.questions || DEFAULT_QUESTIONS;
    return Array.isArray(questions) && questions.length > 0 ? questions : DEFAULT_QUESTIONS;
  });
  const [responses, setResponses] = useState([]);
  const [loadingR, setLoadingR] = useState(true);
  const [qm, setQm] = useState(false);
  const [eq, setEq] = useState(null);
  const [categoryFilter, setCategoryFilter] = useState(null);

  useEffect(() => {
    const unsub = responsesRef(sv.id).orderBy("at", "desc").onSnapshot(snap => {
      setResponses(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      setLoadingR(false);
    }, err => { setLoadingR(false); console.error(err); });
    return () => unsub();
  }, [sv.id]);

  useEffect(() => {
    const questions = sv.questions || DEFAULT_QUESTIONS;
    setQs(Array.isArray(questions) && questions.length > 0 ? questions : DEFAULT_QUESTIONS);
  }, [sv.questions]);

  const save = async () => { try { await upd(sv.id, { questions: qs }); t("💾 Saved!"); } catch (e) { t("❌ Error: " + e.message); } };
  const tog = async () => { if (sv.status === "draft") { await upd(sv.id, { status: "active" }); t("✅ Active!"); } else if (sv.status === "active") { await upd(sv.id, { status: "ended" }); t("⏹ Ended."); } };

  const filteredQs = categoryFilter ? qs.filter(q => q.category === categoryFilter) : qs;

  return (
    <div>
      {(qm || eq) && <QModal init={eq} onClose={() => { setQm(false); setEq(null); }} onSave={q => { if (eq) setQs(p => p.map(x => x.id === eq.id ? { ...eq, ...q } : x)); else setQs(p => [...p, { ...q, id: nid() }]); setQm(false); setEq(null); t("✅ " + (eq ? "Updated!" : "Added!")); }} />}

      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14, flexWrap: "wrap" }}>
        <button className="btn btn-ghost" style={{ fontSize: 12 }} onClick={back}>← Back</button>
        <span style={{ fontWeight: 700, fontSize: 18 }}>{sv.title}</span>
        <span className={`badge badge-${sv.status}`}>{sv.status}</span>
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 24, flexWrap: "wrap" }}>
        <span style={{ fontSize: 12, background: "rgba(235,54,36,0.1)", color: "#00519F", borderRadius: 99, padding: "5px 13px", fontWeight: 500 }}>📅 {fd(sv.start)} – {fd(sv.end)}</span>
        <span style={{ fontSize: 12, background: responses.length > 0 ? "#f0fdf4" : "rgba(235,54,36,0.1)", color: responses.length > 0 ? "#10B981" : "#00519F", borderRadius: 99, padding: "5px 13px", fontWeight: 600 }}>💬 {responses.length}</span>
        {sv.status !== "ended" && <button className={`btn ${sv.status === "draft" ? "btn-success" : "btn-primary"}`} style={{ fontSize: 12 }} onClick={tog}>{sv.status === "draft" ? "▶ Activate" : "⏹ End"}</button>}
        <button className="btn btn-outline" style={{ fontSize: 12 }} onClick={() => exportXL(sv, responses)}>📥 Excel</button>
        <button className="btn btn-ghost" style={{ fontSize: 12, color: "#EF4444", borderColor: "#EF4444" }} onClick={() => del(sv.id, sv.title)}>🗑️ Delete</button>
      </div>

      <div className="tab-row">
        {["questions", "responses", "analytics"].map(tb => (
          <div key={tb} className={`tab${atab === tb ? " active" : ""}`} onClick={() => setAtab(tb)}>
            {tb === "questions" ? "❓ Questions" : tb === "responses" ? `📬 Responses (${responses.length})` : "📊 Analytics"}
          </div>
        ))}
      </div>

      {atab === "questions" && <QuestionsTab qs={qs} filteredQs={filteredQs} categoryFilter={categoryFilter} setCategoryFilter={setCategoryFilter} setQs={setQs} save={save} setQm={setQm} setEq={setEq} />}
      {atab === "responses" && (loadingR ? <p>Loading...</p> : <ResponsesTable sv={sv} responses={responses} />)}
      {atab === "analytics" && (loadingR ? <p>Loading...</p> : <AnalyticsView sv={sv} responses={responses} categoryFilter={categoryFilter} setCategoryFilter={setCategoryFilter} />)}
    </div>
  );
}

function QuestionsTab({ qs, filteredQs, categoryFilter, setCategoryFilter, setQs, save, setQm, setEq }) {
  return (
    <div>
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 12, color: "#6B7280", marginBottom: 10, fontWeight: 600 }}>FILTER BY CATEGORY</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button className={`category-filter-button${!categoryFilter ? " active" : ""}`} onClick={() => setCategoryFilter(null)}>All ({qs.length})</button>
          {Object.entries(SURVEY_CATEGORIES).map(([key, cat]) => {

              <span>{cat.icon}</span> {cat.label}

function generateRatingAnalysis(answers) {
  if (!answers.length) return { avg: "—", sentiment: "Pending", summary: "No responses yet" };
  const vs = answers.map(a => parseInt(a)).filter(Boolean);
  const avg = (vs.reduce((a, b) => a + b, 0) / vs.length).toFixed(1);
  const sentiment = avg >= 4.5 ? "Exceptional" : avg >= 4 ? "Very Good" : avg >= 3 ? "Moderate" : avg >= 2 ? "Needs Attention" : "Critical";
  return { avg, sentiment, summary: `Average: ${avg}/5 (${sentiment}) from ${vs.length} respondents` };
}

function generateTextAnalysis(answers) {
  if (!answers.length) return { summary: "No responses collected yet" };
  
  // AI-style analysis for text responses
  const uniqueAnswers = [...new Set(answers)];
  const keywordCount = uniqueAnswers.length;
  
  // Common sentiment keywords
  const positiveKeywords = ["good", "great", "excellent", "happy", "satisfied", "improved", "better", "positive", "love", "appreciate", "wonderful", "amazing", "fantastic"];
  const negativeKeywords = ["bad", "poor", "issue", "problem", "concern", "disappointed", "frustrated", "difficult", "hate", "dislike", "terrible", "awful"];
  
  let positiveCount = 0;
  let negativeCount = 0;
  
  answers.forEach(answer => {
    const lowerAnswer = answer.toLowerCase();
    positiveKeywords.forEach(word => { if (lowerAnswer.includes(word)) positiveCount++; });
    negativeKeywords.forEach(word => { if (lowerAnswer.includes(word)) negativeCount++; });
  });
  
  let sentiment = "Neutral";
  if (positiveCount > negativeCount) sentiment = "Positive 😊";
  else if (negativeCount > positiveCount) sentiment = "Needs Attention ⚠️";
  else if (positiveCount > 0) sentiment = "Mixed Feedback 📊";
  
  return { 
    summary: `🤖 AI Analysis: ${keywordCount} unique insights | Sentiment: ${sentiment} | Response patterns detected across ${answers.length} feedback entries`
  };
}

function SurveyFill({ sv, auth, back, submit, already }) {
  const [ans, setAns] = useState({});
  const [done, setDone] = useState(already);
  const [submitting, setSubmitting] = useState(false);
  const [showThankYou, setShowThankYou] = useState(false);
  const qs = (sv.questions && Array.isArray(sv.questions) && sv.questions.length > 0) ? sv.questions : DEFAULT_QUESTIONS;
  const setA = (id, v) => setAns(a => ({ ...a, [id]: v }));
  const ratingQs = qs.filter(q => q.type === "rating");
  const textQs = qs.filter(q => q.type === "text");

  const finish = async () => {
    const miss = qs.filter(q => q.req && !ans[q.id]);
    if (miss.length) { alert(`Answer ${miss.length} required question(s).`); return; }
    setSubmitting(true);
    await submit(sv, ans);
    setShowThankYou(true);
    setSubmitting(false);
    setTimeout(() => {
      setDone(true);
      setShowThankYou(false);
    }, 3000);
  };

  const downloadResponses = () => {
    const data = {
      survey: sv.title,
      respondent: auth.name,
      email: auth.email,
      submittedAt: new Date().toLocaleString("en-IN"),
      responses: {}
    };
    
    qs.forEach(q => {
      const answer = ans[q.id];
      if (q.type === "rating") {
        data.responses[q.text] = RESPONSE_LABELS[answer] || answer;
      } else {
        data.responses[q.text] = answer;
      }
    });
    
    const csv = "Survey Responses\n\n" +
      `Survey: ${data.survey}\n` +
      `Name: ${data.respondent}\n` +
      `Email: ${data.email}\n` +
      `Submitted: ${data.submittedAt}\n\n` +
      Object.entries(data.responses).map(([q, a]) => `"${q}","${a}"`).join("\n");
    
    const blob = new Blob([csv], { type: "text/csv" });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `survey_responses_${Date.now()}.csv`;
    a.click();
    window.URL.revokeObjectURL(url);
  };

  if (done && already) return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "70vh" }}>
      <div style={{ textAlign: "center", padding: 48 }}>
        <div style={{ fontSize: 80, marginBottom: 20 }}>✓</div>
        <div style={{ fontSize: 28, fontWeight: 800, marginBottom: 12 }}>You have already shared your inputs</div>
        <div style={{ fontSize: 15, color: "#6B7280", marginBottom: 32 }}>Thank you for your participation!</div>
        <button className="btn btn-primary" style={{ fontSize: 15, padding: "12px 32px" }} onClick={back}>← Back to Home</button>
      </div>
    </div>
  );

  if (showThankYou) return (

        <div className="thank-you-modal">

        <div style={{ fontSize: 28, fontWeight: 800, marginBottom: 12 }}>Thank You!</div>
        <div style={{ fontSize: 15, color: "#6B7280", marginBottom: 32 }}>Your feedback matters. We're committed to creating an even better workplace.</div>
        <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap" }}>

  );

            {sv.title || "Newer Pulse Survey"}
          </div>
        </div>
        <div style={{ fontSize: 13, color: "#6B7280", lineHeight: 1.6 }}>
          {sv.desc || "Share your feedback to help us build a better workplace"}
        </div>
      </div>

      {/* Rating Questions Section */}
      {ratingQs.length > 0 && (
        <div>
          {ratingQs.map((q, idx) => (
            <div key={q.id} className="card" style={{ minHeight: 180, maxWidth: 900, margin: "0 auto", width: "100%" }}>
              <div style={{ display: "flex", gap: 14, marginBottom: 24 }}>
                <div className="question-number">{idx + 1}</div>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 17, lineHeight: 1.45, marginBottom: 4 }}>{q.text}</div>
                  {q.req && <div style={{ fontSize: 12, color: "#EF4444", marginTop: 6, fontWeight: 600 }}>* Required</div>}
                </div>
              </div>

              <div style={{ display: "flex", gap: 10, flexWrap: "nowrap", justifyContent: "center", padding: "0 20px" }}>
                {["1", "2", "3", "4", "5"].map(n => (
                  <div
                    key={n}
                    className={`response-option${ans[q.id] === n ? " selected" : ""}`}
                    onClick={() => setA(q.id, n)}
                    style={{ flex: "1 1 0", minWidth: 110, maxWidth: 150 }}
                  >
                    <div className="response-label">{RESPONSE_LABELS[n]}</div>
                    <div className="response-dot"></div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Text Questions Section */}
      {textQs.length > 0 && (
        <div>
          {textQs.map((q, idx) => (
            <div key={q.id} className="card" style={{ minHeight: 200 }}>
              <div style={{ display: "flex", gap: 14, marginBottom: 24 }}>
                <div className="question-number">{ratingQs.length + idx + 1}</div>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 17, lineHeight: 1.45, marginBottom: 4 }}>{q.text}</div>
                  {q.req && <div style={{ fontSize: 12, color: "#EF4444", marginTop: 6, fontWeight: 600 }}>* Required</div>}
                </div>
              </div>
              <textarea
                className="textarea"
                rows={6}
                value={ans[q.id] || ""}
                onChange={e => setA(q.id, e.target.value)}
                placeholder="Share your thoughts..."
                style={{ resize: "vertical" }}
              />
            </div>
          ))}
        </div>
      )}

      <div style={{ display: "flex", justifyContent: "flex-end", gap: 12, marginTop: 22 }}>
        <button className="btn btn-success" disabled={submitting} style={{ padding: "10px 26px" }} onClick={finish}>
          {submitting ? "Submitting..." : "Submit ✓"}
        </button>
      </div>
    </div>
  );
}

</script>
