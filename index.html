<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
const db=window.db;
const SF=window.SF;

/* ── helpers ── */
const fd=d=>d?new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"—";
const fdt=d=>d?new Date(d).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const configured=()=>SF.CLIENT_ID&&!SF.CLIENT_ID.startsWith("PASTE_");
const isAdmin=e=>(SF.ADMINS||[]).map(a=>a.toLowerCase()).includes((e||"").toLowerCase());
const inDomain=e=>(e||"").toLowerCase().endsWith("@"+SF.DOMAIN.toLowerCase());

function parseJwt(t){
  try{return JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));}catch{return null;}
}

/* ── Firestore helpers ── */
const surveysRef=()=>db.collection("surveys");
const responsesRef=sid=>db.collection("surveys").doc(sid).collection("responses");

async function loadSurveys(){
  const snap=await surveysRef().get();
  return snap.docs.map(d=>({id:d.id,...d.data()}));
}
async function saveSurvey(sv){
  const {id,...data}=sv;
  if(id&&!id.startsWith("new_")){
    await surveysRef().doc(id).set(data,{merge:true});
    return id;
  } else {
    const ref=await surveysRef().add({...data,createdAt:new Date().toISOString()});
    return ref.id;
  }
}
async function updateSurvey(id,patch){
  await surveysRef().doc(id).update(patch);
}
async function loadResponses(sid){
  const snap=await responsesRef(sid).orderBy("at","desc").get();
  return snap.docs.map(d=>({id:d.id,...d.data()}));
}
async function saveResponse(sid,resp){
  await responsesRef(sid).add(resp);
}

/* ── Excel export ── */
function exportXL(sv,responses){
  try{
    const wb=XLSX.utils.book_new();
    const h=["#","Email","Full Name","Submitted At",...sv.questions.map((q,i)=>`Q${i+1}: ${q.text}`)];
    const rows=responses.map((r,i)=>[i+1,r.email,r.name||"",fdt(r.at),...sv.questions.map(q=>r.ans[q.id]||"")]);
    const ws=XLSX.utils.aoa_to_sheet([h,...rows]);
    ws["!cols"]=[{wch:4},{wch:32},{wch:24},{wch:22},...sv.questions.map(q=>({wch:Math.max(q.text.length,20)}))];
    XLSX.utils.book_append_sheet(wb,ws,"Responses");
    const s=[["SURVEY SUMMARY"],["Title",sv.title],["Status",sv.status],["Responses",responses.length],["Exported",new Date().toLocaleString()],[""]];
    sv.questions.forEach((q,i)=>{
      s.push([`Q${i+1}`,q.text]);
      if(q.type==="mc"||q.type==="yn"){
        (q.type==="yn"?["Yes","No"]:q.options).forEach(o=>{
          const c=responses.filter(r=>r.ans[q.id]===o).length;
          const p=responses.length?Math.round(c/responses.length*100):0;
          s.push(["  →",o,c+" responses",p+"%"]);
        });
      } else if(q.type==="rating"){
        const vs=responses.map(r=>parseInt(r.ans[q.id])).filter(Boolean);
        s.push(["  →","Average:",(vs.length?(vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(1):"N/A")+"/5"]);
      } else {
        responses.forEach(r=>{if(r.ans[q.id])s.push(["  →",r.name,r.ans[q.id]]);});
      }
      s.push([""]);
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s),"Analysis");
    XLSX.writeFile(wb,`${sv.title.replace(/\s+/g,"_")}_${new Date().toISOString().slice(0,10)}.xlsx`);
  }catch(e){alert("Export error: "+e.message);}
}

/* ── Avatar ── */
function Av({auth,size=34}){
  const st={width:size,height:size,borderRadius:"50%",flexShrink:0};
  if(auth?.picture) return <img src={auth.picture} style={{...st,border:"2px solid rgba(255,255,255,.35)",objectFit:"cover"}} alt={auth.name} referrerPolicy="no-referrer"/>;
  const ini=(auth?.name||"U").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  return <div style={{...st,background:"#e11d48",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:size>30?13:11,color:"#fff"}}>{ini}</div>;
}

function Toast({msg,done}){
  useEffect(()=>{const t=setTimeout(done,4000);return()=>clearTimeout(t);},[]);
  return <div className="toast">{msg}</div>;
}

/* ══════════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════════ */
function App(){
  const [auth,setAuth]=useState(()=>{
    try{const s=sessionStorage.getItem("sf_auth_ttn");return s?JSON.parse(s):null;}catch{return null;}
  });
  const [toast,setToast]=useState(null);
  const t=m=>setToast(m);

  const logout=()=>{
    setAuth(null);
    sessionStorage.removeItem("sf_auth_ttn");
    try{if(window.google)google.accounts.id.disableAutoSelect();}catch{}
    t("👋 Signed out successfully.");
  };
  const onLogin=u=>{
    setAuth(u);
    try{sessionStorage.setItem("sf_auth_ttn",JSON.stringify(u));}catch{}
  };

  return(<>
    {!auth&&<Login onLogin={onLogin} t={t}/>}
    {auth?.role==="admin"&&<AdminApp auth={auth} out={logout} t={t}/>}
    {auth?.role==="user"&&<UserApp auth={auth} out={logout} t={t}/>}
    {toast&&<Toast msg={toast} done={()=>setToast(null)}/>}
  </>);
}

/* ══════════════════════════════════════════════
   LOGIN
══════════════════════════════════════════════ */
function Login({onLogin,t}){
  const btnRef=useRef(null);
  const ok=configured();

  const handleCred=useCallback(resp=>{
    try{
      const p=parseJwt(resp.credential);
      if(!p?.email){t("❌ Google sign-in failed.");return;}
      if(!inDomain(p.email)){t(`❌ Only @${SF.DOMAIN} accounts are allowed.`);return;}
      const u={email:p.email,name:p.name||p.email,picture:p.picture||null,given_name:p.given_name||"",role:isAdmin(p.email)?"admin":"user"};
      onLogin(u);
      t(u.role==="admin"?`✅ Welcome, ${u.given_name||u.name}! (Admin)`:`✅ Signed in as ${u.name}`);
    }catch(e){t("❌ Error: "+e.message);}
  },[onLogin,t]);

  useEffect(()=>{
    if(!ok)return;
    const init=()=>{
      if(!window.google||!btnRef.current)return;
      try{
        google.accounts.id.initialize({client_id:SF.CLIENT_ID,callback:handleCred,hosted_domain:SF.DOMAIN,auto_select:false,ux_mode:"popup"});
        google.accounts.id.renderButton(btnRef.current,{theme:"outline",size:"large",width:380,text:"signin_with",shape:"rectangular"});
      }catch(e){console.error("GSI error:",e);}
    };
    if(window.google)init();
    else{const iv=setInterval(()=>{if(window.google){clearInterval(iv);init();}},250);return()=>clearInterval(iv);}
  },[ok,handleCred]);

  return(
    <div className="lw">
      <div className="lc">
        <div className="ll">
          <div style={{fontSize:48,marginBottom:8}}>📋</div>
          <div style={{fontSize:26,fontWeight:800,color:"#1e3a8a",letterSpacing:"-1px"}}>{SF.APP}</div>
          <div style={{fontSize:14,fontWeight:600,color:"#374151",marginTop:2}}>{SF.ORG}</div>
          <div style={{fontSize:13,color:"var(--mu)",marginTop:4}}>Internal Survey Platform</div>
        </div>

        {!ok&&(
          <div style={{background:"#fefce8",border:"1.5px solid #fde047",borderRadius:10,padding:16,fontSize:13,color:"#713f12",marginBottom:20,lineHeight:1.7}}>
            <strong style={{display:"block",marginBottom:4}}>⚙️ Final step: Paste your Google OAuth Client ID</strong>
            Open <code style={{background:"#fef9c3",padding:"1px 6px",borderRadius:3}}>index.html</code> → find <code style={{background:"#fef9c3",padding:"1px 6px",borderRadius:3}}>PASTE_YOUR_GOOGLE_OAUTH_CLIENT_ID_HERE</code> → replace with your Client ID from Google Cloud Console.
          </div>
        )}

        {ok&&(
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:13,color:"var(--mu)",marginBottom:12}}>Sign in with your To The New Google account</div>
            <div className="domain-pill">
              🔒 Restricted to @{SF.DOMAIN}
            </div>
            <div ref={btnRef} style={{display:"flex",justifyContent:"center",marginBottom:18,minHeight:46}}/>
            <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#166534",lineHeight:1.7}}>
              <strong>Admin:</strong> rishabh.mehrotra & avantika.sinha have full admin access.<br/>
              All other @tothenew.com accounts are respondents.
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   ADMIN APP
══════════════════════════════════════════════ */
function AdminApp({auth,out,t}){
  const [surveys,setSurveys]=useState([]);
  const [loading,setLoading]=useState(true);
  const [pg,setPg]=useState("dash");
  const [sel,setSel]=useState(null);
  const [atab,setAtab]=useState("questions");
  const [nm,setNm]=useState(false);

  /* real-time listener on surveys */
  useEffect(()=>{
    const unsub=surveysRef().onSnapshot(snap=>{
      const sorted=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
      setSurveys(sorted);
      setLoading(false);
    },err=>{console.error(err);setLoading(false);});
    return()=>unsub();
  },[]);

  /* keep selected survey in sync */
  useEffect(()=>{
    if(sel) setSel(s=>surveys.find(x=>x.id===s?.id)||s);
  },[surveys]);

  const go=p=>{setPg(p);setSel(null);};

  const handleNew=async sv=>{
    try{
      const id=await saveSurvey(sv);
      setNm(false);
      t("✅ Survey created!");
    }catch(e){t("❌ Error: "+e.message);}
  };

  const handleUpd=async(id,patch)=>{
    try{await updateSurvey(id,patch);}
    catch(e){t("❌ Update failed: "+e.message);}
  };

  if(loading) return <div className="loader"><div className="spinner"/><div style={{fontSize:14,color:"var(--mu)"}}>Loading surveys...</div></div>;

  return(<div style={{minHeight:"100vh",background:"var(--bg)"}}>
    <div className="nav">
      <div className="nav-logo">
        <span style={{fontSize:22}}>📋</span>
        <div>
          <div className="nav-logo-text">{SF.APP} <span className="nav-logo-badge">Admin</span></div>
          <div style={{fontSize:11,color:"rgba(255,255,255,.6)",marginTop:-1}}>{SF.ORG}</div>
        </div>
      </div>
      <div className="nav-r">
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <div className="live-dot"/>
          <span style={{fontSize:11,color:"rgba(255,255,255,.6)"}}>Live</span>
        </div>
        <Av auth={auth}/>
        <div style={{lineHeight:1.3}}>
          <div className="nav-user" style={{fontWeight:600,color:"#fff",fontSize:13}}>{auth.name}</div>
          <div className="nav-user" style={{fontSize:11}}>{auth.email}</div>
        </div>
        <button className="btn bg2" style={{color:"#fff",borderColor:"rgba(255,255,255,.25)",fontSize:12}} onClick={out}>Sign out</button>
      </div>
    </div>

    {nm&&<NewSurveyModal onClose={()=>setNm(false)} onSave={handleNew}/>}

    <div className="lay">
      <div className="side">
        {[{id:"dash",ic:"📊",lb:"Dashboard"},{id:"surveys",ic:"📋",lb:"Surveys"},{id:"responses",ic:"📬",lb:"All Responses"}].map(n=>(
          <div key={n.id} className={`si${pg===n.id&&!sel?" on":""}`} onClick={()=>go(n.id)}>
            <span style={{fontSize:16}}>{n.ic}</span>{n.lb}
          </div>
        ))}
        <div className="side-sec">Actions</div>
        <div className="si" onClick={()=>setNm(true)}><span style={{fontSize:16}}>➕</span>New Survey</div>
        <div className="side-sec">Account</div>
        <div className="si" onClick={out}><span style={{fontSize:16}}>🚪</span>Sign Out</div>
      </div>
      <div className="main">
        {sel
          ?<SurveyDetail sv={sel} back={()=>setSel(null)} upd={handleUpd} t={t} atab={atab} setAtab={setAtab}/>
          :pg==="dash"?<Dashboard surveys={surveys} auth={auth} onSel={sv=>{setSel(sv);setAtab("questions");}}/>
          :pg==="surveys"?<SurveyList surveys={surveys} onSel={sv=>{setSel(sv);setAtab("questions");}} upd={handleUpd} t={t} onNew={()=>setNm(true)}/>
          :<AllResponses surveys={surveys}/>
        }
      </div>
    </div>
  </div>);
}

function Dashboard({surveys,auth,onSel}){
  const total=surveys.reduce((a,s)=>a+(s.responseCount||0),0);
  const active=surveys.filter(s=>s.status==="active");
  return(<div>
    <div style={{fontSize:22,fontWeight:700,marginBottom:2}}>Good {new Date().getHours()<12?"morning":"afternoon"}, {auth.given_name||auth.name.split(" ")[0]} 👋</div>
    <div style={{fontSize:14,color:"var(--mu)",marginBottom:22}}>Real-time survey activity overview.</div>
    <div className="stat-grid">
      {[{n:surveys.length,l:"Total Surveys",c:"#1a56db",ic:"📋"},{n:active.length,l:"Active Now",c:"#059669",ic:"🟢"},{n:total,l:"Total Responses",c:"#e11d48",ic:"💬"},{n:surveys.filter(s=>s.status==="draft").length,l:"Drafts",c:"#d97706",ic:"📝"}].map((s,i)=>(
        <div key={i} className="stat-card">
          <div style={{fontSize:22,marginBottom:4}}>{s.ic}</div>
          <div className="stat-n" style={{color:s.c}}>{s.n}</div>
          <div className="stat-l">{s.l}</div>
        </div>
      ))}
    </div>
    <div className="card">
      <div style={{fontWeight:700,fontSize:15,marginBottom:16}}>All Surveys</div>
      {surveys.length===0&&<div style={{color:"var(--mu)",textAlign:"center",padding:24,fontSize:13}}>No surveys yet. Create one!</div>}
      {surveys.map(sv=>(
        <div key={sv.id} onClick={()=>onSel(sv)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"13px 0",borderBottom:"1px solid var(--bd)",cursor:"pointer"}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:14}}>{sv.title}</div>
            <div style={{fontSize:12,color:"var(--mu)",marginTop:3}}>{(sv.questions||[]).length} questions · {sv.responseCount||0} responses · {fd(sv.start)} – {fd(sv.end)}</div>
          </div>
          <span className={`bdg bdg-${sv.status}`}>{sv.status}</span>
        </div>
      ))}
    </div>
  </div>);
}

function SurveyList({surveys,onSel,upd,t,onNew}){
  const tog=async sv=>{
    if(sv.status==="draft"){await upd(sv.id,{status:"active"});t("✅ Survey is now active!");}
    else if(sv.status==="active"){await upd(sv.id,{status:"ended"});t("⏹ Survey ended.");}
    else t("This survey has already ended.");
  };
  return(<div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:22}}>
      <div><div style={{fontSize:22,fontWeight:700}}>Surveys</div><div style={{fontSize:13,color:"var(--mu)"}}>All surveys sync in real-time across devices</div></div>
      <button className="btn bp" onClick={onNew}>➕ New Survey</button>
    </div>
    {surveys.length===0&&<div className="empty"><div style={{fontSize:52}}>📋</div><p style={{marginTop:14,fontSize:16,fontWeight:600}}>No surveys yet</p><button className="btn bp" style={{marginTop:18}} onClick={onNew}>Create first survey</button></div>}
    <div className="sg">{surveys.map(sv=>(
      <div key={sv.id} className={`sc ${sv.status}`}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
          <div style={{fontWeight:700,fontSize:15,flex:1,paddingRight:10,lineHeight:1.35}}>{sv.title}</div>
          <span className={`bdg bdg-${sv.status}`}>{sv.status}</span>
        </div>
        <div style={{fontSize:13,color:"var(--mu)",marginBottom:10,lineHeight:1.5}}>{sv.desc}</div>
        <div style={{fontSize:12,color:"var(--mu)",marginBottom:14}}>📅 {fd(sv.start)} → {fd(sv.end)}</div>
        <div style={{display:"flex",gap:24,padding:"12px 0",borderTop:"1px solid var(--bd)",borderBottom:"1px solid var(--bd)",marginBottom:14}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:24,fontWeight:800,color:"var(--p)"}}>{(sv.questions||[]).length}</div>
            <div style={{fontSize:11,color:"var(--mu)"}}>Questions</div>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:24,fontWeight:800,color:sv.responseCount>0?"var(--su)":"var(--p)"}}>{sv.responseCount||0}</div>
            <div style={{fontSize:11,color:"var(--mu)"}}>Responses</div>
          </div>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="btn bo" style={{fontSize:12,padding:"6px 14px"}} onClick={()=>onSel(sv)}>View Detail</button>
          {sv.status!=="ended"&&<button className={`btn ${sv.status==="draft"?"bs":"bw"}`} style={{fontSize:12,padding:"6px 14px"}} onClick={()=>tog(sv)}>{sv.status==="draft"?"▶ Activate":"⏹ End"}</button>}
        </div>
      </div>
    ))}</div>
  </div>);
}

function SurveyDetail({sv,back,upd,t,atab,setAtab}){
  const [qs,setQs]=useState(sv.questions||[]);
  const [responses,setResponses]=useState([]);
  const [loadingR,setLoadingR]=useState(true);
  const [qm,setQm]=useState(false);const [eq,setEq]=useState(null);

  /* real-time responses listener */
  useEffect(()=>{
    const unsub=responsesRef(sv.id).orderBy("at","desc").onSnapshot(snap=>{
      setResponses(snap.docs.map(d=>({id:d.id,...d.data()})));
      setLoadingR(false);
    },err=>{setLoadingR(false);console.error(err);});
    return()=>unsub();
  },[sv.id]);

  useEffect(()=>setQs(sv.questions||[]),[sv.questions]);

  const save=async()=>{
    try{await upd(sv.id,{questions:qs});t("💾 Questions saved!");}
    catch(e){t("❌ Save failed: "+e.message);}
  };
  const tog=async()=>{
    if(sv.status==="draft"){await upd(sv.id,{status:"active"});t("✅ Activated!");}
    else if(sv.status==="active"){await upd(sv.id,{status:"ended"});t("⏹ Ended.");}
  };

  return(<div>
    {(qm||eq)&&<QModal init={eq} onClose={()=>{setQm(false);setEq(null);}}
      onSave={q=>{
        if(eq)setQs(p=>p.map(x=>x.id===eq.id?{...eq,...q}:x));
        else setQs(p=>[...p,{...q,id:nid()}]);
        setQm(false);setEq(null);t("✅ "+(eq?"Updated!":"Added!"));
      }}/>}

    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,flexWrap:"wrap"}}>
      <button className="btn bg2" style={{fontSize:12,padding:"5px 13px"}} onClick={back}>← Back</button>
      <span style={{fontWeight:700,fontSize:18}}>{sv.title}</span>
      <span className={`bdg bdg-${sv.status}`}>{sv.status}</span>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap",alignItems:"center"}}>
      <span style={{fontSize:12,background:"#eff6ff",color:"var(--p)",borderRadius:99,padding:"4px 13px"}}>📅 {fd(sv.start)} – {fd(sv.end)}</span>
      <span style={{fontSize:12,background:responses.length>0?"#f0fdf4":"#eff6ff",color:responses.length>0?"var(--su)":"var(--p)",borderRadius:99,padding:"4px 13px",fontWeight:600,display:"flex",alignItems:"center",gap:5}}>
        {responses.length>0&&<div className="live-dot"/>}💬 {responses.length} responses
      </span>
      {sv.status!=="ended"&&<button className={`btn ${sv.status==="draft"?"bs":"bw"}`} style={{fontSize:12,padding:"6px 14px"}} onClick={tog}>{sv.status==="draft"?"▶ Activate":"⏹ End Survey"}</button>}
      <button className="btn bo" style={{fontSize:12,padding:"6px 14px"}} onClick={()=>exportXL(sv,responses)}>📥 Download Excel</button>
    </div>

    <div className="tab-r">
      {["questions","responses","analytics"].map(tb=>(
        <div key={tb} className={`tab${atab===tb?" on":""}`} onClick={()=>setAtab(tb)}>
          {tb==="questions"?"❓ Questions":tb==="responses"?`📬 Responses ${responses.length>0?"("+responses.length+")":""}`:  "📊 Analytics"}
        </div>
      ))}
    </div>

    {atab==="questions"&&<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span style={{fontSize:13,color:"var(--mu)"}}>{qs.length} question{qs.length!==1?"s":""}</span>
        <div style={{display:"flex",gap:8}}>
          <button className="btn bp" style={{fontSize:12,padding:"7px 16px"}} onClick={()=>setQm(true)}>+ Add Question</button>
          <button className="btn bs" style={{fontSize:12,padding:"7px 16px"}} onClick={save}>💾 Save</button>
        </div>
      </div>
      {qs.length===0&&<div className="empty"><div style={{fontSize:44}}>🤔</div><p style={{marginTop:12}}>No questions yet. Add some!</p></div>}
      {qs.map((q,i)=>(
        <div key={q.id} className="qcard">
          <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
            <div className="qnum">{i+1}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:14,lineHeight:1.4}}>{q.text}{q.req&&<span style={{color:"var(--da)",fontSize:12,marginLeft:8}}>*Required</span>}</div>
              <div style={{fontSize:12,color:"var(--mu)",marginTop:5}}>
                <span style={{background:"#f3f4f6",padding:"2px 8px",borderRadius:4,fontWeight:600}}>
                  {q.type==="mc"?"🔘 Multiple Choice":q.type==="text"?"✍️ Open Text":q.type==="rating"?"⭐ Rating 1–5":"👍 Yes / No"}
                </span>
                {q.type==="mc"&&<span style={{marginLeft:8}}>{q.options.join(" · ")}</span>}
              </div>
            </div>
            <button className="btn bg2" style={{fontSize:12,padding:"5px 11px"}} onClick={()=>setEq(q)}>✏️</button>
            <button className="btn bg2" style={{fontSize:12,padding:"5px 11px",color:"var(--da)"}} onClick={()=>setQs(p=>p.filter(x=>x.id!==q.id))}>🗑️</button>
          </div>
        </div>
      ))}
    </div>}

    {atab==="responses"&&(loadingR?<div style={{textAlign:"center",padding:40,color:"var(--mu)"}}>Loading responses...</div>:<RTable sv={sv} responses={responses}/>)}
    {atab==="analytics"&&(loadingR?<div style={{textAlign:"center",padding:40,color:"var(--mu)"}}>Loading...</div>:<Analytics sv={sv} responses={responses}/>)}
  </div>);
}

function RTable({sv,responses}){
  if(!responses.length) return <div className="empty"><div style={{fontSize:48}}>📭</div><p style={{marginTop:14,fontSize:16,fontWeight:600}}>No responses yet</p><p style={{fontSize:13,marginTop:6}}>Responses appear here in real-time as people submit.</p></div>;
  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <span style={{fontSize:13,color:"var(--mu)",display:"flex",alignItems:"center",gap:6}}><div className="live-dot"/> {responses.length} response{responses.length!==1?"s":""} — updates live</span>
      <button className="btn bo" style={{fontSize:12,padding:"7px 16px"}} onClick={()=>exportXL(sv,responses)}>📥 Export Excel</button>
    </div>
    <div className="tbl-wrap"><table>
      <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Submitted</th>{(sv.questions||[]).map((q,i)=><th key={q.id}>Q{i+1}</th>)}</tr></thead>
      <tbody>{responses.map((r,i)=>(
        <tr key={r.id}>
          <td style={{color:"var(--mu)"}}>{i+1}</td>
          <td><div style={{display:"flex",alignItems:"center",gap:8}}><Av auth={{name:r.name,picture:r.picture}} size={28}/><span style={{fontWeight:600,fontSize:13}}>{r.name||"—"}</span></div></td>
          <td style={{color:"var(--mu)",fontSize:12}}>{r.email}</td>
          <td style={{color:"var(--mu)",fontSize:12,whiteSpace:"nowrap"}}>{fdt(r.at)}</td>
          {(sv.questions||[]).map(q=><td key={q.id} style={{maxWidth:150,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:13}}>{r.ans?.[q.id]||"—"}</td>)}
        </tr>
      ))}</tbody>
    </table></div>
  </div>);
}

function Analytics({sv,responses}){
  if(!responses.length) return <div className="empty"><div style={{fontSize:48}}>📊</div><p style={{marginTop:14,fontSize:16,fontWeight:600}}>No data yet</p><p style={{fontSize:13,marginTop:6}}>Analytics populate in real-time as responses come in.</p></div>;
  return(<div>
    <div style={{marginBottom:18,fontSize:13,color:"var(--mu)",display:"flex",alignItems:"center",gap:6}}><div className="live-dot"/> Based on <strong style={{marginLeft:4}}>{responses.length}</strong>&nbsp;response{responses.length!==1?"s":""}. Updates live.</div>
    {(sv.questions||[]).map((q,i)=>{
      const ans=responses.map(r=>r.ans?.[q.id]).filter(Boolean);
      return(<div key={q.id} className="card">
        <div style={{fontWeight:700,fontSize:14,marginBottom:16}}>{i+1}. {q.text}</div>
        {(q.type==="mc"||q.type==="yn")&&(q.type==="yn"?["Yes","No"]:q.options).map(o=>{
          const c=ans.filter(a=>a===o).length;const p=ans.length?Math.round(c/ans.length*100):0;
          return(<div key={o} style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
            <div style={{width:140,fontSize:13,textAlign:"right",flexShrink:0,fontWeight:500}}>{o}</div>
            <div className="rb"><div className="rf" style={{width:p+"%",background:p>50?"var(--su)":"var(--p)"}}/></div>
            <div style={{fontSize:13,fontWeight:700,width:44,color:"var(--p)"}}>{p}%</div>
            <div style={{fontSize:12,color:"var(--mu)",width:24}}>{c}</div>
          </div>);
        })}
        {q.type==="rating"&&(()=>{
          const vs=responses.map(r=>parseInt(r.ans?.[q.id])).filter(Boolean);
          const avg=vs.length?(vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(1):"—";
          return(<div>
            <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:16}}><div style={{fontSize:40,fontWeight:800,color:"var(--p)"}}>{avg}</div><div style={{fontSize:14,color:"var(--mu)"}}>/ 5 average · {vs.length} responses</div></div>
            {[5,4,3,2,1].map(n=>{const c=vs.filter(v=>v===n).length;const p=vs.length?Math.round(c/vs.length*100):0;
              return(<div key={n} style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}>
                <div style={{width:80,fontSize:13,textAlign:"right",color:"#f59e0b"}}>{"★".repeat(n)}</div>
                <div className="rb"><div className="rf" style={{width:p+"%"}}/></div>
                <div style={{fontSize:12,color:"var(--mu)",width:52}}>{c} ({p}%)</div>
              </div>);
            })}
          </div>);
        })()}
        {q.type==="text"&&(<div>{ans.length===0&&<div style={{color:"var(--mu)",fontSize:13}}>No answers yet.</div>}{ans.map((a,j)=><div key={j} style={{background:"#f9fafb",border:"1px solid var(--bd)",borderRadius:8,padding:"11px 15px",fontSize:13,marginBottom:8,lineHeight:1.6,fontStyle:"italic"}}>#{j+1} "{a}"</div>)}</div>)}
      </div>);
    })}
  </div>);
}

function AllResponses({surveys}){
  const [all,setAll]=useState([]);
  const [loading,setLoading]=useState(true);
  useEffect(()=>{
    if(!surveys.length){setLoading(false);return;}
    Promise.all(surveys.map(sv=>responsesRef(sv.id).orderBy("at","desc").get().then(snap=>snap.docs.map(d=>({id:d.id,...d.data(),st:sv.title})))))
      .then(arrs=>{
        const flat=arrs.flat().sort((a,b)=>new Date(b.at)-new Date(a.at));
        setAll(flat);setLoading(false);
      }).catch(e=>{console.error(e);setLoading(false);});
  },[surveys]);
  return(<div>
    <div style={{fontSize:22,fontWeight:700,marginBottom:4}}>All Responses</div>
    <div style={{fontSize:13,color:"var(--mu)",marginBottom:20}}>{all.length} responses across {surveys.length} surveys</div>
    {loading?<div style={{textAlign:"center",padding:40,color:"var(--mu)"}}>Loading...</div>:(
      <div className="tbl-wrap"><table>
        <thead><tr><th>#</th><th>Survey</th><th>Name</th><th>Email</th><th>Submitted</th></tr></thead>
        <tbody>
          {all.length===0&&<tr><td colSpan={5} style={{textAlign:"center",padding:40,color:"var(--mu)"}}>No responses yet.</td></tr>}
          {all.map((r,i)=>(
            <tr key={i}>
              <td style={{color:"var(--mu)"}}>{i+1}</td>
              <td style={{fontWeight:600}}>{r.st}</td>
              <td><div style={{display:"flex",alignItems:"center",gap:8}}><Av auth={{name:r.name,picture:r.picture}} size={26}/><span style={{fontWeight:500,fontSize:13}}>{r.name||"—"}</span></div></td>
              <td style={{color:"var(--mu)",fontSize:12}}>{r.email}</td>
              <td style={{color:"var(--mu)",fontSize:12,whiteSpace:"nowrap"}}>{fdt(r.at)}</td>
            </tr>
          ))}
        </tbody>
      </table></div>
    )}
  </div>);
}

/* ── Modals ── */
function NewSurveyModal({onClose,onSave}){
  const [f,setF]=useState({title:"",desc:"",start:"",end:""});
  const s=k=>v=>setF(x=>({...x,[k]:v}));
  const [saving,setSaving]=useState(false);
  return(<div className="mbg"><div className="mod">
    <div className="mod-title">Create New Survey</div>
    <div className="fg"><label className="fl">Title *</label><input className="fi" value={f.title} onChange={e=>s("title")(e.target.value)} placeholder="e.g. Q3 Employee Engagement" autoFocus/></div>
    <div className="fg"><label className="fl">Description</label><textarea className="fi" rows={3} value={f.desc} onChange={e=>s("desc")(e.target.value)} placeholder="Brief purpose of this survey..." style={{resize:"vertical"}}/></div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      <div className="fg"><label className="fl">Start Date</label><input className="fi" type="date" value={f.start} onChange={e=>s("start")(e.target.value)}/></div>
      <div className="fg"><label className="fl">End Date</label><input className="fi" type="date" value={f.end} onChange={e=>s("end")(e.target.value)}/></div>
    </div>
    <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:4}}>
      <button className="btn bg2" onClick={onClose}>Cancel</button>
      <button className="btn bp" disabled={saving} onClick={async()=>{
        if(!f.title.trim())return alert("Title required.");
        setSaving(true);
        await onSave({...f,status:"draft",questions:[],responseCount:0,createdAt:new Date().toISOString()});
        setSaving(false);
      }}>{saving?"Creating...":"Create Survey"}</button>
    </div>
  </div></div>);
}

function QModal({init,onClose,onSave}){
  const [txt,setTxt]=useState(init?.text||"");
  const [tp,setTp]=useState(init?.type||"mc");
  const [opts,setOpts]=useState(init?.options?.length?init.options:["",""]);
  const [req,setReq]=useState(init?.req||false);
  const save=()=>{
    if(!txt.trim())return alert("Question text required.");
    if(tp==="mc"&&opts.filter(o=>o.trim()).length<2)return alert("Add at least 2 options.");
    onSave({text:txt,type:tp,options:tp==="mc"?opts.filter(o=>o.trim()):[],req});
  };
  const info={mc:"Respondents pick one from a list.",text:"Respondents type a free answer.",rating:"Rate from 1 (Poor) to 5 (Excellent).",yn:"Respondents choose Yes or No."};
  return(<div className="mbg"><div className="mod">
    <div className="mod-title">{init?"Edit":"Add"} Question</div>
    <div className="fg"><label className="fl">Question *</label><input className="fi" value={txt} onChange={e=>setTxt(e.target.value)} placeholder="What do you want to ask?" autoFocus/></div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:4}}>
      <div className="fg"><label className="fl">Type</label>
        <select className="fi" value={tp} onChange={e=>setTp(e.target.value)}>
          <option value="mc">🔘 Multiple Choice</option><option value="text">✍️ Open Text</option>
          <option value="rating">⭐ Rating (1–5)</option><option value="yn">👍 Yes / No</option>
        </select>
      </div>
      <div className="fg"><label className="fl">Required?</label>
        <div style={{display:"flex",alignItems:"center",gap:10,marginTop:10,cursor:"pointer"}} onClick={()=>setReq(r=>!r)}>
          <button className={`tog ${req?"on":""}`}/>
          <span style={{fontSize:13,color:"var(--mu)"}}>{req?"Required":"Optional"}</span>
        </div>
      </div>
    </div>
    <div style={{background:"#f0f9ff",border:"1px solid #bae6fd",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#0c4a6e",marginBottom:16}}>{info[tp]}</div>
    {tp==="mc"&&<div className="fg"><label className="fl">Options</label>
      {opts.map((o,i)=>(
        <div key={i} style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
          <span style={{fontSize:13,color:"var(--mu)",width:24,textAlign:"right",flexShrink:0}}>{String.fromCharCode(65+i)}.</span>
          <input className="fi" value={o} onChange={e=>setOpts(p=>p.map((x,j)=>j===i?e.target.value:x))} placeholder={`Option ${i+1}`} style={{flex:1}}/>
          {opts.length>2&&<button className="btn bg2" style={{fontSize:12,padding:"4px 9px",color:"var(--da)",flexShrink:0}} onClick={()=>setOpts(p=>p.filter((_,j)=>j!==i))}>✕</button>}
        </div>
      ))}
      <button className="btn bg2" style={{fontSize:12,padding:"5px 13px"}} onClick={()=>setOpts(p=>[...p,""])}>+ Add option</button>
    </div>}
    <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:8}}>
      <button className="btn bg2" onClick={onClose}>Cancel</button>
      <button className="btn bp" onClick={save}>{init?"Update":"Add Question"}</button>
    </div>
  </div></div>);
}

/* ══════════════════════════════════════════════
   USER / RESPONDENT APP
══════════════════════════════════════════════ */
function UserApp({auth,out,t}){
  const [surveys,setSurveys]=useState([]);
  const [loading,setLoading]=useState(true);
  const [sel,setSel]=useState(null);
  const [myResponses,setMyResponses]=useState({});

  /* real-time active surveys — no orderBy to avoid composite index requirement */
  useEffect(()=>{
    const unsub=surveysRef().onSnapshot(snap=>{
      const active=snap.docs
        .map(d=>({id:d.id,...d.data()}))
        .filter(s=>s.status==="active")
        .sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
      setSurveys(active);
      setLoading(false);
    },err=>{setLoading(false);console.error(err);t("❌ Error loading surveys: "+err.message);});
    return()=>unsub();
  },[]);

  /* check which surveys this user already responded to */
  useEffect(()=>{
    if(!surveys.length)return;
    surveys.forEach(sv=>{
      responsesRef(sv.id).where("email","==",auth.email).limit(1).get()
        .then(snap=>{if(!snap.empty)setMyResponses(m=>({...m,[sv.id]:true}));})
        .catch(console.error);
    });
  },[surveys,auth.email]);

  const submit=async(sv,ans)=>{
    try{
      const resp={email:auth.email,name:auth.name,picture:auth.picture||null,at:new Date().toISOString(),ans};
      await saveResponse(sv.id,resp);
      /* increment response count */
      await surveysRef().doc(sv.id).update({responseCount:firebase.firestore.FieldValue.increment(1)});
      setMyResponses(m=>({...m,[sv.id]:true}));
      setSel(null);
      t("🎉 Response submitted! Thank you.");
    }catch(e){t("❌ Submit failed: "+e.message);}
  };

  if(loading) return <div className="loader"><div className="spinner"/><div style={{fontSize:14,color:"var(--mu)"}}>Loading surveys...</div></div>;

  return(<div style={{minHeight:"100vh",background:"var(--bg)"}}>
    <div className="nav">
      <div className="nav-logo">
        <span style={{fontSize:22}}>📋</span>
        <div>
          <div className="nav-logo-text">{SF.APP}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,.6)",marginTop:-1}}>{SF.ORG}</div>
        </div>
      </div>
      <div className="nav-r">
        <Av auth={auth}/>
        <div style={{lineHeight:1.3}}>
          <div className="nav-user" style={{fontWeight:600,color:"#fff",fontSize:13}}>{auth.name}</div>
          <div className="nav-user" style={{fontSize:11}}>{auth.email}</div>
        </div>
        <button className="btn bg2" style={{color:"#fff",borderColor:"rgba(255,255,255,.25)",fontSize:12}} onClick={out}>Sign out</button>
      </div>
    </div>

    {sel
      ?<SurveyFill sv={sel} auth={auth} back={()=>setSel(null)} submit={submit} already={myResponses[sel.id]}/>
      :<div className="main" style={{maxWidth:720}}>
        <div style={{fontSize:22,fontWeight:700,marginBottom:4}}>Hello, {auth.given_name||auth.name.split(" ")[0]} 👋</div>
        <div style={{fontSize:14,color:"var(--mu)",marginBottom:22}}>Complete the surveys assigned to your team.</div>
        {surveys.length===0&&<div className="empty"><div style={{fontSize:56}}>📭</div><p style={{marginTop:16,fontSize:17,fontWeight:600}}>No active surveys right now</p><p style={{fontSize:13,marginTop:8}}>Your admin will notify you when a new survey is launched.</p></div>}
        {surveys.map(sv=>(
          <div key={sv.id} className="card" style={{cursor:"pointer",border:myResponses[sv.id]?"1px solid #bbf7d0":"1px solid var(--bd)"}} onClick={()=>setSel(sv)}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:16}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:16,marginBottom:6}}>{sv.title}</div>
                <div style={{fontSize:13,color:"var(--mu)",marginBottom:12,lineHeight:1.5}}>{sv.desc}</div>
                <div style={{fontSize:12,color:"var(--mu)",display:"flex",gap:18,flexWrap:"wrap"}}>
                  <span>📅 Closes {fd(sv.end)}</span>
                  <span>❓ {(sv.questions||[]).length} questions</span>
                  <span>⏱️ ~{(sv.questions||[]).length} min</span>
                </div>
              </div>
              <div style={{flexShrink:0,marginTop:2}}>
                {myResponses[sv.id]?<span className="bdg bdg-active">✓ Submitted</span>:<button className="btn bp" style={{fontSize:13}}>Start →</button>}
              </div>
            </div>
          </div>
        ))}
      </div>
    }
  </div>);
}

/* ── SURVEY FILL ── */
function SurveyFill({sv,auth,back,submit,already}){
  const [ans,setAns]=useState({});
  const [step,setStep]=useState(0);
  const [done,setDone]=useState(already);
  const [submitting,setSubmitting]=useState(false);
  const qs=sv.questions||[];
  const q=qs[step];const total=qs.length;
  const pct=Math.round((step/Math.max(total,1))*100);
  const setA=(id,v)=>setAns(a=>({...a,[id]:v}));
  const canNext=!q?.req||ans[q?.id];

  const finish=async()=>{
    const miss=qs.filter(q=>q.req&&!ans[q.id]);
    if(miss.length){alert(`Please answer required questions (${miss.length} remaining).`);return;}
    setSubmitting(true);
    await submit(sv,ans);
    setDone(true);setSubmitting(false);
  };

  if(done) return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"70vh"}}>
      <div style={{textAlign:"center",padding:48}}>
        <div style={{fontSize:80,marginBottom:18}}>🎉</div>
        <div style={{fontSize:28,fontWeight:800,marginBottom:10}}>Thank You!</div>
        <div style={{fontSize:15,color:"var(--mu)",marginBottom:8}}>Your response has been recorded successfully.</div>
        <div style={{fontSize:13,color:"var(--mu)",marginBottom:30}}>— {SF.ORG} Survey Team</div>
        <button className="btn bp" style={{fontSize:15,padding:"11px 30px"}} onClick={back}>← Back to Surveys</button>
      </div>
    </div>
  );

  if(total===0) return(<div className="sfw main"><button className="btn bg2" style={{marginBottom:18,fontSize:12}} onClick={back}>← Back</button><div className="card"><p style={{color:"var(--mu)"}}>This survey has no questions yet.</p></div></div>);

  return(<div className="sfw main">
    <button className="btn bg2" style={{marginBottom:20,fontSize:12}} onClick={back}>← Back</button>
    <div className="card" style={{marginBottom:20,borderLeft:"4px solid var(--p)"}}>
      <div style={{fontWeight:700,fontSize:18,marginBottom:4}}>{sv.title}</div>
      <div style={{fontSize:13,color:"var(--mu)",lineHeight:1.5}}>{sv.desc}</div>
    </div>
    <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:24}}>
      <span style={{fontSize:13,color:"var(--mu)",whiteSpace:"nowrap"}}>Q {step+1} of {total}</span>
      <div className="pb" style={{flex:1,margin:0}}><div className="pf" style={{width:pct+"%"}}/></div>
      <span style={{fontSize:13,fontWeight:700,color:"var(--p)",whiteSpace:"nowrap"}}>{pct}%</span>
    </div>
    <div className="card" style={{minHeight:240}}>
      <div style={{display:"flex",gap:14,marginBottom:22}}>
        <div className="qnum">{step+1}</div>
        <div><div style={{fontWeight:700,fontSize:16,lineHeight:1.45}}>{q.text}</div>{q.req&&<div style={{fontSize:12,color:"var(--da)",marginTop:5,fontWeight:600}}>* Required</div>}</div>
      </div>
      {q.type==="mc"&&q.options.map(o=>(
        <div key={o} className={`opt${ans[q.id]===o?" sel":""}`} onClick={()=>setA(q.id,o)}>
          <div style={{width:20,height:20,borderRadius:"50%",border:`2px solid ${ans[q.id]===o?"var(--p)":"var(--bd)"}`,background:ans[q.id]===o?"var(--p)":"#fff",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
            {ans[q.id]===o&&<div style={{width:8,height:8,borderRadius:"50%",background:"#fff"}}/>}
          </div><span>{o}</span>
        </div>
      ))}
      {q.type==="text"&&<textarea className="fi" rows={6} value={ans[q.id]||""} onChange={e=>setA(q.id,e.target.value)} placeholder="Type your answer here..." style={{resize:"vertical",fontSize:14,lineHeight:1.6}}/>}
      {q.type==="rating"&&<div>
        <div style={{display:"flex",gap:14,marginTop:4,flexWrap:"wrap"}}>
          {[1,2,3,4,5].map(n=><div key={n} className={`rat${ans[q.id]===String(n)?" sel":""}`} onClick={()=>setA(q.id,String(n))}>{n}</div>)}
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:10,fontSize:12,color:"var(--mu)",maxWidth:296}}><span>1 = Very Poor</span><span>5 = Excellent</span></div>
      </div>}
      {q.type==="yn"&&<div style={{display:"flex",gap:16,marginTop:4}}>
        {["Yes","No"].map(o=><div key={o} className={`opt${ans[q.id]===o?" sel":""}`} style={{flex:1,justifyContent:"center",padding:"20px 16px",fontSize:16,fontWeight:700,gap:10}} onClick={()=>setA(q.id,o)}><span style={{fontSize:24}}>{o==="Yes"?"✅":"❌"}</span>{o}</div>)}
      </div>}
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:18}}>
      <button className="btn bg2" disabled={step===0} onClick={()=>setStep(s=>s-1)} style={{opacity:step===0?.4:1,fontSize:13}}>← Previous</button>
      <span style={{fontSize:12,color:"var(--mu)"}}>{total-step-1} remaining</span>
      {step<total-1
        ?<button className="btn bp" disabled={!canNext} onClick={()=>setStep(s=>s+1)} style={{opacity:canNext?1:.4,fontSize:13}}>Next →</button>
        :<button className="btn bs" disabled={submitting} onClick={finish} style={{fontSize:13,padding:"9px 24px"}}>{submitting?"Submitting...":"Submit Survey ✓"}</button>
      }
    </div>
  </div>);
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
