<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
html, body, #root { min-height: 100vh; }
body { background: #F8FAFB; }

:root {
  --ttn-primary: #00519F;
  --ttn-red: #00519F;
  --ttn-darkblue: #00519F;
  --ttn-purple: #623FA3;
  --ttn-cyan: #00C2E9;
  --ttn-gold: #F9AD1B;
  --success: #10B981;
  --danger: #EF4444;
}

/* ========== NAVIGATION ========== */
.nav {
  background: linear-gradient(135deg, #00519F 0%, #003C7A 100%);
  color: white;
  padding: 0 28px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 10px 40px rgba(0, 81, 159, 0.2);
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-logo-img {
  height: 48px;
  width: auto;
  object-fit: contain;
}

.nav-branding {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-logo-text {
  font-size: 20px;
  font-weight: 800;
  color: white;
  letter-spacing: -0.5px;
}

.nav-org {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.8);
  font-weight: 500;
}

.nav-badge {
  background: #F9AD1B;
  color: #1F2937;
  font-size: 12px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 6px;
  margin-left: 12px;
}

.nav-r {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-left: auto;
}

/* ========== LAYOUT ========== */
.lay { display: flex; min-height: calc(100vh - 80px); }
.side { width: 260px; background: white; border-right: 2px solid #E5E7EB; padding: 20px 0; position: sticky; top: 80px; height: calc(100vh - 80px); overflow-y: auto; }

.si {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  font-size: 14px;
  color: #374151;
  cursor: pointer;
  border-left: 4px solid transparent;
  transition: all 0.2s;
}

.si:hover { background: #FFF5F2; color: var(--ttn-red); }
.si.on {
  background: linear-gradient(90deg, rgba(0, 81, 159, 0.1) 0%, transparent 100%);
  color: var(--ttn-red);
  border-left-color: var(--ttn-red);
  font-weight: 600;
}

.side-sec { margin: 20px 20px 8px; font-size: 10px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 1px; }

.main { flex: 1; padding: 36px 40px; overflow-y: auto; background: #F8FAFB; }

/* ========== CARDS ========== */
.card {
  background: white;
  border-radius: 14px;
  border: 1px solid #E5E7EB;
  padding: 24px;
  margin-bottom: 22px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  transition: all 0.3s;
}

.card:hover { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); }

/* ========== CATEGORY SECTION ========== */
.category-section {
  background: linear-gradient(135deg, rgba(0, 81, 159, 0.05) 0%, rgba(0, 194, 233, 0.05) 100%);
  border: 2px solid rgba(0, 81, 159, 0.2);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 24px;
  border-left: 6px solid var(--ttn-red);
}

.category-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--ttn-red);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.category-badge {
  background: var(--ttn-red);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
}

/* ========== BUTTONS ========== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  white-space: nowrap;
}

.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, #00519F 0%, #003D7A 100%);
  color: white;
  box-shadow: 0 4px 14px rgba(0, 81, 159, 0.4);
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(0, 81, 159, 0.5);
}

.btn-success {
  background: linear-gradient(135deg, #10B981 0%, #059669 100%);
  color: white;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
}

.btn-success:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(16, 185, 129, 0.5);
}

.btn-outline {
  background: white;
  color: var(--ttn-red);
  border: 2px solid var(--ttn-red);
}

.btn-outline:hover:not(:disabled) { background: #FFF5F2; }

.btn-ghost {
  background: white;
  color: #374151;
  border: 1px solid #E5E7EB;
}

.btn-ghost:hover:not(:disabled) { background: #F9FAFB; color: var(--ttn-red); }

/* ========== BADGES ========== */
.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
}

.badge-active { background: #D1FAE5; color: #065F46; }
.badge-draft { background: #FEF3C7; color: #92400E; }
.badge-ended { background: #FEE2E2; color: #991B1B; }

/* ========== STAT GRID ========== */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  margin-bottom: 28px;
}

.stat-card {
  background: white;
  border: 1px solid #E5E7EB;
  border-radius: 14px;
  padding: 24px;
  border-left: 5px solid var(--ttn-primary);
  box-shadow: 0 2px 8px rgba(0, 81, 159, 0.08);
}

.stat-number {
  font-size: 36px;
  font-weight: 800;
  color: var(--ttn-primary);
  line-height: 1;
}

.stat-label {
  font-size: 12px;
  color: #374151;
  margin-top: 8px;
  font-weight: 500;
}

/* ========== FORMS ========== */
.input, .textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #E5E7EB;
  border-radius: 10px;
  font-size: 14px;
  color: #111827;
  outline: none;
  background: white;
  transition: all 0.2s;
  font-family: inherit;
}

.input:focus, .textarea:focus {
  border-color: var(--ttn-red);
  box-shadow: 0 0 0 4px rgba(0, 81, 159, 0.1);
}

.label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #111827;
}

.form-group { margin-bottom: 18px; }

/* ========== TABS ========== */
.tab-row {
  display: flex;
  border-bottom: 2px solid #E5E7EB;
  margin-bottom: 24px;
  gap: 8px;
}

.tab {
  padding: 12px 22px;
  font-size: 14px;
  font-weight: 500;
  color: #374151;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  transition: all 0.2s;
}

.tab.active {
  color: var(--ttn-red);
  border-bottom-color: var(--ttn-red);
  font-weight: 600;
}

/* ========== TABLES ========== */
.table-wrapper {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid #E5E7EB;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  background: linear-gradient(90deg, #F8FAFB 0%, #F0F4F8 100%);
  padding: 14px 16px;
  text-align: left;
  font-weight: 700;
  font-size: 11px;
  color: #374151;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  border-bottom: 2px solid #E5E7EB;
}

td {
  padding: 14px 16px;
  border-bottom: 1px solid #E5E7EB;
  color: #111827;
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: #F9FAFB; }

/* ========== SURVEY GRID ========== */
.survey-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}

.survey-card {
  background: white;
  border: 1px solid #E5E7EB;
  border-radius: 14px;
  padding: 24px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
  border-top: 5px solid var(--ttn-red);
}

.survey-card:hover {
  box-shadow: 0 12px 32px rgba(0, 81, 159, 0.2);
  transform: translateY(-4px);
}

/* ========== PROGRESS ========== */
.progress-bar {
  background: #E5E7EB;
  border-radius: 99px;
  height: 7px;
  overflow: hidden;
  margin-bottom: 24px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--ttn-red) 0%, var(--ttn-gold) 100%);
  border-radius: 99px;
  transition: width 0.4s;
}

/* ========== QUESTION STYLING ========== */
.question-number {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, #00519F 0%, #003D7A 100%);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(0, 81, 159, 0.4);
}

.option {
  padding: 14px 16px;
  border: 2px solid #E5E7EB;
  border-radius: 12px;
  margin-bottom: 10px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.2s;
  background: white;
}

.option:hover { border-color: var(--ttn-red); background: #FFF5F2; }
.option.selected {
  border-color: var(--ttn-red);
  background: rgba(0, 81, 159, 0.08);
  font-weight: 600;
}

.rating-button {
  width: 60px;
  height: 60px;
  border: 2px solid #E5E7EB;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-weight: 700;
  font-size: 18px;
  transition: all 0.2s;
  background: white;
}

.rating-button:hover { border-color: var(--ttn-red); }
.rating-button.selected {
  border-color: var(--ttn-red);
  background: linear-gradient(135deg, #00519F 0%, #003D7A 100%);
  color: white;
  box-shadow: 0 4px 12px rgba(0, 81, 159, 0.4);
}

/* ========== MODALS ========== */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 500;
  padding: 16px;
}

.modal {
  background: white;
  border-radius: 16px;
  padding: 28px;
  width: 560px;
  max-width: 100%;
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.22);
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 22px;
  color: #111827;
}

/* ========== LOGIN ========== */
.login-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #00519F 0%, #003C7A 50%, #00C2E9 100%);
  padding: 16px;
}

.login-container {
  background: white;
  border-radius: 20px;
  padding: 44px 40px;
  width: 460px;
  max-width: 100%;
  box-shadow: 0 28px 72px rgba(0, 0, 0, 0.28);
}

.login-header {
  text-align: center;
  margin-bottom: 30px;
}

.login-logo { font-size: 48px; margin-bottom: 12px; }
.login-title { font-size: 26px; font-weight: 800; background: linear-gradient(135deg, #00519F 0%, #F9AD1B 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

/* ========== EMPTY STATE ========== */
.empty-state {
  text-align: center;
  padding: 52px 20px;
  color: #6B7280;
}

.empty-icon { font-size: 64px; margin-bottom: 16px; }
.empty-title { font-size: 17px; font-weight: 700; color: #111827; margin-bottom: 8px; }

/* ========== LOADER ========== */
.loader {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  flex-direction: column;
  gap: 16px;
  background: #F8FAFB;
}

.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid #E5E7EB;
  border-top-color: var(--ttn-red);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ========== TOAST ========== */
.toast {
  position: fixed;
  bottom: 26px;
  right: 26px;
  background: #111827;
  color: white;
  padding: 14px 22px;
  border-radius: 12px;
  font-size: 14px;
  z-index: 9999;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  animation: slideIn 0.3s ease;
}

@keyframes slideIn { from { transform: translateY(18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ========== ANALYTICS ========== */
.analytics-box {
  background: linear-gradient(135deg, #FFF5F2 0%, #FFFFFF 100%);
  border: 1px solid rgba(0, 81, 159, 0.2);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  border-left: 4px solid var(--ttn-red);
}

.chart-wrapper {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
  gap: 24px;
  margin-bottom: 24px;
}

.chart-container {
  position: relative;
  height: 340px;
  background: white;
  border-radius: 12px;
  border: 1px solid #E5E7EB;
  padding: 16px;
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .side { display: none; }
  .main { padding: 20px; }
  .survey-grid { grid-template-columns: 1fr; }
  .chart-wrapper { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 480px) {
  .nav { padding: 0 12px; height: 70px; }
  .nav-logo-text { font-size: 16px; }
  .main { padding: 16px; }
  .card { padding: 16px; }
  .stat-grid { grid-template-columns: 1fr; }
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}

.question-card {
  background: #F9FAFB;
  border: 1px solid #E5E7EB;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}

.toggle {
  width: 44px;
  height: 24px;
  border-radius: 99px;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
  flex-shrink: 0;
  border: none;
  background: #d1d5db;
}

.toggle::after {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  background: white;
  border-radius: 50%;
  top: 3px;
  left: 3px;
  transition: left 0.2s;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
}

.toggle.on {
  background: var(--success);
}

.toggle.on::after {
  left: 23px;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00519F 0%, #F9AD1B 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  font-size: 12px;
}

.survey-fill-width { max-width: 720px; margin: 0 auto; }

.category-filter-button {
  display: inline-block;
  background: white;
  border: 2px solid #E5E7EB;
  color: #374151;
  padding: 8px 14px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  margin-right: 8px;
  margin-bottom: 8px;
}

.category-filter-button:hover,
.category-filter-button.active {
  background: var(--ttn-red);
  color: white;
  border-color: var(--ttn-red);
}
</style>

<script type="text/babel">

// Generate questions with categories
function generateQuestions() {
  const questions = [];
  Object.entries(SURVEY_CATEGORIES).forEach(([catKey, cat]) => {
    cat.questions.forEach((q, idx) => {
      questions.push({
        id: `${catKey}_${idx}`,
        category: catKey,
        categoryLabel: cat.label,
        ...q
      });
    });
  });
  return questions;
}

const DEFAULT_QUESTIONS = generateQuestions();

/* HELPERS */
const fd = d => d ? new Date(d).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "—";
const fdt = d => d ? new Date(d).toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const configured = () => SF.CLIENT_ID && !SF.CLIENT_ID.startsWith("PASTE_");
const isAdmin = e => (SF.ADMINS || []).map(a => a.toLowerCase()).includes((e || "").toLowerCase());
const inDomain = e => (e || "").toLowerCase().endsWith("@" + SF.DOMAIN.toLowerCase());

function parseJwt(t) {
  try { return JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); }
  catch { return null; }
}

const surveysRef = () => db.collection("surveys");
const responsesRef = sid => db.collection("surveys").doc(sid).collection("responses");

async function loadSurveys() {
  const snap = await surveysRef().get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function saveSurvey(sv) {
  const { id, ...data } = sv;
  if (id && !id.startsWith("new_")) {
    await surveysRef().doc(id).set(data, { merge: true });
    return id;
  } else {
    const ref = await surveysRef().add({ ...data, createdAt: new Date().toISOString() });
    return ref.id;
  }
}

async function updateSurvey(id, patch) {
  await surveysRef().doc(id).update(patch);
}

async function saveResponse(sid, resp) {
  await responsesRef(sid).add(resp);
}

function exportXL(sv, responses) {
  try {
    const wb = XLSX.utils.book_new();
    
    // Create question headers with full text and category
    const questionHeaders = sv.questions.map((q, i) => {
      const categoryInfo = Object.entries(SURVEY_CATEGORIES).find(([key]) => key === q.category);
      const categoryName = categoryInfo ? categoryInfo[1].label : "Unknown";
      return `Q${i + 1}: [${categoryName}] ${q.text}`;
    });
    
    // Sheet 1: Detailed Response Analysis with Individual Summaries
    const headers = ["#", "Email", "Full Name", "Submitted At", ...questionHeaders, "Average", "Summary"];
    
    const rows = responses.map((r, i) => {
      // Get all rating questions and their answers for this person
      const ratingQuestions = sv.questions.filter(q => q.type === "rating");
      const ratingAnswers = ratingQuestions.map((q, idx) => {
        const answer = r.ans[q.id];
        return { answer: parseInt(answer), qIndex: sv.questions.indexOf(q) };
      }).filter(v => !isNaN(v.answer));
      
      const avgRating = ratingAnswers.length > 0 
        ? (ratingAnswers.reduce((sum, v) => sum + v.answer, 0) / ratingAnswers.length).toFixed(2) 
        : "N/A";
      
      // Find questions with low ratings (≤3) and get their question numbers
      const concerns = [];
      sv.questions.forEach((q, qIdx) => {
        if (q.type === "rating") {
          const answer = parseInt(r.ans[q.id]);
          if (!isNaN(answer) && answer <= 3) {
            concerns.push(qIdx + 1); // Store question number (1-indexed)
          }
        }
      });
      
      // Create summary based on concerns
      let summary = "";
      if (concerns.length === 0) {
        if (avgRating >= 4.5) {
          summary = "🌟 No Concerns, Excellent feedback!";
        } else if (avgRating >= 4) {
          summary = "✅ No Concerns, Very happy";
        } else if (avgRating >= 3.5) {
          summary = "👍 No Concerns, Satisfied";
        } else {
          summary = "No specific low ratings";
        }
      } else {
        summary = `⚠️ Major concerns in Q${concerns.join(", Q")}`;
      }
      
      // Build row with all answers
      const answerValues = sv.questions.map(q => r.ans[q.id] || "");
      return [i + 1, r.email, r.name || "", fdt(r.at), ...answerValues, avgRating, summary];
    });
    
    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    
    // Set column widths - make question columns narrower and summary wider
    const colWidths = [
      { wch: 4 },           // #
      { wch: 28 },          // Email
      { wch: 18 },          // Full Name
      { wch: 18 },          // Submitted At
      ...sv.questions.map(q => ({ wch: 4 })), // Question columns - narrow for ratings
      { wch: 12 },          // Average Rating
      { wch: 55 }           // Summary - wide for detailed text
    ];
    ws["!cols"] = colWidths;
    
    // Wrap text in headers for better readability
    ws["!rows"] = [{ hpx: 40 }]; // Make header row taller
    
    XLSX.utils.book_append_sheet(wb, ws, "Response Analysis");

    // Sheet 2: Detailed Category Summary
    const summaryData = [["CATEGORY WISE ANALYSIS"]];
    summaryData.push([]);
    
    Object.entries(SURVEY_CATEGORIES).forEach(([key, cat]) => {
      const catQs = sv.questions.filter(q => q.category === key);
      if (catQs.length > 0) {
        summaryData.push([cat.label, "", "", ""]);
        
        catQs.forEach((q, idx) => {
          const ans = responses.map(r => r.ans?.[q.id]).filter(Boolean);
          const count = ans.length;
          const responseRate = count > 0 ? ((count / responses.length) * 100).toFixed(1) : "0";
          
          if (q.type === "rating") {
            const ratings = ans.map(a => parseInt(a));
            const avg = ratings.length > 0 ? (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(2) : "N/A";
            const concernCount = ratings.filter(r => r <= 3).length;
            const satisfied = ratings.filter(r => r >= 4).length;
            
            summaryData.push([
              `  ${q.text}`,
              `Avg: ${avg}/5`,
              `Concerns: ${concernCount}`,
              `Satisfied: ${satisfied}`
            ]);
          } else {
            summaryData.push([
              `  ${q.text}`,
              `Responses: ${count}`,
              `Rate: ${responseRate}%`,
              ""
            ]);
          }
        });
        summaryData.push([]);
      }
    });
    
    const summarySheet = XLSX.utils.aoa_to_sheet(summaryData);
    summarySheet["!cols"] = [{ wch: 70 }, { wch: 18 }, { wch: 18 }, { wch: 18 }];
    XLSX.utils.book_append_sheet(wb, summarySheet, "Category Analysis");

    // Sheet 3: Category Statistics Table
    const statsData = [["Category", "Total Questions", "Average Rating", "High Concerns (%)", "Satisfied (%)", "Response Rate"]];
    Object.entries(SURVEY_CATEGORIES).forEach(([key, cat]) => {
      const catQs = sv.questions.filter(q => q.category === key);
      const ratingQs = catQs.filter(q => q.type === "rating");
      if (ratingQs.length > 0) {
        let totalConcerns = 0;
        let totalSatisfied = 0;
        const allRatings = [];
        
        ratingQs.forEach(q => {
          const ans = responses.map(r => r.ans?.[q.id]).filter(Boolean);
          ans.forEach(a => {
            const rating = parseInt(a);
            allRatings.push(rating);
            if (rating <= 3) totalConcerns++;
            if (rating >= 4) totalSatisfied++;
          });
        });
        
        const avgRating = allRatings.length > 0 ? (allRatings.reduce((a, b) => a + b, 0) / allRatings.length).toFixed(2) : "N/A";
        const concernPct = allRatings.length > 0 ? ((totalConcerns / allRatings.length) * 100).toFixed(1) : "0";
        const satisfiedPct = allRatings.length > 0 ? ((totalSatisfied / allRatings.length) * 100).toFixed(1) : "0";
        const responseRate = (ratingQs.length > 0 && responses.length > 0) 
          ? ((allRatings.length / (ratingQs.length * responses.length)) * 100).toFixed(1) 
          : "0";
        
        statsData.push([cat.label, ratingQs.length, avgRating, concernPct + "%", satisfiedPct + "%", responseRate + "%"]);
      }
    });
    
    const statsSheet = XLSX.utils.aoa_to_sheet(statsData);
    statsSheet["!cols"] = [{ wch: 28 }, { wch: 15 }, { wch: 16 }, { wch: 18 }, { wch: 14 }, { wch: 14 }];
    XLSX.utils.book_append_sheet(wb, statsSheet, "Statistics");

    XLSX.writeFile(wb, `${sv.title.replace(/\s+/g, "_")}_Survey_Report_${new Date().toISOString().slice(0, 10)}.xlsx`);
  } catch (e) {
    alert("Export error: " + e.message);
  }
}

function Avatar({ auth, size = 40 }) {
  if (auth?.picture) return <img src={auth.picture} style={{ width: size, height: size, borderRadius: "50%", border: "2px solid rgba(255,255,255,.3)", objectFit: "cover" }} alt={auth.name} referrerPolicy="no-referrer" />;
  const ini = (auth?.name || "U").split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
  return <div className="avatar" style={{ width: size, height: size, fontSize: size > 40 ? 13 : 11 }}>{ini}</div>;
}

function Toast({ msg, done }) {
  useEffect(() => { const t = setTimeout(done, 4000); return () => clearTimeout(t); }, [done]);
  return <div className="toast">{msg}</div>;
}

function App() {
  const [auth, setAuth] = useState(() => {
    try { const s = sessionStorage.getItem("sf_auth_ttn"); return s ? JSON.parse(s) : null; }
    catch { return null; }
  });
  const [toast, setToast] = useState(null);
  const t = m => setToast(m);

  const logout = () => {
    setAuth(null);
    sessionStorage.removeItem("sf_auth_ttn");
    try { if (window.google) google.accounts.id.disableAutoSelect(); } catch { }
    t("👋 Signed out successfully.");
  };

  const onLogin = u => {
    setAuth(u);
    try { sessionStorage.setItem("sf_auth_ttn", JSON.stringify(u)); } catch { }
  };

  return <>
    {!auth && <Login onLogin={onLogin} t={t} />}
    {auth?.role === "admin" && <AdminApp auth={auth} out={logout} t={t} />}
    {auth?.role === "user" && <UserApp auth={auth} out={logout} t={t} />}
    {toast && <Toast msg={toast} done={() => setToast(null)} />}
  </>;
}

function Login({ onLogin, t }) {
  const btnRef = useRef(null);
  const ok = configured();

  const handleCred = useCallback(resp => {
    try {
      const p = parseJwt(resp.credential);
      if (!p?.email) { t("❌ Google sign-in failed."); return; }
      if (!inDomain(p.email)) { t(`❌ Only @${SF.DOMAIN} accounts allowed.`); return; }
      const u = { email: p.email, name: p.name || p.email, picture: p.picture || null, given_name: p.given_name || "", role: isAdmin(p.email) ? "admin" : "user" };
      onLogin(u);
      t(u.role === "admin" ? `✅ Welcome, ${u.given_name}! (Admin)` : `✅ Signed in!`);

function AdminApp({ auth, out, t }) {
  const [surveys, setSurveys] = useState([]);
  const [loading, setLoading] = useState(true);
  const [pg, setPg] = useState("dash");
  const [sel, setSel] = useState(null);
  const [atab, setAtab] = useState("questions");
  const [nm, setNm] = useState(false);

  useEffect(() => {
    const unsub = surveysRef().onSnapshot(snap => {
      const sorted = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      setSurveys(sorted);
      setLoading(false);
    }, err => { console.error(err); setLoading(false); });
    return () => unsub();
  }, []);

  useEffect(() => {
    if (sel) setSel(s => surveys.find(x => x.id === s?.id) || s);
  }, [surveys]);

  const go = p => { setPg(p); setSel(null); };
  const handleNew = async sv => { 
    try { 
      const surveyWithQuestions = { 
        ...sv, 
        questions: DEFAULT_QUESTIONS,
        status: "draft",
        responseCount: 0,
        createdAt: new Date().toISOString()
      };
      await saveSurvey(surveyWithQuestions); 
      setNm(false); 
      t("✅ Survey created with all categories and questions!"); 
    } catch (e) { 
      t("❌ Error: " + e.message); 
    } 
  };
  const handleUpd = async (id, patch) => { try { await updateSurvey(id, patch); } catch (e) { t("❌ Error: " + e.message); } };
  const handleDel = async (id, title) => {
    if (window.confirm(`⚠️ Delete "${title}"?\n\nThis will remove the survey and all its responses. This action cannot be undone.`)) {
      try {
        await surveysRef().doc(id).delete();
        setSurveys(s => s.filter(x => x.id !== id));
        t("🗑️ Survey deleted.");
      } catch (e) {
        t("❌ Delete failed: " + e.message);
      }
    }
  };

  if (loading) return <div className="loader"><div className="spinner" /><p>Loading...</p></div>;

  return (
    <div style={{ minHeight: "100vh", background: "#F8FAFB" }}>

function Dashboard({ surveys, auth, onSel }) {
  const total = surveys.reduce((a, s) => a + (s.responseCount || 0), 0);
  const active = surveys.filter(s => s.status === "active");
  return (
    <div>
      <div style={{ fontSize: 28, fontWeight: 800, marginBottom: 6, background: "linear-gradient(135deg, #00519F 0%, #F9AD1B 100%)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", backgroundClip: "text" }}>Good {new Date().getHours() < 12 ? "morning" : "afternoon"}, {auth.given_name || auth.name.split(" ")[0]} 👋</div>
      <div style={{ fontSize: 14, color: "#6B7280", marginBottom: 28 }}>Real-time survey activity and insights</div>
      <div className="stat-grid">
        {[{ n: surveys.length, l: "Total Surveys", ic: "📋" }, { n: active.length, l: "Active Now", ic: "🟢" }, { n: total, l: "Total Responses", ic: "💬" }, { n: surveys.filter(s => s.status === "draft").length, l: "Drafts", ic: "📝" }].map((s, i) => (
          <div key={i} className="stat-card">
            <div style={{ fontSize: 24, marginBottom: 6 }}>{s.ic}</div>
            <div className="stat-number">{s.n}</div>
            <div className="stat-label">{s.l}</div>
          </div>
        ))}
      </div>
      <div className="card">
        <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 18 }}>All Surveys</div>
        {surveys.length === 0 && <div className="empty-state"><p>No surveys yet</p></div>}
        {surveys.map(sv => (
          <div key={sv.id} onClick={() => onSel(sv)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 0", borderBottom: "1px solid #E5E7EB", cursor: "pointer" }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 600, fontSize: 15 }}>{sv.title}</div>
              <div style={{ fontSize: 12, color: "#6B7280", marginTop: 4 }}>{(sv.questions || []).length} questions · {sv.responseCount || 0} responses</div>
            </div>
            <span className={`badge badge-${sv.status}`}>{sv.status}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function SurveyList({ surveys, onSel, upd, del, t, onNew }) {
  const tog = async sv => {
    if (sv.status === "draft") { await upd(sv.id, { status: "active" }); t("✅ Survey activated!"); }
    else if (sv.status === "active") { await upd(sv.id, { status: "ended" }); t("⏹ Survey ended."); }
  };
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 28 }}>
        <div><div style={{ fontSize: 24, fontWeight: 800 }}>Surveys</div><div style={{ fontSize: 13, color: "#6B7280" }}>Manage all surveys</div></div>
        <button className="btn btn-primary" onClick={onNew}>➕ New Survey</button>
      </div>
      {surveys.length === 0 && <div className="empty-state"><div className="empty-icon">📋</div><p className="empty-title">No surveys</p></div>}
      <div className="survey-grid">
        {surveys.map(sv => (
          <div key={sv.id} className="survey-card">
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
              <div style={{ fontWeight: 700, fontSize: 16 }}>{sv.title}</div>
              <span className={`badge badge-${sv.status}`}>{sv.status}</span>
            </div>
            <div style={{ display: "flex", gap: 20, padding: "12px 0", borderTop: "1px solid #E5E7EB", borderBottom: "1px solid #E5E7EB", marginBottom: 14 }}>
              <div><div style={{ fontSize: 24, fontWeight: 800, color: "#00519F" }}>{(sv.questions || []).length}</div><div style={{ fontSize: 11, color: "#6B7280" }}>Q's</div></div>
              <div><div style={{ fontSize: 24, fontWeight: 800, color: "#10B981" }}>{sv.responseCount || 0}</div><div style={{ fontSize: 11, color: "#6B7280" }}>Answers</div></div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn btn-outline" style={{ fontSize: 12, flex: 1 }} onClick={() => onSel(sv)}>View</button>
              {sv.status !== "ended" && <button className={`btn ${sv.status === "draft" ? "btn-success" : "btn-primary"}`} style={{ fontSize: 12, flex: 1 }} onClick={() => tog(sv)}>{sv.status === "draft" ? "Activate" : "End"}</button>}
              <button className="btn btn-ghost" style={{ fontSize: 12, color: "#EF4444", borderColor: "#EF4444", padding: "10px 12px" }} onClick={() => del(sv.id, sv.title)}>🗑️</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function SurveyDetail({ sv, back, upd, del, t, atab, setAtab }) {
  const [qs, setQs] = useState(() => {
    const questions = sv.questions || DEFAULT_QUESTIONS;
    return Array.isArray(questions) && questions.length > 0 ? questions : DEFAULT_QUESTIONS;
  });
  const [responses, setResponses] = useState([]);
  const [loadingR, setLoadingR] = useState(true);
  const [qm, setQm] = useState(false);
  const [eq, setEq] = useState(null);
  const [categoryFilter, setCategoryFilter] = useState(null);

  useEffect(() => {
    const unsub = responsesRef(sv.id).orderBy("at", "desc").onSnapshot(snap => {
      setResponses(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      setLoadingR(false);
    }, err => { setLoadingR(false); console.error(err); });
    return () => unsub();
  }, [sv.id]);

  useEffect(() => {
    const questions = sv.questions || DEFAULT_QUESTIONS;
    setQs(Array.isArray(questions) && questions.length > 0 ? questions : DEFAULT_QUESTIONS);
  }, [sv.questions]);

function generateRatingAnalysis(answers) {
  if (!answers.length) return { avg: "—", sentiment: "Pending", summary: "No responses yet" };
  const vs = answers.map(a => parseInt(a)).filter(Boolean);
  const avg = (vs.reduce((a, b) => a + b, 0) / vs.length).toFixed(1);
  const sentiment = avg >= 4.5 ? "Exceptional" : avg >= 4 ? "Very Good" : avg >= 3 ? "Moderate" : avg >= 2 ? "Needs Attention" : "Critical";
  return { avg, sentiment, summary: `Average: ${avg}/5 (${sentiment}) from ${vs.length} respondents` };
}

function generateTextAnalysis(answers) {
  if (!answers.length) return { summary: "No responses collected yet" };
  
  // AI-style analysis for text responses
  const uniqueAnswers = [...new Set(answers)];
  const keywordCount = uniqueAnswers.length;
  
  // Common sentiment keywords
  const positiveKeywords = ["good", "great", "excellent", "happy", "satisfied", "improved", "better", "positive", "love", "appreciate", "wonderful", "amazing", "fantastic"];
  const negativeKeywords = ["bad", "poor", "issue", "problem", "concern", "disappointed", "frustrated", "difficult", "hate", "dislike", "terrible", "awful"];
  
  let positiveCount = 0;
  let negativeCount = 0;
  
  answers.forEach(answer => {
    const lowerAnswer = answer.toLowerCase();
    positiveKeywords.forEach(word => { if (lowerAnswer.includes(word)) positiveCount++; });
    negativeKeywords.forEach(word => { if (lowerAnswer.includes(word)) negativeCount++; });
  });
  
  let sentiment = "Neutral";
  if (positiveCount > negativeCount) sentiment = "Positive 😊";
  else if (negativeCount > positiveCount) sentiment = "Needs Attention ⚠️";
  else if (positiveCount > 0) sentiment = "Mixed Feedback 📊";
  
  return { 
    summary: `🤖 AI Analysis: ${keywordCount} unique insights | Sentiment: ${sentiment} | Response patterns detected across ${answers.length} feedback entries`
  };
}

      setSel(null);

            <div style={{ width: 4, height: 32, background: "#F9AD1B", borderRadius: 2 }} />
            <div>
              <div style={{ fontSize: 24, fontWeight: 800, color: "white", lineHeight: 1 }}>SurveyFlow</div>
              <div style={{ fontSize: 12, color: "rgba(255,255,255,0.8)", marginTop: 4 }}>To The New</div>
            </div>
          </div>
        </div>
        <div className="nav-r">
          <Avatar auth={auth} />
          <div style={{ lineHeight: 1.3 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: "white" }}>{auth.name}</div>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,.8)" }}>{auth.email}</div>
          </div>
          <button style={{ color: "white", background: "rgba(255,255,255,0.15)", border: "1.5px solid rgba(255,255,255,0.4)", padding: "8px 16px", borderRadius: "8px", fontSize: "12px", fontWeight: 600, cursor: "pointer" }} onClick={out}>Sign out</button>
        </div>
      </div>

      {sel ? <SurveyFill sv={sel} auth={auth} back={() => setSel(null)} submit={submit} already={myResponses[sel.id]} />
        : <div className="main survey-fill-width">
          <div style={{ fontSize: 28, fontWeight: 800, marginBottom: 6, background: "linear-gradient(135deg, #00519F 0%, #F9AD1B 100%)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", backgroundClip: "text" }}>Hello, {auth.given_name || auth.name.split(" ")[0]} 👋</div>
          <div style={{ fontSize: 14, color: "#6B7280", marginBottom: 28 }}>Share your feedback to help us build a better workplace</div>
          {surveys.length === 0 && <div className="empty-state"><div className="empty-icon">📭</div><p className="empty-title">No active surveys</p></div>}
          {surveys.map(sv => (
            <div key={sv.id} className="card" style={{ cursor: "pointer" }} onClick={() => setSel(sv)}>
              <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 8 }}>{sv.title}</div>
                  <div style={{ fontSize: 13, color: "#6B7280", marginBottom: 14, lineHeight: 1.6 }}>{sv.desc}</div>
                  <div style={{ fontSize: 12, color: "#6B7280", display: "flex", gap: 18, flexWrap: "wrap" }}>
                    <span>📅 Closes {fd(sv.end)}</span>
                    <span>❓ {(sv.questions || []).length} questions</span>
                    <span>⏱️ ~{Math.ceil((sv.questions || []).length / 3)} min</span>
                  </div>
                </div>
                <div style={{ flexShrink: 0 }}>
                  {myResponses[sv.id] ? <span className="badge badge-active">✓ Done</span> : <button className="btn btn-primary" style={{ fontSize: 13 }}>Start →</button>}

              </div>
            </div>

function SurveyFill({ sv, auth, back, submit, already }) {
  const [ans, setAns] = useState({});
  const [step, setStep] = useState(0);
  const [done, setDone] = useState(already);
  const [submitting, setSubmitting] = useState(false);
  const qs = (sv.questions && Array.isArray(sv.questions) && sv.questions.length > 0) ? sv.questions : DEFAULT_QUESTIONS;
  const q = qs[step];
  const total = qs.length;
  const pct = Math.round((step / Math.max(total, 1)) * 100);
  const setA = (id, v) => setAns(a => ({ ...a, [id]: v }));
  const canNext = !q?.req || ans[q?.id];

  const finish = async () => {
    const miss = qs.filter(q => q.req && !ans[q.id]);
    if (miss.length) { alert(`Answer ${miss.length} required question(s).`); return; }
    setSubmitting(true);
    await submit(sv, ans);
    setDone(true);
    setSubmitting(false);
  };

  if (done) return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "70vh" }}>
      <div style={{ textAlign: "center", padding: 48 }}>
        <div style={{ fontSize: 80, marginBottom: 20 }}>🎉</div>
        <div style={{ fontSize: 28, fontWeight: 800, marginBottom: 12 }}>Thank You!</div>
        <div style={{ fontSize: 15, color: "#6B7280", marginBottom: 32 }}>Your feedback matters. We're committed to creating an even better workplace.</div>
        <button className="btn btn-primary" style={{ fontSize: 15, padding: "12px 32px" }} onClick={back}>← Back to Home</button>
      </div>
    </div>
  );

  if (total === 0) return <div className="survey-fill-width main"><button className="btn btn-ghost" onClick={back}>← Back</button><div className="card"><p>No questions</p></div></div>;

  const currentCategory = q?.categoryLabel;
  const categoryColor = Object.values(SURVEY_CATEGORIES).find(c => c.label === currentCategory)?.color || "#00519F";

  return (
    <div className="survey-fill-width main">
      <button className="btn btn-ghost" style={{ marginBottom: 22 }} onClick={back}>← Back</button>
      <div className="card" style={{ marginBottom: 22, borderLeft: "4px solid #00519F" }}>
        <div style={{ fontWeight: 700, fontSize: 18, marginBottom: 6 }}>
          {sv.title || "Employee Engagement Survey"}
        </div>
        <div style={{ fontSize: 13, color: "#6B7280", lineHeight: 1.6 }}>
          {sv.desc || "Share your feedback to help us build a better workplace"}
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 26 }}>
        <span style={{ fontSize: 13, color: "#6B7280", whiteSpace: "nowrap" }}>Q {step + 1} of {total}</span>
        <div className="progress-bar" style={{ flex: 1 }}><div className="progress-fill" style={{ width: pct + "%" }} /></div>
        <span style={{ fontSize: 13, fontWeight: 700, color: "#00519F", whiteSpace: "nowrap" }}>{pct}%</span>
      </div>
      <div className="card" style={{ minHeight: 240 }}>
        <div style={{ marginBottom: 20, padding: "12px 16px", background: `linear-gradient(135deg, ${categoryColor}15 0%, ${categoryColor}05 100%)`, border: `1px solid ${categoryColor}30`, borderRadius: 8, fontSize: 12, fontWeight: 600, color: categoryColor }}>
          SECTION: {currentCategory}
        </div>
        <div style={{ display: "flex", gap: 14, marginBottom: 24 }}>
          <div className="question-number">{step + 1}</div>
          <div><div style={{ fontWeight: 700, fontSize: 17, lineHeight: 1.45, marginBottom: 4 }}>{q.text}</div>{q.req && <div style={{ fontSize: 12, color: "#EF4444", marginTop: 6, fontWeight: 600 }}>* Required</div>}</div>
        </div>

        {q.type === "rating" && (
          <div>
            <div style={{ display: "flex", gap: 12, marginTop: 6, flexWrap: "wrap" }}>
              {[1, 2, 3, 4, 5].map(n => (
                <div key={n} className={`rating-button${ans[q.id] === String(n) ? " selected" : ""}`} onClick={() => setA(q.id, String(n))}>{n}</div>
              ))}
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 14, fontSize: 12, color: "#6B7280" }}>
              <span>1 = Strongly Disagree</span>
              <span>5 = Strongly Agree</span>
            </div>
          </div>
        )}

        {q.type === "text" && (
          <textarea
            className="textarea"
            rows={6}
            value={ans[q.id] || ""}
            onChange={e => setA(q.id, e.target.value)}
            placeholder="Share your thoughts..."
            style={{ resize: "vertical" }}
          />
        )}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 22 }}>
        <button className="btn btn-ghost" disabled={step === 0} style={{ opacity: step === 0 ? 0.4 : 1 }} onClick={() => setStep(s => s - 1)}>← Previous</button>
        <span style={{ fontSize: 12, color: "#6B7280" }}>{total - step - 1} remaining</span>
        {step < total - 1 ? <button className="btn btn-primary" disabled={!canNext} style={{ opacity: canNext ? 1 : 0.4 }} onClick={() => setStep(s => s + 1)}>Next →</button> : <button className="btn btn-success" disabled={submitting} style={{ padding: "10px 26px" }} onClick={finish}>{submitting ? "Submitting..." : "Submit ✓"}</button>}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
