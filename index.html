<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
html, body, #root { min-height: 100vh; }
body { background: #F8FAFB; }

:root {
  --ttn-primary: #00519F;
  --ttn-red: #EB3624;
  --ttn-darkblue: #00519F;
  --ttn-purple: #623FA3;
  --ttn-cyan: #00C2E9;
  --ttn-gold: #F9AD1B;
  --success: #10B981;
  --danger: #EF4444;
}

/* ========== NAVIGATION ========== */
.nav {
  background: linear-gradient(135deg, #00519F 0%, #003C7A 100%);
  color: white;
  padding: 0 28px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 10px 40px rgba(0, 81, 159, 0.2);
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: 1;
}

.nav-logo-img {
  height: 48px;
  width: auto;
  object-fit: contain;
}

.nav-branding {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-logo-text {
  font-size: 20px;
  font-weight: 800;
  color: white;
  letter-spacing: -0.5px;
}

.nav-org {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.8);
  font-weight: 500;
}

.nav-badge {
  background: linear-gradient(135deg, #EB3624 0%, #F9AD1B 100%);
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 99px;
  margin-left: 8px;
}

.nav-r {
  display: flex;
  align-items: center;
  gap: 16px;
}

/* ========== LAYOUT ========== */
.lay { display: flex; min-height: calc(100vh - 80px); }
.side { width: 260px; background: white; border-right: 2px solid #E5E7EB; padding: 20px 0; position: sticky; top: 80px; height: calc(100vh - 80px); overflow-y: auto; }

.si {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  font-size: 14px;
  color: #374151;
  cursor: pointer;
  border-left: 4px solid transparent;
  transition: all 0.2s;
}

.si:hover { background: #FFF5F2; color: var(--ttn-red); }
.si.on {
  background: linear-gradient(90deg, rgba(235, 54, 36, 0.1) 0%, transparent 100%);
  color: var(--ttn-red);
  border-left-color: var(--ttn-red);
  font-weight: 600;
}

.side-sec { margin: 20px 20px 8px; font-size: 10px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 1px; }

.main { flex: 1; padding: 36px 40px; overflow-y: auto; background: #F8FAFB; }

/* ========== CARDS ========== */
.card {
  background: white;
  border-radius: 14px;
  border: 1px solid #E5E7EB;
  padding: 24px;
  margin-bottom: 22px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  transition: all 0.3s;
}

.card:hover { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); }

/* ========== CATEGORY SECTION ========== */
.category-section {
  background: linear-gradient(135deg, rgba(235, 54, 36, 0.05) 0%, rgba(0, 194, 233, 0.05) 100%);
  border: 2px solid rgba(235, 54, 36, 0.2);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 24px;
  border-left: 6px solid var(--ttn-red);
}

.category-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--ttn-red);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.category-badge {
  background: var(--ttn-red);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
}

/* ========== BUTTONS ========== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  white-space: nowrap;
}

.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, #EB3624 0%, #D42C1B 100%);
  color: white;
  box-shadow: 0 4px 14px rgba(235, 54, 36, 0.4);
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(235, 54, 36, 0.5);
}

.btn-success {
  background: linear-gradient(135deg, #10B981 0%, #059669 100%);
  color: white;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
}

.btn-success:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(16, 185, 129, 0.5);
}

.btn-outline {
  background: white;
  color: var(--ttn-red);
  border: 2px solid var(--ttn-red);
}

.btn-outline:hover:not(:disabled) { background: #FFF5F2; }

.btn-ghost {
  background: white;
  color: #374151;
  border: 1px solid #E5E7EB;
}

.btn-ghost:hover:not(:disabled) { background: #F9FAFB; color: var(--ttn-red); }

/* ========== BADGES ========== */
.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
}

.badge-active { background: #D1FAE5; color: #065F46; }
.badge-draft { background: #FEF3C7; color: #92400E; }
.badge-ended { background: #FEE2E2; color: #991B1B; }

/* ========== STAT GRID ========== */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  margin-bottom: 28px;
}

.stat-card {
  background: white;
  border: 1px solid #E5E7EB;
  border-radius: 14px;
  padding: 24px;
  border-left: 5px solid var(--ttn-primary);
  box-shadow: 0 2px 8px rgba(0, 81, 159, 0.08);
}

.stat-number {
  font-size: 36px;
  font-weight: 800;
  color: var(--ttn-primary);
  line-height: 1;
}

.stat-label {
  font-size: 12px;
  color: #374151;
  margin-top: 8px;
  font-weight: 500;
}

/* ========== FORMS ========== */
.input, .textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #E5E7EB;
  border-radius: 10px;
  font-size: 14px;
  color: #111827;
  outline: none;
  background: white;
  transition: all 0.2s;
  font-family: inherit;
}

.input:focus, .textarea:focus {
  border-color: var(--ttn-red);
  box-shadow: 0 0 0 4px rgba(235, 54, 36, 0.1);
}

.label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #111827;
}

.form-group { margin-bottom: 18px; }

/* ========== TABS ========== */
.tab-row {
  display: flex;
  border-bottom: 2px solid #E5E7EB;
  margin-bottom: 24px;
  gap: 8px;
}

.tab {
  padding: 12px 22px;
  font-size: 14px;
  font-weight: 500;
  color: #374151;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  transition: all 0.2s;
}

.tab.active {
  color: var(--ttn-red);
  border-bottom-color: var(--ttn-red);
  font-weight: 600;
}

/* ========== TABLES ========== */
.table-wrapper {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid #E5E7EB;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  background: linear-gradient(90deg, #F8FAFB 0%, #F0F4F8 100%);
  padding: 14px 16px;
  text-align: left;
  font-weight: 700;
  font-size: 11px;
  color: #374151;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  border-bottom: 2px solid #E5E7EB;
}

td {
  padding: 14px 16px;
  border-bottom: 1px solid #E5E7EB;
  color: #111827;
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: #F9FAFB; }

/* ========== SURVEY GRID ========== */
.survey-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}

.survey-card {
  background: white;
  border: 1px solid #E5E7EB;
  border-radius: 14px;
  padding: 24px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
  border-top: 5px solid var(--ttn-red);
}

.survey-card:hover {
  box-shadow: 0 12px 32px rgba(235, 54, 36, 0.2);
  transform: translateY(-4px);
}

/* ========== PROGRESS ========== */
.progress-bar {
  background: #E5E7EB;
  border-radius: 99px;
  height: 7px;
  overflow: hidden;
  margin-bottom: 24px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--ttn-red) 0%, var(--ttn-gold) 100%);
  border-radius: 99px;
  transition: width 0.4s;
}

/* ========== QUESTION STYLING ========== */
.question-number {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, #EB3624 0%, #D42C1B 100%);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(235, 54, 36, 0.4);
}

.option {
  padding: 14px 16px;
  border: 2px solid #E5E7EB;
  border-radius: 12px;
  margin-bottom: 10px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.2s;
  background: white;
}

.option:hover { border-color: var(--ttn-red); background: #FFF5F2; }
.option.selected {
  border-color: var(--ttn-red);
  background: rgba(235, 54, 36, 0.08);
  font-weight: 600;
}

.rating-button {
  width: 60px;
  height: 60px;
  border: 2px solid #E5E7EB;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-weight: 700;
  font-size: 18px;
  transition: all 0.2s;
  background: white;
}

.rating-button:hover { border-color: var(--ttn-red); }
.rating-button.selected {
  border-color: var(--ttn-red);
  background: linear-gradient(135deg, #EB3624 0%, #D42C1B 100%);
  color: white;
  box-shadow: 0 4px 12px rgba(235, 54, 36, 0.4);
}

/* ========== MODALS ========== */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 500;
  padding: 16px;
}

.modal {
  background: white;
  border-radius: 16px;
  padding: 28px;
  width: 560px;
  max-width: 100%;
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.22);
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 22px;
  color: #111827;
}

/* ========== LOGIN ========== */
.login-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #00519F 0%, #003C7A 50%, #00C2E9 100%);
  padding: 16px;
}

.login-container {
  background: white;
  border-radius: 20px;
  padding: 44px 40px;
  width: 460px;
  max-width: 100%;
  box-shadow: 0 28px 72px rgba(0, 0, 0, 0.28);
}

.login-header {
  text-align: center;
  margin-bottom: 30px;
}

.login-logo { font-size: 48px; margin-bottom: 12px; }
.login-title { font-size: 26px; font-weight: 800; background: linear-gradient(135deg, #EB3624 0%, #F9AD1B 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

/* ========== EMPTY STATE ========== */
.empty-state {
  text-align: center;
  padding: 52px 20px;
  color: #6B7280;
}

.empty-icon { font-size: 64px; margin-bottom: 16px; }
.empty-title { font-size: 17px; font-weight: 700; color: #111827; margin-bottom: 8px; }

/* ========== LOADER ========== */
.loader {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  flex-direction: column;
  gap: 16px;
  background: #F8FAFB;
}

.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid #E5E7EB;
  border-top-color: var(--ttn-red);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ========== TOAST ========== */
.toast {
  position: fixed;
  bottom: 26px;
  right: 26px;
  background: #111827;
  color: white;
  padding: 14px 22px;
  border-radius: 12px;
  font-size: 14px;
  z-index: 9999;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  animation: slideIn 0.3s ease;
}

@keyframes slideIn { from { transform: translateY(18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ========== ANALYTICS ========== */
.analytics-box {
  background: linear-gradient(135deg, #FFF5F2 0%, #FFFFFF 100%);
  border: 1px solid rgba(235, 54, 36, 0.2);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  border-left: 4px solid var(--ttn-red);
}

.chart-wrapper {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
  gap: 24px;
  margin-bottom: 24px;
}

.chart-container {
  position: relative;
  height: 340px;
  background: white;
  border-radius: 12px;
  border: 1px solid #E5E7EB;
  padding: 16px;
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .side { display: none; }
  .main { padding: 20px; }
  .survey-grid { grid-template-columns: 1fr; }
  .chart-wrapper { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 480px) {
  .nav { padding: 0 12px; height: 70px; }
  .nav-logo-text { font-size: 16px; }
  .main { padding: 16px; }
  .card { padding: 16px; }
  .stat-grid { grid-template-columns: 1fr; }
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}

.question-card {
  background: #F9FAFB;
  border: 1px solid #E5E7EB;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}

.toggle {
  width: 44px;
  height: 24px;
  border-radius: 99px;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
  flex-shrink: 0;
  border: none;
  background: #d1d5db;
}

.toggle::after {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  background: white;
  border-radius: 50%;
  top: 3px;
  left: 3px;
  transition: left 0.2s;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
}

.toggle.on {
  background: var(--success);
}

.toggle.on::after {
  left: 23px;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #EB3624 0%, #F9AD1B 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  font-size: 12px;
}

.survey-fill-width { max-width: 720px; margin: 0 auto; }

.category-filter-button {
  display: inline-block;
  background: white;
  border: 2px solid #E5E7EB;
  color: #374151;
  padding: 8px 14px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  margin-right: 8px;
  margin-bottom: 8px;
}

.category-filter-button:hover,
.category-filter-button.active {
  background: var(--ttn-red);
  color: white;
  border-color: var(--ttn-red);
}
</style>

  const questions = [];
  Object.entries(SURVEY_CATEGORIES).forEach(([catKey, cat]) => {
    cat.questions.forEach((q, idx) => {
      questions.push({
        id: `${catKey}_${idx}`,
        category: catKey,
        categoryLabel: cat.label,
        ...q
      });
    });
  });
  return questions;
}

const DEFAULT_QUESTIONS = generateQuestions();

/* HELPERS */
const fd = d => d ? new Date(d).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "—";
const fdt = d => d ? new Date(d).toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const configured = () => SF.CLIENT_ID && !SF.CLIENT_ID.startsWith("PASTE_");
const isAdmin = e => (SF.ADMINS || []).map(a => a.toLowerCase()).includes((e || "").toLowerCase());
const inDomain = e => (e || "").toLowerCase().endsWith("@" + SF.DOMAIN.toLowerCase());

function parseJwt(t) {
  try { return JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); }
  catch { return null; }
}

const surveysRef = () => db.collection("surveys");
const responsesRef = sid => db.collection("surveys").doc(sid).collection("responses");

async function loadSurveys() {
  const snap = await surveysRef().get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function saveSurvey(sv) {
  const { id, ...data } = sv;
  if (id && !id.startsWith("new_")) {
    await surveysRef().doc(id).set(data, { merge: true });
    return id;
  } else {
    const ref = await surveysRef().add({ ...data, createdAt: new Date().toISOString() });
    return ref.id;
  }
}

async function updateSurvey(id, patch) {
  await surveysRef().doc(id).update(patch);
}

async function saveResponse(sid, resp) {
  await responsesRef(sid).add(resp);
}

function exportXL(sv, responses) {
  try {
    const wb = XLSX.utils.book_new();
    
    // Sheet 1: Raw Responses
    const h = ["#", "Email", "Full Name", "Submitted At", ...sv.questions.map((q, i) => `Q${i + 1}`), "Submitted Date"];
    const rows = responses.map((r, i) => [i + 1, r.email, r.name || "", fdt(r.at), ...sv.questions.map(q => r.ans[q.id] || ""), fd(r.at)]);
    const ws = XLSX.utils.aoa_to_sheet([h, ...rows]);
    ws["!cols"] = [{ wch: 4 }, { wch: 32 }, { wch: 24 }, { wch: 22 }, ...sv.questions.map(q => ({ wch: 30 })), { wch: 15 }];
    XLSX.utils.book_append_sheet(wb, ws, "Responses");

    // Sheet 2: Summary by Category
    const summaryData = [["Category Analysis Summary"]];
    summaryData.push([]);
    
    Object.entries(SURVEY_CATEGORIES).forEach(([key, cat]) => {
      const catQs = sv.questions.filter(q => q.category === key);
      if (catQs.length > 0) {
        summaryData.push([cat.label, `${catQs.length} questions`]);
        catQs.forEach(q => {
          const ans = responses.map(r => r.ans?.[q.id]).filter(Boolean);
          const count = ans.length;
          const responseRate = count > 0 ? ((count / responses.length) * 100).toFixed(1) : "0";
          if (q.type === "rating") {
            const avg = count > 0 ? (ans.map(a => parseInt(a)).reduce((a, b) => a + b, 0) / count).toFixed(1) : "N/A";
            summaryData.push([`  ${q.text}`, `Avg: ${avg}/5 (${count}/${responses.length} = ${responseRate}%)`]);
          } else {
            summaryData.push([`  ${q.text}`, `${count}/${responses.length} = ${responseRate}%`]);
          }
        });
        summaryData.push([]);
      }
    });
    
    const summarySheet = XLSX.utils.aoa_to_sheet(summaryData);
    summarySheet["!cols"] = [{ wch: 50 }, { wch: 40 }];
    XLSX.utils.book_append_sheet(wb, summarySheet, "Summary");

    // Sheet 3: Category Statistics Table
    const statsData = [["Category", "Questions", "Total Responses", "Response Rate %", "Average Rating (if applicable)"]];
    Object.entries(SURVEY_CATEGORIES).forEach(([key, cat]) => {
      const catQs = sv.questions.filter(q => q.category === key);
      const ratingQs = catQs.filter(q => q.type === "rating");
      if (catQs.length > 0) {
        let avgRating = "N/A";
        if (ratingQs.length > 0) {
          const allRatings = [];
          ratingQs.forEach(q => {
            const ans = responses.map(r => r.ans?.[q.id]).filter(Boolean);
            ans.forEach(a => allRatings.push(parseInt(a)));
          });
          if (allRatings.length > 0) {
            avgRating = (allRatings.reduce((a, b) => a + b, 0) / allRatings.length).toFixed(2);
          }
        }
        const catResponses = catQs.reduce((sum, q) => {
          const count = responses.filter(r => r.ans?.[q.id]).length;
          return sum + count;
        }, 0);
        const responseRate = responses.length > 0 ? ((catResponses / (catQs.length * responses.length)) * 100).toFixed(1) : "0";
        statsData.push([cat.label, catQs.length, catResponses, responseRate, avgRating]);
      }
    });
    
    const statsSheet = XLSX.utils.aoa_to_sheet(statsData);
    statsSheet["!cols"] = [{ wch: 30 }, { wch: 12 }, { wch: 18 }, { wch: 15 }, { wch: 25 }];
    XLSX.utils.book_append_sheet(wb, statsSheet, "Statistics");

    XLSX.writeFile(wb, `${sv.title.replace(/\s+/g, "_")}_${new Date().toISOString().slice(0, 10)}.xlsx`);
  } catch (e) {
    alert("Export error: " + e.message);
  }
}

  });
  const [toast, setToast] = useState(null);
  const t = m => setToast(m);

  const logout = () => {
    setAuth(null);
    sessionStorage.removeItem("sf_auth_ttn");
    try { if (window.google) google.accounts.id.disableAutoSelect(); } catch { }
    t("👋 Signed out successfully.");
  };

function Login({ onLogin, t }) {
  const btnRef = useRef(null);
  const ok = configured();

  const handleCred = useCallback(resp => {
    try {
      const p = parseJwt(resp.credential);
      if (!p?.email) { t("❌ Google sign-in failed."); return; }
      if (!inDomain(p.email)) { t(`❌ Only @${SF.DOMAIN} accounts allowed.`); return; }
      const u = { email: p.email, name: p.name || p.email, picture: p.picture || null, given_name: p.given_name || "", role: isAdmin(p.email) ? "admin" : "user" };
      onLogin(u);
      t(u.role === "admin" ? `✅ Welcome, ${u.given_name}! (Admin)` : `✅ Signed in!`);
    } catch (e) { t("❌ Error: " + e.message); }
  }, [onLogin, t]);

  useEffect(() => {
    if (!ok) return;
    const init = () => {
      if (!window.google || !btnRef.current) return;
      try {
        google.accounts.id.initialize({ client_id: SF.CLIENT_ID, callback: handleCred, hosted_domain: SF.DOMAIN, auto_select: false, ux_mode: "popup" });
        google.accounts.id.renderButton(btnRef.current, { theme: "outline", size: "large", width: 380, text: "signin_with", shape: "rectangular" });
      } catch (e) { console.error("GSI error:", e); }
    };
    if (window.google) init();
    else { const iv = setInterval(() => { if (window.google) { clearInterval(iv); init(); } }, 250); return () => clearInterval(iv); }
  }, [ok, handleCred]);

  return (
    <div className="login-wrapper">
      <div className="login-container">
        <div className="login-header">
          <div className="login-logo">📋</div>
          <div className="login-title">{SF.APP}</div>
          <div style={{ fontSize: 14, fontWeight: 600, color: "#00519F", marginTop: 6 }}>{SF.ORG}</div>
          <div style={{ fontSize: 12, color: "#6B7280", marginTop: 8 }}>Employee Engagement Survey</div>
        </div>

        {!ok && (
          <div style={{ background: "#fefce8", border: "1.5px solid #fde047", borderRadius: 10, padding: 16, fontSize: 13, color: "#713f12", marginBottom: 20 }}>
            <strong>⚙️ Setup: Add Google OAuth Client ID</strong>
          </div>
        )}

        {ok && (
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 13, color: "#6B7280", marginBottom: 12 }}>Sign in with your To The New account</div>
            <div style={{ display: "inline-flex", gap: 8, background: "linear-gradient(135deg, rgba(235, 54, 36, 0.1) 0%, rgba(0, 194, 233, 0.1) 100%)", border: "1.5px solid rgba(235, 54, 36, 0.3)", borderRadius: 99, padding: "8px 16px", fontSize: 13, color: "#EB3624", fontWeight: 600, marginBottom: 20 }}>
              🔒 @{SF.DOMAIN}
            </div>
            <div ref={btnRef} style={{ display: "flex", justifyContent: "center", marginBottom: 20, minHeight: 46 }} />
            <div style={{ background: "#f0fdf4", border: "1.5px solid #bbf7d0", borderRadius: 10, padding: "12px 14px", fontSize: 12, color: "#166534" }}>
              <strong>Admin:</strong> rishabh.mehrotra & avantika.sinha
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function generateRatingAnalysis(answers) {
  if (!answers.length) return { avg: "—", sentiment: "Pending", summary: "No responses yet" };
  const vs = answers.map(a => parseInt(a)).filter(Boolean);
  const avg = (vs.reduce((a, b) => a + b, 0) / vs.length).toFixed(1);
  const sentiment = avg >= 4.5 ? "Exceptional" : avg >= 4 ? "Very Good" : avg >= 3 ? "Moderate" : avg >= 2 ? "Needs Attention" : "Critical";
  return { avg, sentiment, summary: `Average: ${avg}/5 (${sentiment}) from ${vs.length} respondents` };
}

function generateTextAnalysis(answers) {
  if (!answers.length) return { summary: "No responses collected yet" };
  const uniqueAnswers = [...new Set(answers)];
  const keywordCount = uniqueAnswers.length;
  return { summary: `${keywordCount} unique qualitative insights collected. Responses show diverse perspectives on this topic.` };
}

function SurveyFill({ sv, auth, back, submit, already }) {
  const [ans, setAns] = useState({});
  const [step, setStep] = useState(0);
  const [done, setDone] = useState(already);
  const [submitting, setSubmitting] = useState(false);
  const qs = (sv.questions && Array.isArray(sv.questions) && sv.questions.length > 0) ? sv.questions : DEFAULT_QUESTIONS;
  const q = qs[step];
  const total = qs.length;
  const pct = Math.round((step / Math.max(total, 1)) * 100);
  const setA = (id, v) => setAns(a => ({ ...a, [id]: v }));
  const canNext = !q?.req || ans[q?.id];

  const finish = async () => {
    const miss = qs.filter(q => q.req && !ans[q.id]);
    if (miss.length) { alert(`Answer ${miss.length} required question(s).`); return; }
    setSubmitting(true);
    await submit(sv, ans);
    setDone(true);
    setSubmitting(false);
  };

  if (done) return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "70vh" }}>
      <div style={{ textAlign: "center", padding: 48 }}>
        <div style={{ fontSize: 80, marginBottom: 20 }}>🎉</div>
        <div style={{ fontSize: 28, fontWeight: 800, marginBottom: 12 }}>Thank You!</div>
        <div style={{ fontSize: 15, color: "#6B7280", marginBottom: 32 }}>Your feedback matters. We're committed to creating an even better workplace.</div>
        <button className="btn btn-primary" style={{ fontSize: 15, padding: "12px 32px" }} onClick={back}>← Back to Home</button>
      </div>
    </div>
  );

  if (total === 0) return <div className="survey-fill-width main"><button className="btn btn-ghost" onClick={back}>← Back</button><div className="card"><p>No questions</p></div></div>;

  const currentCategory = q?.categoryLabel;
  const categoryColor = Object.values(SURVEY_CATEGORIES).find(c => c.label === currentCategory)?.color || "#EB3624";

  return (
    <div className="survey-fill-width main">
      <button className="btn btn-ghost" style={{ marginBottom: 22 }} onClick={back}>← Back</button>
      <div className="card" style={{ marginBottom: 22, borderLeft: "4px solid #EB3624" }}>
        <div style={{ fontWeight: 700, fontSize: 18, marginBottom: 6 }}>
          {sv.title || "Employee Engagement Survey"}
        </div>
        <div style={{ fontSize: 13, color: "#6B7280", lineHeight: 1.6 }}>
          {sv.desc || "Share your feedback to help us build a better workplace"}
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 26 }}>
        <span style={{ fontSize: 13, color: "#6B7280", whiteSpace: "nowrap" }}>Q {step + 1} of {total}</span>
        <div className="progress-bar" style={{ flex: 1 }}><div className="progress-fill" style={{ width: pct + "%" }} /></div>
        <span style={{ fontSize: 13, fontWeight: 700, color: "#EB3624", whiteSpace: "nowrap" }}>{pct}%</span>
      </div>
      <div className="card" style={{ minHeight: 240 }}>
        <div style={{ marginBottom: 20, padding: "12px 16px", background: `linear-gradient(135deg, ${categoryColor}15 0%, ${categoryColor}05 100%)`, border: `1px solid ${categoryColor}30`, borderRadius: 8, fontSize: 12, fontWeight: 600, color: categoryColor }}>
          SECTION: {currentCategory}
        </div>
        <div style={{ display: "flex", gap: 14, marginBottom: 24 }}>
          <div className="question-number">{step + 1}</div>
          <div><div style={{ fontWeight: 700, fontSize: 17, lineHeight: 1.45, marginBottom: 4 }}>{q.text}</div>{q.req && <div style={{ fontSize: 12, color: "#EF4444", marginTop: 6, fontWeight: 600 }}>* Required</div>}</div>
        </div>

        {q.type === "rating" && (
          <div>
            <div style={{ display: "flex", gap: 12, marginTop: 6, flexWrap: "wrap" }}>
              {[1, 2, 3, 4, 5].map(n => (
                <div key={n} className={`rating-button${ans[q.id] === String(n) ? " selected" : ""}`} onClick={() => setA(q.id, String(n))}>{n}</div>
              ))}
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 14, fontSize: 12, color: "#6B7280" }}>
              <span>1 = Strongly Disagree</span>
              <span>5 = Strongly Agree</span>
            </div>
          </div>
        )}

        {q.type === "text" && (
          <textarea
            className="textarea"
            rows={6}
            value={ans[q.id] || ""}
            onChange={e => setA(q.id, e.target.value)}
            placeholder="Share your thoughts..."
            style={{ resize: "vertical" }}
          />
        )}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 22 }}>
        <button className="btn btn-ghost" disabled={step === 0} style={{ opacity: step === 0 ? 0.4 : 1 }} onClick={() => setStep(s => s - 1)}>← Previous</button>
        <span style={{ fontSize: 12, color: "#6B7280" }}>{total - step - 1} remaining</span>
        {step < total - 1 ? <button className="btn btn-primary" disabled={!canNext} style={{ opacity: canNext ? 1 : 0.4 }} onClick={() => setStep(s => s + 1)}>Next →</button> : <button className="btn btn-success" disabled={submitting} style={{ padding: "10px 26px" }} onClick={finish}>{submitting ? "Submitting..." : "Submit ✓"}</button>}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
