<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SurveyFlow – To The New</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
html,body,#root{min-height:100vh}
body{background:#f4f6fb}
:root{
  --p:#1a56db;--pd:#1e3a8a;--ac:#e11d48;
  --su:#059669;--wa:#d97706;--da:#dc2626;
  --bd:#e5e7eb;--mu:#6b7280;--tx:#111827;
  --bg:#f4f6fb;--card:#ffffff;
}
/* ── NAV ── */
.nav{background:var(--pd);color:#fff;padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(30,58,138,0.35)}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-logo-text{font-size:19px;font-weight:800;letter-spacing:-0.5px}
.nav-logo-badge{background:var(--ac);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.3px}
.nav-r{display:flex;align-items:center;gap:12px}
.nav-user{font-size:13px;color:rgba(255,255,255,.8);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ── LAYOUT ── */
.lay{display:flex;min-height:calc(100vh - 58px)}
.side{width:224px;background:#fff;border-right:1px solid var(--bd);padding:16px 0;flex-shrink:0;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto}
.si{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;color:var(--mu);cursor:pointer;border-left:3px solid transparent;transition:all .14s;user-select:none}
.si:hover{background:#eff6ff;color:var(--p)}
.si.on{background:#eff6ff;color:var(--p);border-left-color:var(--p);font-weight:600}
.side-sec{margin:16px 20px 6px;font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:1px}
.main{flex:1;padding:28px;overflow-y:auto;max-width:1100px}
/* ── CARDS ── */
.card{background:#fff;border-radius:12px;border:1px solid var(--bd);padding:22px;margin-bottom:18px}
.card-sm{background:#fff;border-radius:10px;border:1px solid var(--bd);padding:16px}
/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .14s;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bp{background:var(--p);color:#fff}.bp:hover:not(:disabled){background:#1d4ed8}
.bs{background:var(--su);color:#fff}.bs:hover:not(:disabled){background:#047857}
.bw{background:var(--wa);color:#fff}.bw:hover:not(:disabled){background:#b45309}
.bd2{background:var(--da);color:#fff}
.bo{background:#fff;color:var(--p);border:1.5px solid var(--p)}.bo:hover:not(:disabled){background:#eff6ff}
.bg2{background:#fff;color:var(--mu);border:1px solid var(--bd)}.bg2:hover:not(:disabled){background:#f9fafb}
.btn-ico{padding:6px 10px;font-size:14px}
/* ── BADGES ── */
.bdg{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.2px}
.bdg-active{background:#d1fae5;color:#065f46}
.bdg-draft{background:#fef3c7;color:#92400e}
.bdg-ended{background:#fee2e2;color:#991b1b}
/* ── FORM ── */
.fi{width:100%;padding:10px 13px;border:1.5px solid var(--bd);border-radius:8px;font-size:14px;color:var(--tx);outline:none;background:#fff;transition:border .14s}
.fi:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(26,86,219,.1)}
.fl{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--tx)}
.fg{margin-bottom:18px}
/* ── TABS ── */
.tab-r{display:flex;border-bottom:2px solid var(--bd);margin-bottom:22px}
.tab{padding:10px 22px;font-size:14px;font-weight:500;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .14s}
.tab.on{color:var(--p);border-bottom-color:var(--p);font-weight:600}
/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f9fafb;padding:10px 16px;text-align:left;font-weight:600;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--bd)}
td{padding:13px 16px;border-bottom:1px solid var(--bd);color:var(--tx);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
/* ── SURVEY GRID ── */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.sc{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:20px;position:relative;overflow:hidden;transition:all .2s;cursor:default}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--p)}
.sc.active::before{background:var(--su)}.sc.ended::before{background:var(--da)}
.sc:hover{box-shadow:0 6px 24px rgba(26,86,219,.1);transform:translateY(-2px)}
/* ── STATS ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat-card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:18px}
.stat-n{font-size:30px;font-weight:800;color:var(--p);line-height:1}
.stat-l{font-size:12px;color:var(--mu);margin-top:4px}
/* ── MODAL ── */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px}
.mod{background:#fff;border-radius:16px;padding:30px;width:560px;max-width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.22)}
.mod-title{font-size:18px;font-weight:700;margin-bottom:22px;color:var(--tx)}
/* ── LOGIN ── */
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a 0%,#1a56db 55%,#0891b2 100%);padding:16px}
.lc{background:#fff;border-radius:20px;padding:44px 40px;width:460px;max-width:100%;box-shadow:0 28px 72px rgba(0,0,0,.28)}
.ll{text-align:center;margin-bottom:30px}
.ll-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.ll-logo-icon{font-size:36px}
.ll-logo-name{font-size:26px;font-weight:800;color:var(--pd);letter-spacing:-1px}
.ll-logo-name span{color:var(--ac)}
.ll-sub{font-size:13px;color:var(--mu)}
.google-btn-wrap{display:flex;justify-content:center;margin:20px 0 14px}
.domain-pill{display:inline-flex;align-items:center;gap:6px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:99px;padding:5px 14px;font-size:12px;color:var(--p);font-weight:600;margin-bottom:16px}
.setup-box{background:#fefce8;border:1.5px solid #fde047;border-radius:10px;padding:16px;font-size:13px;color:#713f12;margin-bottom:20px;line-height:1.7}
.setup-box strong{display:block;font-size:14px;margin-bottom:6px}
.setup-box code{background:#fef9c3;padding:2px 7px;border-radius:4px;font-family:monospace;font-size:12px;word-break:break-all}
/* ── AVATAR ── */
.av{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.35);object-fit:cover;flex-shrink:0}
.av-ph{width:34px;height:34px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
/* ── QUESTION CARD ── */
.qcard{background:#f9fafb;border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:10px}
/* ── ANALYTICS BAR ── */
.rb{flex:1;background:#e5e7eb;border-radius:99px;height:14px;overflow:hidden}
.rf{height:100%;background:var(--p);border-radius:99px;transition:width .4s}
/* ── TOGGLE ── */
.tog{width:44px;height:24px;border-radius:99px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;border:none}
.tog::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tog.on{background:var(--su)}.tog.on::after{left:23px}
.tog.off{background:#d1d5db}
/* ── FILL ── */
.sfw{max-width:660px;margin:0 auto}
.pb{background:#e5e7eb;border-radius:99px;height:6px;overflow:hidden;margin-bottom:26px}
.pf{height:100%;background:var(--p);border-radius:99px;transition:width .3s}
.qnum{width:32px;height:32px;background:var(--p);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.opt{padding:14px 18px;border:2px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:12px;transition:all .12s}
.opt:hover{border-color:var(--p);background:#eff6ff}.opt.sel{border-color:var(--p);background:#eff6ff}
.rat{width:54px;height:54px;border:2px solid var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:18px;transition:all .12s}
.rat:hover{border-color:var(--p)}.rat.sel{border-color:var(--p);background:var(--p);color:#fff}
/* ── TOAST ── */
.toast{position:fixed;bottom:26px;right:26px;background:#111827;color:#fff;padding:13px 22px;border-radius:10px;font-size:14px;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.3);animation:su .3s ease;max-width:340px}
@keyframes su{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.empty{text-align:center;padding:52px 20px;color:var(--mu)}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;font-size:12px;color:#9ca3af}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--bd)}
@media(max-width:680px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .side{display:none}.main{padding:16px}.sg{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>

<!-- ╔══════════════════════════════════════════════════════════════╗
     ║              CONFIGURATION — EDIT BEFORE DEPLOYING          ║
     ╠══════════════════════════════════════════════════════════════╣
     ║  Step 1: Paste your Google OAuth Client ID below            ║
     ║  Step 2: Confirm admin emails are correct                   ║
     ║  Full setup guide: see README.md                            ║
     ╚══════════════════════════════════════════════════════════════╝ -->
<script>
window.SF_CONFIG = {

  // ── STEP 1: Paste your Google OAuth Client ID here ─────────────
  // Get it from: https://console.cloud.google.com
  // APIs & Services → Credentials → Create → OAuth 2.0 Client ID
  CLIENT_ID: "166609757158-n125ruoni0f9mid9otef99sltun3loh1.apps.googleusercontent.com",

  // ── Your Google Workspace domain (only this domain can log in) ─
  DOMAIN: "tothenew.com",

  // ── Admin email addresses (get full admin panel) ───────────────
  ADMINS: [
    "rishabh.mehrotra@tothenew.com",
    "avantika.sinha@tothenew.com"
  ],

  // ── App branding ───────────────────────────────────────────────
  ORG_NAME: "To The New",
  APP_NAME: "SurveyFlow",

  // ── GitHub Pages URL (update after deploying) ─────────────────
  // Format: https://rishabh-survey.github.io/surveyflow
  SITE_URL: "https://rishabh-survey.github.io/surveyflow"

</script>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

/* ── helpers ── */
const C=window.SF_CONFIG;
const fd=d=>d?new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"—";
const fdt=d=>d?new Date(d).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
const nid=()=>Date.now()+Math.floor(Math.random()*99999);
const isConfigured=()=>C.CLIENT_ID&&!C.CLIENT_ID.startsWith("PASTE_");
const isAdmin=e=>(C.ADMINS||[]).map(a=>a.toLowerCase()).includes((e||"").toLowerCase());
const inDomain=e=>(e||"").toLowerCase().endsWith("@"+C.DOMAIN.toLowerCase());

function parseJwt(t){
  try{return JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));}catch{return null;}
}

/* ── seed surveys ── */
const SEED=[
  {id:1,title:"Q2 Employee Engagement Survey",desc:"Quarterly pulse check on team morale, engagement and satisfaction.",
   status:"active",start:"2026-04-01",end:"2026-04-30",created:"2026-03-28",
   questions:[
    {id:1,text:"How satisfied are you with your current role at To The New?",type:"rating",options:[],req:true},
    {id:2,text:"How would you rate communication within your team?",type:"mc",options:["Excellent","Good","Average","Needs Improvement"],req:true},
    {id:3,text:"What is your biggest workplace challenge right now?",type:"text",options:[],req:false},
    {id:4,text:"Do you feel your contributions are recognized by leadership?",type:"yn",options:[],req:true},
    {id:5,text:"Would you recommend To The New as a great place to work?",type:"yn",options:[],req:true}
   ],responses:[]},
  {id:2,title:"Remote & Hybrid Work Preferences",desc:"Help us shape the future of flexible working at To The New.",
   status:"draft",start:"2026-05-01",end:"2026-05-20",created:"2026-04-10",
   questions:[
    {id:1,text:"How many days per week do you prefer working from office?",type:"mc",options:["0 days (Full remote)","1–2 days","3–4 days","5 days (Full office)"],req:true},
    {id:2,text:"Does your current setup support productive remote work?",type:"yn",options:[],req:true},
    {id:3,text:"What would improve your remote/hybrid experience?",type:"text",options:[],req:false}
   ],responses:[]},
  {id:3,title:"Learning & Development Needs 2026",desc:"Identify skill gaps and preferred learning formats for the year ahead.",
   status:"draft",start:"2026-06-01",end:"2026-06-30",created:"2026-04-15",
   questions:[
    {id:1,text:"Which area would benefit most from upskilling?",type:"mc",options:["Cloud & DevOps","AI / ML","Leadership","Agile & Project Management","Communication"],req:true},
    {id:2,text:"Preferred learning format?",type:"mc",options:["Online self-paced","Live virtual sessions","In-person workshops","Peer mentoring"],req:true},
    {id:3,text:"Rate your current skill confidence in your primary role",type:"rating",options:[],req:true},
    {id:4,text:"Any specific courses or certifications you'd like sponsored?",type:"text",options:[],req:false}
   ],responses:[]}
];

/* ── Toast ── */
function Toast({msg,done}){
  useEffect(()=>{const t=setTimeout(done,4000);return()=>clearTimeout(t);},[]);
  return <div className="toast">{msg}</div>;
}

/* ── Avatar ── */
function Av({auth,size=34}){
  const st={width:size,height:size,borderRadius:"50%"};
  if(auth?.picture) return <img src={auth.picture} style={{...st,border:"2px solid rgba(255,255,255,.35)",objectFit:"cover",flexShrink:0}} alt={auth.name} referrerPolicy="no-referrer"/>;
  const ini=(auth?.name||"U").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  return <div style={{...st,background:"#e11d48",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:size>30?13:11,color:"#fff",flexShrink:0}}>{ini}</div>;
}

/* ── Excel export ── */
function exportXL(sv){
  try{
    const wb=XLSX.utils.book_new();
    const h=["#","Email","Full Name","Submitted At",...sv.questions.map((q,i)=>`Q${i+1}: ${q.text}`)];
    const rows=sv.responses.map((r,i)=>[i+1,r.email,r.name||"",fdt(r.at),...sv.questions.map(q=>r.ans[q.id]||"")]);
    const ws=XLSX.utils.aoa_to_sheet([h,...rows]);
    ws["!cols"]=[{wch:4},{wch:32},{wch:24},{wch:22},...sv.questions.map(q=>({wch:Math.max(q.text.length,20)}))];
    XLSX.utils.book_append_sheet(wb,ws,"Responses");
    const s=[["SURVEY SUMMARY"],[""],["Title",sv.title],["Description",sv.desc||""],
      ["Status",sv.status.toUpperCase()],["Start Date",sv.start],["End Date",sv.end],
      ["Total Responses",sv.responses.length],["Exported At",new Date().toLocaleString()],[""]];
    sv.questions.forEach((q,i)=>{
      s.push([`Q${i+1}`,q.text,`[${q.type==="mc"?"Multiple Choice":q.type==="text"?"Open Text":q.type==="rating"?"Rating 1-5":"Yes/No"}]`]);
      if(q.type==="mc"||q.type==="yn"){
        const opts=q.type==="yn"?["Yes","No"]:q.options;
        opts.forEach(o=>{
          const c=sv.responses.filter(r=>r.ans[q.id]===o).length;
          const p=sv.responses.length?Math.round(c/sv.responses.length*100):0;
          s.push(["  →",o,`${c} responses`,`${p}%`]);
        });
      } else if(q.type==="rating"){
        const vs=sv.responses.map(r=>parseInt(r.ans[q.id])).filter(Boolean);
        const avg=vs.length?(vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(1):"N/A";
        s.push(["  →",`Average rating: ${avg} / 5`,`${vs.length} responses`]);
        [1,2,3,4,5].forEach(n=>{
          const c=vs.filter(v=>v===n).length;
          s.push(["    ","★".repeat(n),`${c} responses`,vs.length?Math.round(c/vs.length*100)+"%":"0%"]);
        });
      } else {
        sv.responses.forEach((r,j)=>{if(r.ans[q.id])s.push(["  →",r.name||r.email,r.ans[q.id]]);});
      }
      s.push([""]);
    });
    const ws2=XLSX.utils.aoa_to_sheet(s);
    ws2["!cols"]=[{wch:6},{wch:36},{wch:32},{wch:12}];
    XLSX.utils.book_append_sheet(wb,ws2,"Analysis");
    XLSX.writeFile(wb,`${sv.title.replace(/\s+/g,"_")}_${new Date().toISOString().slice(0,10)}.xlsx`);
  }catch(e){alert("Export error: "+e.message);}
}

/* ══════════════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════════════ */
function App(){
  const [auth,setAuth]=useState(()=>{
    try{const s=sessionStorage.getItem("sf_auth");return s?JSON.parse(s):null;}catch{return null;}
  });
  const [surveys,setSurveys]=useState(()=>{
    try{const s=localStorage.getItem("sf_surveys_ttn");return s?JSON.parse(s):SEED;}catch{return SEED;}
  });
  const [toast,setToast]=useState(null);

  useEffect(()=>{try{localStorage.setItem("sf_surveys_ttn",JSON.stringify(surveys));}catch{};},[surveys]);

  const toast2=m=>setToast(m);
  const upd=(id,p)=>setSurveys(s=>s.map(x=>x.id===id?{...x,...p}:x));
  const logout=()=>{
    setAuth(null);
    sessionStorage.removeItem("sf_auth");
    try{if(window.google)google.accounts.id.disableAutoSelect();}catch{}
    toast2("👋 Signed out successfully.");
  };
  const onLogin=u=>{
    setAuth(u);
    try{sessionStorage.setItem("sf_auth",JSON.stringify(u));}catch{}
  };

  return(<>
    {!auth&&<Login onLogin={onLogin} toast2={toast2}/>}
    {auth?.role==="admin"&&<AdminApp auth={auth} surveys={surveys} setSurveys={setSurveys} upd={upd} out={logout} toast2={toast2}/>}
    {auth?.role==="user"&&<UserApp auth={auth} surveys={surveys} setSurveys={setSurveys} out={logout} toast2={toast2}/>}
    {toast&&<Toast msg={toast} done={()=>setToast(null)}/>}
  </>);
}

/* ══════════════════════════════════════════════════
   LOGIN PAGE
══════════════════════════════════════════════════ */
function Login({onLogin,toast2}){
  const btnRef=useRef(null);
  const ok=isConfigured();

  const handleCred=useCallback(resp=>{
    try{
      const p=parseJwt(resp.credential);
      if(!p?.email){toast2("❌ Google sign-in failed. Please try again.");return;}

      /* Domain check — only @tothenew.com allowed */
      if(!inDomain(p.email)){
        toast2(`❌ Access restricted to @${C.DOMAIN} accounts only.`);
        try{google.accounts.id.disableAutoSelect();}catch{}
        return;
      }

      const u={
        email:p.email,name:p.name||p.email,
        picture:p.picture||null,given_name:p.given_name||"",
        role:isAdmin(p.email)?"admin":"user"
      };
      onLogin(u);
      toast2(u.role==="admin"
        ?`✅ Welcome back, ${u.given_name||u.name}! (Admin)`
        :`✅ Signed in as ${u.name}`);
    }catch(e){toast2("❌ Sign-in error: "+e.message);}
  },[onLogin,toast2]);

  useEffect(()=>{
    if(!ok)return;
    const init=()=>{
      if(!window.google||!btnRef.current)return;
      try{
        google.accounts.id.initialize({
          client_id:C.CLIENT_ID,
          callback:handleCred,
          hosted_domain:C.DOMAIN,   /* restricts to @tothenew.com */
          auto_select:false,
          cancel_on_tap_outside:true,
          ux_mode:"popup"
        });
        google.accounts.id.renderButton(btnRef.current,{
          theme:"outline",size:"large",
          width:370,text:"signin_with",
          shape:"rectangular",logo_alignment:"left"
        });
      }catch(e){console.error("GSI init error:",e);}
    };
    if(window.google)init();
    else{const iv=setInterval(()=>{if(window.google){clearInterval(iv);init();}},250);return()=>clearInterval(iv);}
  },[ok,handleCred]);

  return(
    <div className="lw">
      <div className="lc">
        <div className="ll">
          <div className="ll-logo">
            <span className="ll-logo-icon">📋</span>
            <span className="ll-logo-name">{C.APP_NAME}</span>
          </div>
          <div style={{fontSize:14,fontWeight:600,color:"#374151",marginBottom:4}}>{C.ORG_NAME}</div>
          <div className="ll-sub">Internal Survey Platform</div>
        </div>

        {!ok&&(
          <div className="setup-box">
            <strong>⚙️ One-time setup needed</strong>
            Open <code>index.html</code> and replace <code>PASTE_YOUR_CLIENT_ID_HERE</code> with your Google OAuth Client ID.<br/>
            See <strong>README.md</strong> for the exact steps — takes about 5 minutes.
          </div>
        )}

        {ok&&(
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:13,color:"var(--mu)",marginBottom:12}}>Sign in with your To The New Google account</div>
            <div className="domain-pill">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
              Restricted to @{C.DOMAIN}
            </div>
            <div ref={btnRef} style={{display:"flex",justifyContent:"center",marginBottom:16,minHeight:46}}/>
            <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#166534",lineHeight:1.6}}>
              <strong>Admin access:</strong> {C.ADMINS.map(e=>e.split("@")[0]).join(", ")} have full admin rights.<br/>All other @{C.DOMAIN} accounts are respondents.
            </div>
          </div>
        )}

        {!ok&&(
          <div style={{background:"#f9fafb",borderRadius:10,padding:"16px",marginTop:8,fontSize:12,color:"var(--mu)",lineHeight:1.8}}>
            <strong style={{color:"var(--tx)"}}>Quick setup checklist:</strong><br/>
            1. Go to <code style={{background:"#e5e7eb",padding:"1px 5px",borderRadius:3}}>console.cloud.google.com</code><br/>
            2. Create project → APIs &amp; Services → Credentials<br/>
            3. Create OAuth 2.0 Client ID (Web application)<br/>
            4. Add <code style={{background:"#e5e7eb",padding:"1px 5px",borderRadius:3}}>{C.SITE_URL.split("/").slice(0,3).join("/")}</code> as Authorized JS origin<br/>
            5. Paste the Client ID into this file
          </div>
        )}
      </div>
    </div>
  );
}

   ADMIN APP

function AdminApp({auth,surveys,setSurveys,upd,out,toast2}){
  const [pg,setPg]=useState("dash");
  const [sel,setSel]=useState(null);
  const [atab,setAtab]=useState("questions");
  const [nm,setNm]=useState(false);
  const go=p=>{setPg(p);setSel(null);};

  return(<div style={{minHeight:"100vh",background:"var(--bg)"}}>
    <div className="nav">
      <div className="nav-logo">
        <span style={{fontSize:22}}>📋</span>
        <div>
          <div className="nav-logo-text">{C.APP_NAME} <span className="nav-logo-badge">Admin</span></div>
          <div style={{fontSize:11,color:"rgba(255,255,255,.6)",marginTop:-1}}>{C.ORG_NAME}</div>
        </div>
      </div>
      <div className="nav-r">
        <Av auth={auth}/>
        <div style={{lineHeight:1.3}}>
          <div className="nav-user" style={{fontWeight:600,color:"#fff",fontSize:13}}>{auth.name}</div>
          <div className="nav-user" style={{fontSize:11}}>{auth.email}</div>
        </div>
        <button className="btn bg2" style={{color:"#fff",borderColor:"rgba(255,255,255,.25)",fontSize:12}} onClick={out}>Sign out</button>
      </div>
    </div>

    {nm&&<NewSurveyModal onClose={()=>setNm(false)} onSave={sv=>{setSurveys(s=>[...s,sv]);setNm(false);toast2("✅ Survey created successfully!");}}/>}

    <div className="lay">
      <div className="side">
        {[{id:"dash",ic:"📊",lb:"Dashboard"},{id:"surveys",ic:"📋",lb:"Surveys"},{id:"responses",ic:"📬",lb:"All Responses"}].map(n=>(
          <div key={n.id} className={`si${pg===n.id&&!sel?" on":""}`} onClick={()=>go(n.id)}>
            <span style={{fontSize:16}}>{n.ic}</span>{n.lb}
          </div>
        ))}
        <div className="side-sec">Actions</div>
        <div className="si" onClick={()=>setNm(true)}><span style={{fontSize:16}}>➕</span>New Survey</div>
        <div className="side-sec">Account</div>
        <div className="si" onClick={out}><span style={{fontSize:16}}>🚪</span>Sign Out</div>
      </div>
      <div className="main">
        {sel
          ?<SurveyDetail sv={sel} surveys={surveys} back={()=>setSel(null)} upd={upd} toast2={toast2} atab={atab} setAtab={setAtab}/>
          :pg==="dash"?<Dashboard surveys={surveys} auth={auth} onSel={sv=>{setSel(sv);setAtab("questions");}}/>
          :pg==="surveys"?<SurveyList surveys={surveys} onSel={sv=>{setSel(sv);setAtab("questions");}} upd={upd} toast2={toast2} onNew={()=>setNm(true)}/>
          :<AllResponses surveys={surveys}/>
        }
      </div>
    </div>
  </div>);
}

function Dashboard({surveys,auth,onSel}){
  const total=surveys.reduce((a,s)=>a+s.responses.length,0);
  const active=surveys.filter(s=>s.status==="active");
  return(<div>
    <div style={{fontSize:22,fontWeight:700,color:"var(--tx)",marginBottom:2}}>Good {new Date().getHours()<12?"morning":"afternoon"}, {auth.given_name||auth.name.split(" ")[0]} 👋</div>
    <div style={{fontSize:14,color:"var(--mu)",marginBottom:22}}>Here's your survey activity overview.</div>
    <div className="stat-grid">
      {[{n:surveys.length,l:"Total Surveys",c:"#1a56db",ic:"📋"},{n:active.length,l:"Active Now",c:"#059669",ic:"🟢"},{n:total,l:"Total Responses",c:"#e11d48",ic:"💬"},{n:surveys.filter(s=>s.status==="draft").length,l:"Drafts",c:"#d97706",ic:"📝"}].map((s,i)=>(
        <div key={i} className="stat-card">
          <div style={{fontSize:22,marginBottom:4}}>{s.ic}</div>
          <div className="stat-n" style={{color:s.c}}>{s.n}</div>
          <div className="stat-l">{s.l}</div>
        </div>
      ))}
    </div>
    <div className="card">
      <div style={{fontWeight:700,fontSize:15,marginBottom:16,color:"var(--tx)"}}>Recent Surveys</div>
      {surveys.length===0&&<div style={{color:"var(--mu)",textAlign:"center",padding:24,fontSize:13}}>No surveys yet.</div>}
      {surveys.map(sv=>(
        <div key={sv.id} onClick={()=>onSel(sv)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"13px 0",borderBottom:"1px solid var(--bd)",cursor:"pointer",transition:"background .12s"}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:14,color:"var(--tx)"}}>{sv.title}</div>
            <div style={{fontSize:12,color:"var(--mu)",marginTop:3}}>{sv.questions.length} questions · {sv.responses.length} responses · {fd(sv.start)} – {fd(sv.end)}</div>
          </div>
          <span className={`bdg bdg-${sv.status}`}>{sv.status}</span>
        </div>
      ))}
    </div>
    {active.length>0&&(
      <div className="card" style={{background:"#eff6ff",border:"1px solid #bfdbfe"}}>
        <div style={{fontWeight:700,fontSize:14,color:"var(--p)",marginBottom:10}}>🟢 Currently Active Surveys</div>
        {active.map(sv=>(
          <div key={sv.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #bfdbfe"}}>
            <div style={{fontSize:13,fontWeight:500,color:"var(--tx)"}}>{sv.title}</div>
            <div style={{fontSize:12,color:sv.responses.length>0?"var(--su)":"var(--mu)"}}>{sv.responses.length} responses</div>
          </div>
        ))}
      </div>
    )}
  </div>);
}

function SurveyList({surveys,onSel,upd,toast2,onNew}){
  const tog=sv=>{
    if(sv.status==="draft"){upd(sv.id,{status:"active"});toast2("✅ Survey is now active!");}
    else if(sv.status==="active"){upd(sv.id,{status:"ended"});toast2("⏹ Survey has ended.");}
    else toast2("This survey has already ended.");
  };
  return(<div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:22}}>
      <div><div style={{fontSize:22,fontWeight:700,color:"var(--tx)"}}>Surveys</div><div style={{fontSize:13,color:"var(--mu)"}}>Manage all organizational surveys</div></div>
      <button className="btn bp" onClick={onNew}>➕ New Survey</button>
    </div>
    {surveys.length===0&&<div className="empty"><div style={{fontSize:52}}>📋</div><p style={{marginTop:14,fontSize:16,fontWeight:600}}>No surveys yet</p><button className="btn bp" style={{marginTop:18}} onClick={onNew}>Create your first survey</button></div>}
    <div className="sg">{surveys.map(sv=>(
      <div key={sv.id} className={`sc ${sv.status}`}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
          <div style={{fontWeight:700,fontSize:15,flex:1,paddingRight:10,lineHeight:1.35,color:"var(--tx)"}}>{sv.title}</div>
          <span className={`bdg bdg-${sv.status}`}>{sv.status}</span>
        </div>
        <div style={{fontSize:13,color:"var(--mu)",marginBottom:10,lineHeight:1.5}}>{sv.desc}</div>
        <div style={{fontSize:12,color:"var(--mu)",marginBottom:14,display:"flex",alignItems:"center",gap:6}}>📅 {fd(sv.start)} → {fd(sv.end)}</div>
        <div style={{display:"flex",gap:24,padding:"12px 0",borderTop:"1px solid var(--bd)",borderBottom:"1px solid var(--bd)",marginBottom:14}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:24,fontWeight:800,color:"var(--p)"}}>{sv.questions.length}</div>
            <div style={{fontSize:11,color:"var(--mu)"}}>Questions</div>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:24,fontWeight:800,color:sv.responses.length>0?"var(--su)":"var(--p)"}}>{sv.responses.length}</div>
            <div style={{fontSize:11,color:"var(--mu)"}}>Responses</div>
          </div>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="btn bo" style={{fontSize:12,padding:"6px 14px"}} onClick={()=>onSel(sv)}>View Detail</button>
          {sv.status!=="ended"&&(
            <button className={`btn ${sv.status==="draft"?"bs":"bw"}`} style={{fontSize:12,padding:"6px 14px"}} onClick={()=>tog(sv)}>
              {sv.status==="draft"?"▶ Activate":"⏹ End Survey"}
            </button>
          )}
          <button className="btn bg2 btn-ico" title="Export Excel" onClick={()=>exportXL(sv)}>📥</button>
        </div>
      </div>
    ))}</div>
  </div>);
}

function SurveyDetail({sv,surveys,back,upd,toast2,atab,setAtab}){
  const live=surveys.find(s=>s.id===sv.id)||sv;
  const [qs,setQs]=useState(live.questions);
  const [qm,setQm]=useState(false);const [eq,setEq]=useState(null);
  useEffect(()=>setQs(live.questions),[live.questions]);
  const save=()=>{upd(sv.id,{questions:qs});toast2("💾 Questions saved!");};
  const tog=()=>{
    if(live.status==="draft"){upd(sv.id,{status:"active"});toast2("✅ Survey activated!");}
    else if(live.status==="active"){upd(sv.id,{status:"ended"});toast2("⏹ Survey ended.");}
  };
  return(<div>
    {(qm||eq)&&<QModal init={eq} onClose={()=>{setQm(false);setEq(null);}}
      onSave={q=>{
        if(eq)setQs(p=>p.map(x=>x.id===eq.id?{...eq,...q}:x));
        else setQs(p=>[...p,{...q,id:nid()}]);
        setQm(false);setEq(null);toast2("✅ "+(eq?"Question updated!":"Question added!"));
      }}/>}

    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,flexWrap:"wrap"}}>
      <button className="btn bg2" style={{fontSize:12,padding:"5px 13px"}} onClick={back}>← Back</button>
      <span style={{fontWeight:700,fontSize:18,color:"var(--tx)"}}>{live.title}</span>
      <span className={`bdg bdg-${live.status}`}>{live.status}</span>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap",alignItems:"center"}}>
      <span style={{fontSize:12,background:"#eff6ff",color:"var(--p)",borderRadius:99,padding:"4px 13px",fontWeight:500}}>📅 {fd(live.start)} – {fd(live.end)}</span>
      <span style={{fontSize:12,background:live.responses.length>0?"#f0fdf4":"#eff6ff",color:live.responses.length>0?"var(--su)":"var(--p)",borderRadius:99,padding:"4px 13px",fontWeight:600}}>💬 {live.responses.length} responses</span>
      {live.status!=="ended"&&(
        <button className={`btn ${live.status==="draft"?"bs":"bw"}`} style={{fontSize:12,padding:"6px 14px"}} onClick={tog}>
          {live.status==="draft"?"▶ Activate Survey":"⏹ End Survey"}
        </button>
      )}
      <button className="btn bo" style={{fontSize:12,padding:"6px 14px"}} onClick={()=>exportXL({...live,questions:qs})}>📥 Download Excel</button>
    </div>

    <div className="tab-r">
      {["questions","responses","analytics"].map(tb=>(
        <div key={tb} className={`tab${atab===tb?" on":""}`} onClick={()=>setAtab(tb)}>
          {tb==="questions"?"❓ Questions":tb==="responses"?"📬 Responses":"📊 Analytics"}
        </div>
      ))}
    </div>

    {atab==="questions"&&<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span style={{fontSize:13,color:"var(--mu)"}}>{qs.length} question{qs.length!==1?"s":""}</span>
        <div style={{display:"flex",gap:8}}>
          <button className="btn bp" style={{fontSize:12,padding:"7px 16px"}} onClick={()=>setQm(true)}>+ Add Question</button>
          <button className="btn bs" style={{fontSize:12,padding:"7px 16px"}} onClick={save}>💾 Save Changes</button>
        </div>
      </div>
      {qs.length===0&&<div className="empty"><div style={{fontSize:44}}>🤔</div><p style={{marginTop:12,fontSize:15}}>No questions yet. Add some!</p></div>}
      {qs.map((q,i)=>(
        <div key={q.id} className="qcard">
          <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
            <div className="qnum">{i+1}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:14,lineHeight:1.4,color:"var(--tx)"}}>{q.text}
                {q.req&&<span style={{color:"var(--da)",fontSize:12,marginLeft:8,fontWeight:700}}>*Required</span>}
              </div>
              <div style={{fontSize:12,color:"var(--mu)",marginTop:5,display:"flex",alignItems:"center",gap:6}}>
                <span style={{background:"#f3f4f6",padding:"2px 8px",borderRadius:4,fontWeight:600}}>
                  {q.type==="mc"?"🔘 Multiple Choice":q.type==="text"?"✍️ Open Text":q.type==="rating"?"⭐ Rating 1–5":"👍 Yes / No"}
                </span>
                {q.type==="mc"&&<span>{q.options.join(" · ")}</span>}
              </div>
            </div>
            <button className="btn bg2" style={{fontSize:12,padding:"5px 11px"}} onClick={()=>setEq(q)}>✏️ Edit</button>
            <button className="btn bg2" style={{fontSize:12,padding:"5px 11px",color:"var(--da)"}} onClick={()=>setQs(p=>p.filter(x=>x.id!==q.id))}>🗑️</button>
          </div>
        </div>
      ))}
    </div>}
    {atab==="responses"&&<RTable sv={{...live,questions:qs}}/>}
    {atab==="analytics"&&<Analytics sv={{...live,questions:qs}}/>}
  </div>);
}

function RTable({sv}){
  if(!sv.responses.length) return <div className="empty"><div style={{fontSize:48}}>📭</div><p style={{marginTop:14,fontSize:16,fontWeight:600}}>No responses yet</p><p style={{fontSize:13,marginTop:6}}>Responses will appear here once the survey is active and filled.</p></div>;
  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <span style={{fontSize:13,color:"var(--mu)",fontWeight:500}}>{sv.responses.length} response{sv.responses.length!==1?"s":""} received</span>
      <button className="btn bo" style={{fontSize:12,padding:"7px 16px"}} onClick={()=>exportXL(sv)}>📥 Export to Excel</button>
    </div>
    <div className="tbl-wrap"><table>
      <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Submitted</th>{sv.questions.map((q,i)=><th key={q.id}>Q{i+1}</th>)}</tr></thead>
      <tbody>{sv.responses.map((r,i)=>(
        <tr key={r.id}>
          <td style={{color:"var(--mu)"}}>{i+1}</td>
          <td>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <Av auth={{name:r.name,picture:r.picture}} size={28}/>
              <span style={{fontWeight:600,fontSize:13}}>{r.name||"—"}</span>
            </div>
          </td>
          <td style={{color:"var(--mu)",fontSize:12}}>{r.email}</td>
          <td style={{color:"var(--mu)",fontSize:12,whiteSpace:"nowrap"}}>{fdt(r.at)}</td>
          {sv.questions.map(q=><td key={q.id} style={{maxWidth:150,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:13}}>{r.ans[q.id]||"—"}</td>)}
        </tr>
      ))}</tbody>
    </table></div>
  </div>);
}

function Analytics({sv}){
  if(!sv.responses.length) return <div className="empty"><div style={{fontSize:48}}>📊</div><p style={{marginTop:14,fontSize:16,fontWeight:600}}>No data to analyze yet</p><p style={{fontSize:13,marginTop:6}}>Analytics will populate once responses come in.</p></div>;
  return(<div>
    <div style={{marginBottom:18,fontSize:13,color:"var(--mu)"}}>Based on <strong>{sv.responses.length}</strong> response{sv.responses.length!==1?"s":""}.</div>
    {sv.questions.map((q,i)=>{
      const ans=sv.responses.map(r=>r.ans[q.id]).filter(Boolean);
      return(<div key={q.id} className="card">
        <div style={{fontWeight:700,fontSize:14,marginBottom:16,color:"var(--tx)"}}>Q{i+1}. {q.text}</div>

        {(q.type==="mc"||q.type==="yn")&&(()=>{
          const opts=q.type==="yn"?["Yes","No"]:q.options;
          return opts.map(o=>{
            const c=ans.filter(a=>a===o).length;
            const p=ans.length?Math.round(c/ans.length*100):0;
            return(<div key={o} style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
              <div style={{width:140,fontSize:13,textAlign:"right",color:"var(--tx)",flexShrink:0,fontWeight:500}}>{o}</div>
              <div className="rb"><div className="rf" style={{width:p+"%",background:p>50?"var(--su)":"var(--p)"}}/></div>
              <div style={{fontSize:13,fontWeight:700,width:44,color:"var(--p)"}}>{p}%</div>
              <div style={{fontSize:12,color:"var(--mu)",width:28}}>{c}</div>
            </div>);
          });
        })()}

        {q.type==="rating"&&(()=>{
          const vs=sv.responses.map(r=>parseInt(r.ans[q.id])).filter(Boolean);
          const avg=vs.length?(vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(1):"—";
          return(<div>
            <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:16}}>
              <div style={{fontSize:40,fontWeight:800,color:"var(--p)"}}>{avg}</div>
              <div style={{fontSize:14,color:"var(--mu)"}}>/ 5 average · {vs.length} responses</div>
            </div>
            {[5,4,3,2,1].map(n=>{
              const c=vs.filter(v=>v===n).length;const p=vs.length?Math.round(c/vs.length*100):0;
              return(<div key={n} style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}>
                <div style={{width:80,fontSize:13,textAlign:"right",color:"#f59e0b"}}>{"★".repeat(n)}</div>
                <div className="rb"><div className="rf" style={{width:p+"%"}}/></div>
                <div style={{fontSize:12,color:"var(--mu)",width:36}}>{c} ({p}%)</div>
              </div>);
            })}
          </div>);
        })()}

        {q.type==="text"&&(<div>
          {ans.length===0&&<div style={{color:"var(--mu)",fontSize:13}}>No text answers yet.</div>}
          {ans.map((a,j)=>(
            <div key={j} style={{background:"#f9fafb",border:"1px solid var(--bd)",borderRadius:8,padding:"11px 15px",fontSize:13,marginBottom:8,lineHeight:1.6,fontStyle:"italic",color:"var(--tx)"}}>
              <span style={{color:"var(--mu)",fontStyle:"normal",marginRight:6}}>#{j+1}</span>"{a}"
            </div>
          ))}
        </div>)}
      </div>);
    })}
  </div>);
}

function AllResponses({surveys}){
  const all=surveys.flatMap(s=>s.responses.map(r=>({...r,st:s.title,sid:s.id}))).sort((a,b)=>new Date(b.at)-new Date(a.at));
  return(<div>
    <div style={{fontSize:22,fontWeight:700,color:"var(--tx)",marginBottom:4}}>All Responses</div>
    <div style={{fontSize:13,color:"var(--mu)",marginBottom:20}}>{all.length} total responses across {surveys.length} survey{surveys.length!==1?"s":""}.</div>
    <div className="tbl-wrap"><table>
      <thead><tr><th>#</th><th>Survey</th><th>Respondent</th><th>Email</th><th>Submitted</th></tr></thead>
      <tbody>
        {all.length===0&&<tr><td colSpan={5} style={{textAlign:"center",padding:40,color:"var(--mu)"}}>No responses yet across any survey.</td></tr>}
        {all.map((r,i)=>(
          <tr key={i}>
            <td style={{color:"var(--mu)"}}>{i+1}</td>
            <td style={{fontWeight:600,fontSize:13}}>{r.st}</td>
            <td>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <Av auth={{name:r.name,picture:r.picture}} size={26}/>
                <span style={{fontWeight:500,fontSize:13}}>{r.name||"—"}</span>
              </div>
            </td>
            <td style={{color:"var(--mu)",fontSize:12}}>{r.email}</td>
            <td style={{color:"var(--mu)",fontSize:12,whiteSpace:"nowrap"}}>{fdt(r.at)}</td>
          </tr>
        ))}
      </tbody>
    </table></div>
  </div>);
}

/* ── NEW SURVEY MODAL ── */
function NewSurveyModal({onClose,onSave}){
  const [f,setF]=useState({title:"",desc:"",start:"",end:""});
  const s=k=>v=>setF(x=>({...x,[k]:v}));
  return(<div className="mbg"><div className="mod">
    <div className="mod-title">Create New Survey</div>
    <div className="fg"><label className="fl">Survey Title *</label><input className="fi" value={f.title} onChange={e=>s("title")(e.target.value)} placeholder="e.g. Annual Performance Feedback 2026" autoFocus/></div>
    <div className="fg"><label className="fl">Description</label><textarea className="fi" rows={3} value={f.desc} onChange={e=>s("desc")(e.target.value)} placeholder="Briefly describe the purpose of this survey..." style={{resize:"vertical"}}/></div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      <div className="fg"><label className="fl">Start Date</label><input className="fi" type="date" value={f.start} onChange={e=>s("start")(e.target.value)}/></div>
      <div className="fg"><label className="fl">End Date</label><input className="fi" type="date" value={f.end} onChange={e=>s("end")(e.target.value)}/></div>
    </div>
    <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:4}}>
      <button className="btn bg2" onClick={onClose}>Cancel</button>
      <button className="btn bp" onClick={()=>{if(!f.title.trim())return alert("Survey title is required.");onSave({id:nid(),...f,status:"draft",created:new Date().toISOString().slice(0,10),questions:[],responses:[]});}}>Create Survey</button>
    </div>
  </div></div>);
}

/* ── QUESTION MODAL ── */
function QModal({init,onClose,onSave}){
  const [txt,setTxt]=useState(init?.text||"");
  const [tp,setTp]=useState(init?.type||"mc");
  const [opts,setOpts]=useState(init?.options?.length?init.options:["",""]);
  const [req,setReq]=useState(init?.req||false);
  const save=()=>{
    if(!txt.trim())return alert("Question text is required.");
    if(tp==="mc"&&opts.filter(o=>o.trim()).length<2)return alert("Please add at least 2 options.");
    onSave({text:txt,type:tp,options:tp==="mc"?opts.filter(o=>o.trim()):[],req});
  };
  const typeInfo={mc:"Respondents choose one option from a list.",text:"Respondents type a free-form answer.",rating:"Respondents rate from 1 (Poor) to 5 (Excellent).",yn:"Respondents choose Yes or No."};
  return(<div className="mbg"><div className="mod">
    <div className="mod-title">{init?"Edit Question":"Add New Question"}</div>
    <div className="fg"><label className="fl">Question Text *</label><input className="fi" value={txt} onChange={e=>setTxt(e.target.value)} placeholder="What do you want to ask?" autoFocus/></div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:4}}>
      <div className="fg"><label className="fl">Question Type</label>
        <select className="fi" value={tp} onChange={e=>setTp(e.target.value)}>
          <option value="mc">🔘 Multiple Choice</option>
          <option value="text">✍️ Open Text</option>
          <option value="rating">⭐ Rating (1–5)</option>
          <option value="yn">👍 Yes / No</option>
        </select>
      </div>
      <div className="fg"><label className="fl">Required?</label>
        <div style={{display:"flex",alignItems:"center",gap:10,marginTop:10,cursor:"pointer"}} onClick={()=>setReq(r=>!r)}>
          <button className={`tog ${req?"on":"off"}`}/>
          <span style={{fontSize:13,color:"var(--mu)"}}>{req?"Yes — required":"No — optional"}</span>
        </div>
      </div>
    </div>
    <div style={{background:"#f0f9ff",border:"1px solid #bae6fd",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#0c4a6e",marginBottom:16}}>{typeInfo[tp]}</div>
    {tp==="mc"&&<div className="fg"><label className="fl">Answer Options</label>
      {opts.map((o,i)=>(
        <div key={i} style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
          <span style={{fontSize:13,color:"var(--mu)",width:24,textAlign:"right",flexShrink:0}}>{String.fromCharCode(65+i)}.</span>
          <input className="fi" value={o} onChange={e=>setOpts(p=>p.map((x,j)=>j===i?e.target.value:x))} placeholder={`Option ${i+1}`} style={{flex:1}}/>
          {opts.length>2&&<button className="btn bg2" style={{fontSize:12,padding:"4px 9px",color:"var(--da)",flexShrink:0}} onClick={()=>setOpts(p=>p.filter((_,j)=>j!==i))}>✕</button>}
        </div>
      ))}
      <button className="btn bg2" style={{fontSize:12,padding:"5px 13px",marginTop:2}} onClick={()=>setOpts(p=>[...p,""])}>+ Add option</button>
    </div>}
    <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:8}}>
      <button className="btn bg2" onClick={onClose}>Cancel</button>
      <button className="btn bp" onClick={save}>{init?"Update Question":"Add Question"}</button>
    </div>
  </div></div>);
}

/* ══════════════════════════════════════════════════
   USER / RESPONDENT APP
══════════════════════════════════════════════════ */
function UserApp({auth,surveys,setSurveys,out,toast2}){
  const [sel,setSel]=useState(null);
  const active=surveys.filter(s=>s.status==="active");
  const mine=surveys.flatMap(s=>s.responses.filter(r=>r.email===auth.email).map(r=>({...r,st:s.title})));
  const done=sv=>sv.responses.some(r=>r.email===auth.email);

  const submit=(sv,ans)=>{
    const r={id:nid(),email:auth.email,name:auth.name,picture:auth.picture||null,at:new Date().toISOString(),ans};
    setSurveys(s=>s.map(x=>x.id===sv.id?{...x,responses:[...x.responses,r]}:x));
    setSel(null);
    toast2("🎉 Response submitted successfully! Thank you.");
  };

  return(<div style={{minHeight:"100vh",background:"var(--bg)"}}>
    <div className="nav">
      <div className="nav-logo">
        <span style={{fontSize:22}}>📋</span>
        <div>
          <div className="nav-logo-text">{C.APP_NAME}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,.6)",marginTop:-1}}>{C.ORG_NAME}</div>
        </div>
      </div>
      <div className="nav-r">
        <Av auth={auth}/>
        <div style={{lineHeight:1.3}}>
          <div className="nav-user" style={{fontWeight:600,color:"#fff",fontSize:13}}>{auth.name}</div>
          <div className="nav-user" style={{fontSize:11}}>{auth.email}</div>
        </div>
        <button className="btn bg2" style={{color:"#fff",borderColor:"rgba(255,255,255,.25)",fontSize:12}} onClick={out}>Sign out</button>
      </div>
    </div>

    {sel
      ?<SurveyFill sv={sel} auth={auth} back={()=>setSel(null)} submit={submit} already={done(sel)}/>
      :<div className="main" style={{maxWidth:720}}>
        <div style={{fontSize:22,fontWeight:700,color:"var(--tx)",marginBottom:4}}>Hello, {auth.given_name||auth.name.split(" ")[0]} 👋</div>
        <div style={{fontSize:14,color:"var(--mu)",marginBottom:22}}>Complete the surveys assigned to your team.</div>

        {active.length===0&&<div className="empty"><div style={{fontSize:56}}>📭</div><p style={{marginTop:16,fontSize:17,fontWeight:600}}>No active surveys right now</p><p style={{fontSize:13,marginTop:8}}>Your admin will notify you when a new survey is launched.</p></div>}

        {active.map(sv=>(
          <div key={sv.id} className="card" style={{cursor:"pointer",transition:"box-shadow .15s,transform .15s",border:done(sv)?"1px solid #bbf7d0":"1px solid var(--bd)"}} onClick={()=>setSel(sv)}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:16}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:16,marginBottom:6,color:"var(--tx)"}}>{sv.title}</div>
                <div style={{fontSize:13,color:"var(--mu)",marginBottom:12,lineHeight:1.5}}>{sv.desc}</div>
                <div style={{fontSize:12,color:"var(--mu)",display:"flex",gap:18,flexWrap:"wrap"}}>
                  <span>📅 Closes {fd(sv.end)}</span>
                  <span>❓ {sv.questions.length} question{sv.questions.length!==1?"s":""}</span>
                  <span>⏱️ ~{sv.questions.length} min</span>
                </div>
              </div>
              <div style={{flexShrink:0,marginTop:2}}>
                {done(sv)
                  ?<span className="bdg bdg-active">✓ Submitted</span>
                  :<button className="btn bp" style={{fontSize:13}}>Start →</button>
                }
              </div>
            </div>
          </div>
        ))}

        {mine.length>0&&<div style={{marginTop:30}}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:14,color:"var(--tx)"}}>My Submissions</div>
          {mine.map((r,i)=>(
            <div key={i} className="card-sm" style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
              <div>
                <div style={{fontWeight:600,fontSize:14,color:"var(--tx)"}}>{r.st}</div>
                <div style={{fontSize:12,color:"var(--mu)",marginTop:3}}>Submitted on {fdt(r.at)}</div>
              </div>
              <span className="bdg bdg-active">✓ Submitted</span>
            </div>
          ))}
        </div>}
      </div>
    }
  </div>);
}

/* ── SURVEY FILL ── */
function SurveyFill({sv,auth,back,submit,already}){
  const [ans,setAns]=useState({});
  const [step,setStep]=useState(0);
  const [done,setDone]=useState(already);
  const q=sv.questions[step];
  const total=sv.questions.length;
  const pct=Math.round(((step)/total)*100);
  const setA=(id,v)=>setAns(a=>({...a,[id]:v}));
  const canNext=!q?.req||ans[q?.id];

  const finish=()=>{
    const miss=sv.questions.filter(q=>q.req&&!ans[q.id]);
    if(miss.length){alert(`Please answer all required questions (${miss.length} remaining).`);return;}
    submit(sv,ans);setDone(true);
  };

  if(done) return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"70vh"}}>
      <div style={{textAlign:"center",padding:48}}>
        <div style={{fontSize:80,marginBottom:18}}>🎉</div>
        <div style={{fontSize:28,fontWeight:800,marginBottom:10,color:"var(--tx)"}}>Thank You!</div>
        <div style={{fontSize:15,color:"var(--mu)",marginBottom:8}}>Your response has been recorded successfully.</div>
        <div style={{fontSize:13,color:"var(--mu)",marginBottom:30}}>— {C.ORG_NAME} Survey Team</div>
        <button className="btn bp" style={{fontSize:15,padding:"11px 30px"}} onClick={back}>← Back to Surveys</button>
      </div>
    </div>
  );

  return(<div className="sfw main">
    <button className="btn bg2" style={{marginBottom:20,fontSize:12}} onClick={back}>← Back to Surveys</button>
    <div className="card" style={{marginBottom:20,borderLeft:"4px solid var(--p)",paddingLeft:20}}>
      <div style={{fontWeight:700,fontSize:18,marginBottom:4,color:"var(--tx)"}}>{sv.title}</div>
      <div style={{fontSize:13,color:"var(--mu)",lineHeight:1.5}}>{sv.desc}</div>
    </div>

    <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:24}}>
      <span style={{fontSize:13,color:"var(--mu)",whiteSpace:"nowrap",fontWeight:500}}>Question {step+1} of {total}</span>
      <div className="pb" style={{flex:1,margin:0}}><div className="pf" style={{width:pct+"%"}}/></div>
      <span style={{fontSize:13,fontWeight:700,color:"var(--p)",whiteSpace:"nowrap"}}>{pct}%</span>
    </div>

    <div className="card" style={{minHeight:240}}>
      <div style={{display:"flex",gap:14,marginBottom:22}}>
        <div className="qnum">{step+1}</div>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:16,lineHeight:1.45,color:"var(--tx)"}}>{q.text}</div>
          {q.req&&<div style={{fontSize:12,color:"var(--da)",marginTop:5,fontWeight:600}}>* This question is required</div>}
        </div>
      </div>

      {q.type==="mc"&&q.options.map(o=>(
        <div key={o} className={`opt${ans[q.id]===o?" sel":""}`} onClick={()=>setA(q.id,o)}>
          <div style={{width:20,height:20,borderRadius:"50%",border:`2px solid ${ans[q.id]===o?"var(--p)":"var(--bd)"}`,background:ans[q.id]===o?"var(--p)":"#fff",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",transition:"all .12s"}}>
            {ans[q.id]===o&&<div style={{width:8,height:8,borderRadius:"50%",background:"#fff"}}/>}
          </div>
          <span style={{fontSize:14}}>{o}</span>
        </div>
      ))}

      {q.type==="text"&&<textarea className="fi" rows={6} value={ans[q.id]||""} onChange={e=>setA(q.id,e.target.value)} placeholder="Type your answer here..." style={{resize:"vertical",fontSize:14,lineHeight:1.6}}/>}

      {q.type==="rating"&&<div>
        <div style={{display:"flex",gap:14,marginTop:4,flexWrap:"wrap"}}>
          {[1,2,3,4,5].map(n=>(
            <div key={n} className={`rat${ans[q.id]===String(n)?" sel":""}`} onClick={()=>setA(q.id,String(n))}>{n}</div>
          ))}
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:10,fontSize:12,color:"var(--mu)",maxWidth:296}}>
          <span>1 = Very Poor</span><span>5 = Excellent</span>
        </div>
      </div>}

      {q.type==="yn"&&<div style={{display:"flex",gap:16,marginTop:4}}>
        {["Yes","No"].map(o=>(
          <div key={o} className={`opt${ans[q.id]===o?" sel":""}`} style={{flex:1,justifyContent:"center",padding:"20px 16px",fontSize:16,fontWeight:700,gap:10}} onClick={()=>setA(q.id,o)}>
            <span style={{fontSize:24}}>{o==="Yes"?"✅":"❌"}</span>{o}
          </div>
        ))}
      </div>}
    </div>

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:18}}>
      <button className="btn bg2" disabled={step===0} onClick={()=>setStep(s=>s-1)} style={{opacity:step===0?.4:1,fontSize:13}}>← Previous</button>
      <span style={{fontSize:12,color:"var(--mu)"}}>{total-step-1} question{total-step-1!==1?"s":""} remaining</span>
      {step<total-1
        ?<button className="btn bp" disabled={!canNext} onClick={()=>setStep(s=>s+1)} style={{opacity:canNext?1:.4,fontSize:13}}>Next Question →</button>
        :<button className="btn bs" onClick={finish} style={{fontSize:13,padding:"9px 24px"}}>Submit Survey ✓</button>
      }
    </div>
  </div>);
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
