<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
html, body, #root { min-height: 100vh; }
body { background: #F8FAFB; }

:root {
  --ttn-primary: #00519F;
  --ttn-red: #00519F;
  --ttn-darkblue: #00519F;
  --ttn-purple: #623FA3;
  --ttn-cyan: #00C2E9;
  --ttn-gold: #F9AD1B;
  --success: #10B981;
  --danger: #EF4444;
}

/* ========== NAVIGATION ========== */
.nav {
  background: linear-gradient(135deg, #00519F 0%, #003C7A 100%);
  color: white;
  padding: 0 28px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 10px 40px rgba(0, 81, 159, 0.2);
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-logo-img {
  height: 48px;
  width: auto;
  object-fit: contain;
}

.nav-branding {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-logo-text {
  font-size: 20px;
  font-weight: 800;
  color: white;
  letter-spacing: -0.5px;
}

.nav-org {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.8);
  font-weight: 500;
}

.nav-badge {
  background: #F9AD1B;
  color: #1F2937;
  font-size: 12px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 6px;
  margin-left: 12px;
}

.nav-r {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-left: auto;
}

/* ========== LAYOUT ========== */
.lay { display: flex; min-height: calc(100vh - 80px); }
.side { width: 260px; background: white; border-right: 2px solid #E5E7EB; padding: 20px 0; position: sticky; top: 80px; height: calc(100vh - 80px); overflow-y: auto; }

.si {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  font-size: 14px;
  color: #374151;
  cursor: pointer;
  border-left: 4px solid transparent;
  transition: all 0.2s;
}

.si:hover { background: #FFF5F2; color: var(--ttn-red); }
.si.on {
  background: linear-gradient(90deg, rgba(0, 81, 159, 0.1) 0%, transparent 100%);
  color: var(--ttn-red);
  border-left-color: var(--ttn-red);
  font-weight: 600;
}

.side-sec { margin: 20px 20px 8px; font-size: 10px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 1px; }

.main { flex: 1; padding: 36px 40px; overflow-y: auto; background: #F8FAFB; }

/* ========== CARDS ========== */
.card {
  background: white;
  border-radius: 14px;
  border: 1px solid #E5E7EB;
  padding: 24px;
  margin-bottom: 22px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  transition: all 0.3s;
}

.card:hover { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); }

/* ========== CATEGORY SECTION ========== */
.category-section {
  background: linear-gradient(135deg, rgba(0, 81, 159, 0.05) 0%, rgba(0, 194, 233, 0.05) 100%);
  border: 2px solid rgba(0, 81, 159, 0.2);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 24px;
  border-left: 6px solid var(--ttn-red);
}

.category-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--ttn-red);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.category-badge {
  background: var(--ttn-red);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
}

/* ========== BUTTONS ========== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  white-space: nowrap;
}

.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, #00519F 0%, #003D7A 100%);
  color: white;
  box-shadow: 0 4px 14px rgba(0, 81, 159, 0.4);
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(0, 81, 159, 0.5);
}

.btn-success {
  background: linear-gradient(135deg, #10B981 0%, #059669 100%);
  color: white;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
}

.btn-success:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(16, 185, 129, 0.5);
}

.btn-outline {
  background: white;
  color: var(--ttn-red);
  border: 2px solid var(--ttn-red);
}

.btn-outline:hover:not(:disabled) { background: #FFF5F2; }

.btn-ghost {
  background: white;
  color: #374151;
  border: 1px solid #E5E7EB;
}

.btn-ghost:hover:not(:disabled) { background: #F9FAFB; color: var(--ttn-red); }

/* ========== BADGES ========== */
.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
}

.badge-active { background: #D1FAE5; color: #065F46; }
.badge-draft { background: #FEF3C7; color: #92400E; }
.badge-ended { background: #FEE2E2; color: #991B1B; }

/* ========== STAT GRID ========== */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  margin-bottom: 28px;
}

.stat-card {
  background: white;
  border: 1px solid #E5E7EB;
  border-radius: 14px;
  padding: 24px;
  border-left: 5px solid var(--ttn-primary);
  box-shadow: 0 2px 8px rgba(0, 81, 159, 0.08);
}

.stat-number {
  font-size: 36px;
  font-weight: 800;
  color: var(--ttn-primary);
  line-height: 1;
}

.stat-label {
  font-size: 12px;
  color: #374151;
  margin-top: 8px;
  font-weight: 500;
}

/* ========== FORMS ========== */
.input, .textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #E5E7EB;
  border-radius: 10px;
  font-size: 14px;
  color: #111827;
  outline: none;
  background: white;
  transition: all 0.2s;
  font-family: inherit;
}

.input:focus, .textarea:focus {
  border-color: var(--ttn-red);
  box-shadow: 0 0 0 4px rgba(0, 81, 159, 0.1);
}

.label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #111827;
}

.form-group { margin-bottom: 18px; }

/* ========== TABS ========== */
.tab-row {
  display: flex;
  border-bottom: 2px solid #E5E7EB;
  margin-bottom: 24px;
  gap: 8px;
}

.tab {
  padding: 12px 22px;
  font-size: 14px;
  font-weight: 500;
  color: #374151;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  transition: all 0.2s;
}

.tab.active {
  color: var(--ttn-red);
  border-bottom-color: var(--ttn-red);
  font-weight: 600;
}

/* ========== TABLES ========== */
.table-wrapper {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid #E5E7EB;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  background: linear-gradient(90deg, #F8FAFB 0%, #F0F4F8 100%);
  padding: 14px 16px;
  text-align: left;
  font-weight: 700;
  font-size: 11px;
  color: #374151;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  border-bottom: 2px solid #E5E7EB;
}

td {
  padding: 14px 16px;
  border-bottom: 1px solid #E5E7EB;
  color: #111827;
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: #F9FAFB; }

/* ========== SURVEY GRID ========== */
.survey-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}

.survey-card {
  background: white;
  border: 1px solid #E5E7EB;
  border-radius: 14px;
  padding: 24px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
  border-top: 5px solid var(--ttn-red);
}

.survey-card:hover {
  box-shadow: 0 12px 32px rgba(0, 81, 159, 0.2);
  transform: translateY(-4px);
}

/* ========== PROGRESS ========== */
.progress-bar {
  background: #E5E7EB;
  border-radius: 99px;
  height: 7px;
  overflow: hidden;
  margin-bottom: 24px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--ttn-red) 0%, var(--ttn-gold) 100%);
  border-radius: 99px;
  transition: width 0.4s;
}

/* ========== QUESTION STYLING ========== */
.question-number {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, #00519F 0%, #003D7A 100%);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(0, 81, 159, 0.4);
}

.option {
  padding: 14px 16px;
  border: 2px solid #E5E7EB;
  border-radius: 12px;
  margin-bottom: 10px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.2s;
  background: white;
}

.option:hover { border-color: var(--ttn-red); background: #FFF5F2; }
.option.selected {
  border-color: var(--ttn-red);
  background: rgba(0, 81, 159, 0.08);
  font-weight: 600;
}

.rating-button {
  width: 60px;
  height: 60px;
  border: 2px solid #E5E7EB;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-weight: 700;
  font-size: 18px;
  transition: all 0.2s;

// Generate questions with categories
function generateQuestions() {
  const questions = [];
  Object.entries(SURVEY_CATEGORIES).forEach(([catKey, cat]) => {
    cat.questions.forEach((q, idx) => {
      questions.push({
        id: `${catKey}_${idx}`,
        category: catKey,
        categoryLabel: cat.label,
        ...q
      });
    });
  });
  return questions;
}

const DEFAULT_QUESTIONS = generateQuestions();

/* HELPERS */
const fd = d => d ? new Date(d).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "—";
const fdt = d => d ? new Date(d).toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const configured = () => SF.CLIENT_ID && !SF.CLIENT_ID.startsWith("PASTE_");
const isAdmin = e => (SF.ADMINS || []).map(a => a.toLowerCase()).includes((e || "").toLowerCase());
const inDomain = e => (e || "").toLowerCase().endsWith("@" + SF.DOMAIN.toLowerCase());

function parseJwt(t) {
  try { return JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); }
  catch { return null; }
}

const surveysRef = () => db.collection("surveys");
const responsesRef = sid => db.collection("surveys").doc(sid).collection("responses");

async function loadSurveys() {
  const snap = await surveysRef().get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function saveSurvey(sv) {
  const { id, ...data } = sv;
  if (id && !id.startsWith("new_")) {
    await surveysRef().doc(id).set(data, { merge: true });
    return id;
  } else {
    const ref = await surveysRef().add({ ...data, createdAt: new Date().toISOString() });
    return ref.id;
  }
}

async function updateSurvey(id, patch) {
  await surveysRef().doc(id).update(patch);
}

async function saveResponse(sid, resp) {
  await responsesRef(sid).add(resp);
}

function exportXL(sv, responses) {
  try {
    const wb = XLSX.utils.book_new();
    
    // Create question headers with full text and category
    const questionHeaders = sv.questions.map((q, i) => {
      const categoryInfo = Object.entries(SURVEY_CATEGORIES).find(([key]) => key === q.category);
      const categoryName = categoryInfo ? categoryInfo[1].label : "Unknown";
      return `Q${i + 1}: [${categoryName}] ${q.text}`;
    });
    
    // Sheet 1: Detailed Response Analysis with Individual Summaries
    const headers = ["#", "Email", "Full Name", "Submitted At", ...questionHeaders, "Average", "Summary"];
    
    const rows = responses.map((r, i) => {
      // Get all rating questions and their answers for this person
      const ratingQuestions = sv.questions.filter(q => q.type === "rating");
      const ratingAnswers = ratingQuestions.map((q, idx) => {
        const answer = r.ans[q.id];
        return { answer: parseInt(answer), qIndex: sv.questions.indexOf(q) };
      }).filter(v => !isNaN(v.answer));
      
      const avgRating = ratingAnswers.length > 0 
        ? (ratingAnswers.reduce((sum, v) => sum + v.answer, 0) / ratingAnswers.length).toFixed(2) 
        : "N/A";
      
      // Find questions with low ratings (≤2 now instead of ≤3) and get their question numbers
      const concerns = [];
      sv.questions.forEach((q, qIdx) => {
        if (q.type === "rating") {
          const answer = parseInt(r.ans[q.id]);
          if (!isNaN(answer) && answer <= 2) {
            concerns.push(qIdx + 1); // Store question number (1-indexed)
          }
        }
      });
      
      // Create summary based on concerns
      let summary = "";
      if (concerns.length === 0) {
        if (avgRating >= 4.5) {
          summary = "🌟 No Concerns, Excellent feedback!";
        } else if (avgRating >= 4) {
          summary = "✅ No Concerns, Very happy";
        } else if (avgRating >= 3.5) {
          summary = "👍 No Concerns, Satisfied";
        } else {
          summary = "No specific low ratings";
        }
      } else {
        summary = `⚠️ Major concerns in Q${concerns.join(", Q")}`;
      }
      
      // Build row with all answers
      const answerValues = sv.questions.map(q => r.ans[q.id] || "");
      return [i + 1, r.email, r.name || "", fdt(r.at), ...answerValues, avgRating, summary];
    });
    
    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    
    // Set column widths - make question columns narrower and summary wider
    const colWidths = [5, 20, 18, 18, ...sv.questions.map(() => 16), 12, 30];
    ws['!cols'] = colWidths.map(w => ({ wch: w }));
    
    XLSX.utils.book_append_sheet(wb, ws, "Responses");
    XLSX.writeFile(wb, `${sv.title}_responses_${new Date().toISOString().split('T')[0]}.xlsx`);
  } catch (e) {
    console.error("Export error:", e);
  }
}

function App() {

    try { const s = sessionStorage.getItem("sf_auth_ttn"); return s ? JSON.parse(s) : null; }
    catch { return null; }
  });
  const [toast, setToast] = useState(null);
  const t = m => setToast(m);

  const logout = () => {
    setAuth(null);
    sessionStorage.removeItem("sf_auth_ttn");
    try { if (window.google) google.accounts.id.disableAutoSelect(); } catch { }
    t("👋 Signed out successfully.");
  };

  const onLogin = u => {
    setAuth(u);
    try { sessionStorage.setItem("sf_auth_ttn", JSON.stringify(u)); } catch { }
  };

  return <>
    {!auth && <Login onLogin={onLogin} t={t} />}
    {auth?.role === "admin" && <AdminApp auth={auth} out={logout} t={t} />}
    {auth?.role === "user" && <UserApp auth={auth} out={logout} t={t} />}
    {toast && <Toast msg={toast} done={() => setToast(null)} />}
  </>;
}

function Login({ onLogin, t }) {
  const btnRef = useRef(null);
  const ok = configured();

  const handleCred = useCallback(resp => {
    try {
      const p = parseJwt(resp.credential);
      if (!p?.email) { t("❌ Google sign-in failed."); return; }
      if (!inDomain(p.email)) { t(`❌ Only @${SF.DOMAIN} accounts allowed.`); return; }
      const u = { email: p.email, name: p.name || p.email, picture: p.picture || null, given_name: p.given_name || "", role: isAdmin(p.email) ? "admin" : "user" };
      onLogin(u);
      t(u.role === "admin" ? `✅ Welcome, ${u.given_name}! (Admin)` : `✅ Signed in!`);
    } catch (e) { t("❌ Error: " + e.message); }
  }, [onLogin, t]);

  useEffect(() => {
    if (!ok) return;
    const init = () => {
      if (!window.google || !btnRef.current) return;
      try {
        google.accounts.id.initialize({ client_id: SF.CLIENT_ID, callback: handleCred, hosted_domain: SF.DOMAIN, auto_select: false, ux_mode: "popup" });
        google.accounts.id.renderButton(btnRef.current, { theme: "outline", size: "large", width: 380, text: "signin_with", shape: "rectangular" });
      } catch (e) { console.error("GSI error:", e); }
    };
    if (window.google) init();
    else { const iv = setInterval(() => { if (window.google) { clearInterval(iv); init(); } }, 250); return () => clearInterval(iv); }
  }, [ok, handleCred]);

  return (
    <div className="login-wrapper">

function AdminApp({ auth, out, t }) {
  const [surveys, setSurveys] = useState([]);
  const [loading, setLoading] = useState(true);
  const [pg, setPg] = useState("dash");
  const [sel, setSel] = useState(null);
  const [atab, setAtab] = useState("questions");
  const [nm, setNm] = useState(false);

  useEffect(() => {
    const unsub = surveysRef().onSnapshot(snap => {
      const sorted = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      setSurveys(sorted);
      setLoading(false);
    }, err => { console.error(err); setLoading(false); });
    return () => unsub();
  }, []);

  useEffect(() => {
    if (sel) setSel(s => surveys.find(x => x.id === s?.id) || s);
  }, [surveys]);

  const go = p => { setPg(p); setSel(null); };
  const handleNew = async sv => { 
    try { 
      const surveyWithQuestions = { 
        ...sv, 
        questions: DEFAULT_QUESTIONS,
        status: "draft",
        responseCount: 0,
        createdAt: new Date().toISOString()
      };
      await saveSurvey(surveyWithQuestions); 
      setNm(false); 
      t("✅ Survey created with all categories and questions!"); 
    } catch (e) { 
      t("❌ Error: " + e.message); 
    } 
  };
  const handleUpd = async (id, patch) => { try { await updateSurvey(id, patch); } catch (e) { t("❌ Error: " + e.message); } };
  const handleDel = async (id, title) => {
    if (window.confirm(`⚠️ Delete "${title}"?\n\nThis will remove the survey and all its responses. This action cannot be undone.`)) {
      try {
        await surveysRef().doc(id).delete();
        setSurveys(s => s.filter(x => x.id !== id));
        t("🗑️ Survey deleted.");
      } catch (e) {
        t("❌ Delete failed: " + e.message);
      }
    }
  };

  if (loading) return <div className="loader"><div className="spinner"></div><p>Loading...</p></div>;

  return (

function Dashboard({ surveys }) {
  return (
    <div>
      <div style={{ fontSize: 28, fontWeight: 800, marginBottom: 6, background: "linear-gradient(135deg, #00519F 0%, #F9AD1B 100%)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", backgroundClip: "text" }}>Dashboard</div>
      <div style={{ fontSize: 14, color: "#6B7280", marginBottom: 28 }}>Overview of all surveys</div>
      <div className="stat-grid">
        <div className="stat-card"><div className="stat-number">{surveys.length}</div><div className="stat-label">Total Surveys</div></div>
        <div className="stat-card"><div className="stat-number">{surveys.filter(s => s.status === "active").length}</div><div className="stat-label">Active Surveys</div></div>
      </div>
    </div>
  );
}

function SurveysList({ surveys, onSelect, handleNew, handleUpd, handleDel, t }) {
  return (
    <div>
      <div style={{ fontSize: 28, fontWeight: 800, marginBottom: 6 }}>Surveys</div>
      <div style={{ fontSize: 14, color: "#6B7280", marginBottom: 28 }}>Create and manage surveys</div>
      <button className="btn btn-primary" onClick={() => handleNew({ title: "New Survey", desc: "Share your feedback" })}>+ Create Survey</button>
    </div>
  );
}

  const [loading, setLoading] = useState(true);
  const [sel, setSel] = useState(null);
  const [myResponses, setMyResponses] = useState({});

  useEffect(() => {
    const unsub = surveysRef().onSnapshot(snap => {
      const sorted = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      setSurveys(sorted);
      
      // Load user's responses
      Promise.all(sorted.map(sv => 
        responsesRef(sv.id).where("email", "==", auth.email).get()
          .then(snap => snap.docs.length > 0)
          .catch(() => false)
      )).then(results => {
        const resp = {};
        sorted.forEach((sv, idx) => {
          if (results[idx]) resp[sv.id] = true;
        });
        setMyResponses(resp);
        setLoading(false);
      });
    }, err => { console.error(err); setLoading(false); });
    return () => unsub();
  }, [auth.email]);

  const submit = async (sv, ans) => {
    try {
      await saveResponse(sv.id, { email: auth.email, name: auth.name, ans, at: new Date().toISOString() });
      setMyResponses(r => ({ ...r, [sv.id]: true }));
      t("✅ Response saved!");
    } catch (e) {
      t("❌ Error saving response: " + e.message);
    }
  };

            <div className="nav-logo-text">Newer Pulse Survey</div>
            <div className="nav-org">{SF.ORG}</div>
          </div>

          <div style={{ fontSize: 14, color: "#6B7280", marginBottom: 28 }}>Share your feedback to help us build a better workplace</div>
          {surveys.length === 0 && <div className="empty-state"><div className="empty-icon">📭</div><p className="empty-title">No active surveys</p></div>}
          {surveys.map(sv => (
            <div key={sv.id} className="card" style={{ cursor: "pointer" }} onClick={() => setSel(sv)}>
              <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 8 }}>{sv.title}</div>
                  <div style={{ fontSize: 13, color: "#6B7280", marginBottom: 14, lineHeight: 1.6 }}>{sv.desc}</div>
                  <div style={{ fontSize: 12, color: "#6B7280", display: "flex", gap: 18, flexWrap: "wrap" }}>
                    <span>📅 Closes {fd(sv.end)}</span>
                    <span>❓ {(sv.questions || []).length} questions</span>
                    <span>⏱️ ~{Math.ceil((sv.questions || []).length / 3)} min</span>
                  </div>
                </div>
                <div style={{ flexShrink: 0 }}>
                  {myResponses[sv.id] ? <span className="badge badge-active">✓ Done</span> : <button className="btn btn-primary" style={{ fontSize: 13 }}>Start →</button>}
                </div>
              </div>
            </div>
          ))}

}

function SurveyFill({ sv, auth, back, submit, already }) {
  const [ans, setAns] = useState({});
  const [done, setDone] = useState(already);
  const [submitting, setSubmitting] = useState(false);
  const [showThankYou, setShowThankYou] = useState(false);
  const qs = (sv.questions && Array.isArray(sv.questions) && sv.questions.length > 0) ? sv.questions : DEFAULT_QUESTIONS;
  const setA = (id, v) => setAns(a => ({ ...a, [id]: v }));
  const ratingQs = qs.filter(q => q.type === "rating");
  const textQs = qs.filter(q => q.type === "text");

  const finish = async () => {
    const miss = qs.filter(q => q.req && !ans[q.id]);
    if (miss.length) { alert(`Answer ${miss.length} required question(s).`); return; }
    setSubmitting(true);
    await submit(sv, ans);
    setShowThankYou(true);
    setSubmitting(false);
    setTimeout(() => {
      setDone(true);
      setShowThankYou(false);
    }, 3000);
  };

  const downloadResponses = () => {
    const data = {
      survey: sv.title,
      respondent: auth.name,
      email: auth.email,
      submittedAt: new Date().toLocaleString("en-IN"),
      responses: {}
    };
    
    qs.forEach(q => {
      const answer = ans[q.id];
      if (q.type === "rating") {
        data.responses[q.text] = RESPONSE_LABELS[answer] || answer;
      } else {
        data.responses[q.text] = answer;
      }
    });
    
    const csv = "Survey Responses\n\n" +
      `Survey: ${data.survey}\n` +
      `Name: ${data.respondent}\n` +
      `Email: ${data.email}\n` +
      `Submitted: ${data.submittedAt}\n\n` +
      Object.entries(data.responses).map(([q, a]) => `"${q}","${a}"`).join("\n");
    
    const blob = new Blob([csv], { type: "text/csv" });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `survey_responses_${Date.now()}.csv`;
    a.click();
    window.URL.revokeObjectURL(url);
  };

  if (done && already) return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "70vh" }}>
      <div style={{ textAlign: "center", padding: 48 }}>
        <div style={{ fontSize: 80, marginBottom: 20 }}>✓</div>
        <div style={{ fontSize: 28, fontWeight: 800, marginBottom: 12 }}>You have already shared your inputs</div>
        <div style={{ fontSize: 15, color: "#6B7280", marginBottom: 32 }}>Thank you for your participation!</div>
        <button className="btn btn-primary" style={{ fontSize: 15, padding: "12px 32px" }} onClick={back}>← Back to Home</button>
      </div>
    </div>
  );

  if (showThankYou) return (
    <ThankYouModal onClose={back} onDownload={downloadResponses} />
  );

  if (done) return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "70vh" }}>
      <div style={{ textAlign: "center", padding: 48 }}>
        <div style={{ fontSize: 80, marginBottom: 20 }}>🎉</div>
        <div style={{ fontSize: 28, fontWeight: 800, marginBottom: 12 }}>Thank You!</div>
        <div style={{ fontSize: 15, color: "#6B7280", marginBottom: 32 }}>Your feedback matters. We're committed to creating an even better workplace.</div>
        <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap" }}>
          <button className="btn btn-primary" onClick={downloadResponses}>📥 Download Your Responses</button>
          <button className="btn btn-ghost" onClick={back}>← Back to Home</button>
        </div>
      </div>
    </div>
  );

  if (qs.length === 0) return <div className="survey-fill-width main"><button className="btn btn-ghost" onClick={back}>← Back</button><div className="card"><p>No questions</p></div></div>;

  return (
    <div className="survey-fill-width main">
      <button className="btn btn-ghost" style={{ marginBottom: 22 }} onClick={back}>← Back</button>
      <div className="card" style={{ marginBottom: 22, borderLeft: "4px solid #00519F" }}>
        <div style={{ fontWeight: 700, fontSize: 18, marginBottom: 6 }}>
          {sv.title || "Newer Pulse Survey"}
        </div>
        <div style={{ fontSize: 13, color: "#6B7280", lineHeight: 1.6 }}>
          {sv.desc || "Share your feedback to help us build a better workplace"}
        </div>
      </div>

      {/* Rating Questions Section */}
      {ratingQs.length > 0 && (
        <div>
          {ratingQs.map((q, idx) => (
            <div key={q.id} className="card" style={{ minHeight: 180 }}>
              <div style={{ display: "flex", gap: 14, marginBottom: 24 }}>
                <div className="question-number">{idx + 1}</div>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 17, lineHeight: 1.45, marginBottom: 4 }}>{q.text}</div>
                  {q.req && <div style={{ fontSize: 12, color: "#EF4444", marginTop: 6, fontWeight: 600 }}>* Required</div>}
                </div>
              </div>

              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {["1", "2", "3", "4", "5"].map(n => (
                  <div
                    key={n}
                    className={`response-option${ans[q.id] === n ? " selected" : ""}`}
                    onClick={() => setA(q.id, n)}
                  >
                    <div className="response-dot"></div>
                    <div className="response-label">{RESPONSE_LABELS[n]}</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Text Questions Section */}
      {textQs.length > 0 && (
        <div>
          {textQs.map((q, idx) => (
            <div key={q.id} className="card" style={{ minHeight: 200 }}>
              <div style={{ display: "flex", gap: 14, marginBottom: 24 }}>
                <div className="question-number">{ratingQs.length + idx + 1}</div>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 17, lineHeight: 1.45, marginBottom: 4 }}>{q.text}</div>
                  {q.req && <div style={{ fontSize: 12, color: "#EF4444", marginTop: 6, fontWeight: 600 }}>* Required</div>}
                </div>
              </div>
              <textarea
                className="textarea"
                rows={6}
                value={ans[q.id] || ""}
                onChange={e => setA(q.id, e.target.value)}
                placeholder="Share your thoughts..."
                style={{ resize: "vertical" }}
              />
            </div>
          ))}
        </div>
      )}

      <div style={{ display: "flex", justifyContent: "flex-end", gap: 12, marginTop: 22 }}>
        <button className="btn btn-success" disabled={submitting} style={{ padding: "10px 26px" }} onClick={finish}>
          {submitting ? "Submitting..." : "Submit ✓"}
        </button>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
